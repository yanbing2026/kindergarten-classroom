<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5d9c2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Classroom">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="A supplemental kindergarten learning app: letters, numbers, words, Chinese, Spanish, colors, shapes, animals, and math.">
    <title>⛏️ Minecraft Classroom ⛏️</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-sky-top: #7ec8e3;
            --mc-sky-bottom: #cdeefb;
            --mc-grass: #5d9c2e;
            --mc-grass-dark: #457a20;
            --mc-dirt: #8b5a2b;
            --mc-dirt-dark: #6b431f;
            --mc-wood: #c8a165;
            --mc-wood-dark: #a07c46;
            --mc-stone: #9a9a9a;
            --mc-stone-dark: #707070;
            --mc-diamond: #4ec9e0;
            --mc-gold: #ffd700;
            --mc-emerald: #3fbf5f;
            --mc-redstone: #d64530;
            --mc-ink: #2b1b0e;
            --mc-panel: #d8b988;
            --font-pixel: 'Press Start 2P', monospace;
            --font-clear: system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        html, body { height: 100%; overscroll-behavior: none; }
        body {
            font-family: var(--font-clear);
            background: linear-gradient(180deg, var(--mc-sky-top) 0%, var(--mc-sky-bottom) 70%);
            min-height: 100vh;
            padding: 16px 16px 46px;
            position: relative;
        }
        body::after {
            content: '';
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 40px;
            background:
                linear-gradient(180deg, var(--mc-grass) 0 10px, var(--mc-dirt) 10px 40px),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.12) 0 4px, transparent 4px 40px);
            border-top: 3px solid var(--mc-grass-dark);
            z-index: 0;
        }
        .container {
            background:
                repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0 6px, transparent 6px 24px),
                var(--mc-panel);
            border: 4px solid var(--mc-ink);
            border-radius: 6px;
            padding: 24px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 12px 0 rgba(0,0,0,0.25), inset 4px 4px 0 rgba(255,255,255,0.25), inset -4px -4px 0 rgba(0,0,0,0.2);
            min-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }
        .topbar-left, .topbar-right { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            font-size: 1.6rem;
            background: var(--mc-stone);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 3px 3px 0 rgba(255,255,255,0.45), inset -3px -3px 0 rgba(0,0,0,0.3);
            width: 56px;
            height: 56px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:active { transform: translateY(2px); box-shadow: inset -3px -3px 0 rgba(255,255,255,0.45), inset 3px 3px 0 rgba(0,0,0,0.3); }
        .star-badge {
            font-family: var(--font-pixel);
            background: var(--mc-diamond);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 3px 3px 0 rgba(255,255,255,0.45), inset -3px -3px 0 rgba(0,0,0,0.25);
            padding: 12px 16px;
            font-size: 1rem;
            color: #063a42;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        h1 { font-family: var(--font-pixel); text-align: center; font-size: 1.5rem; line-height: 1.6; color: var(--mc-emerald); text-shadow: 3px 3px 0 rgba(0,0,0,0.35); margin-bottom: 20px; }
        h2 { font-family: var(--font-pixel); text-align: center; font-size: 1.1rem; line-height: 1.6; color: var(--mc-ink); text-shadow: 2px 2px 0 rgba(255,255,255,0.4); margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--mc-wood);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.35), inset -4px -4px 0 rgba(0,0,0,0.25);
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.05s;
            position: relative;
            min-height: 96px;
        }
        .card:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(255,255,255,0.35), inset 4px 4px 0 rgba(0,0,0,0.25); }
        .card.cat-letters { background: var(--mc-wood); }
        .card.cat-numbers { background: var(--mc-stone); }
        .card.cat-words { background: #e8d9b5; }
        .card.cat-colors { background: #eef0f2; }
        .card.cat-shapes { background: #cfe0e6; }
        .card.cat-animals { background: var(--mc-grass); }
        .card.cat-chinese { background: #e2a63c; }
        .card.cat-spanish { background: #e08a4f; }
        .card.cat-math { background: var(--mc-gold); }
        .card.cat-progress { background: var(--mc-diamond); }
        .icon { font-size: 3.2rem; margin-bottom: 8px; }
        .label { font-family: var(--font-clear); font-size: 1.3rem; color: var(--mc-ink); font-weight: 700; }
        .sublabel { font-family: var(--font-clear); font-size: 0.85rem; color: rgba(43,27,14,0.65); margin-top: 4px; }
        .mastered-check {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--mc-emerald);
            color: white;
            border: 2px solid var(--mc-ink);
            border-radius: 4px;
            width: 24px;
            height: 24px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .big-btn {
            font-family: var(--font-pixel);
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 10px auto;
            padding: 20px 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            cursor: pointer;
            color: white;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.35), inset -4px -4px 0 rgba(0,0,0,0.3);
        }
        .big-btn.learn { background: var(--mc-diamond); }
        .big-btn.play { background: var(--mc-redstone); }
        .big-btn.again { background: var(--mc-emerald); }
        .big-btn.home { background: var(--mc-wood-dark); }
        .big-btn.write { background: var(--mc-gold); color: var(--mc-ink); }
        .big-btn:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(255,255,255,0.35), inset 4px 4px 0 rgba(0,0,0,0.3); }
        .center-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .prompt-box { margin-bottom: 24px; }
        .prompt-visual { font-size: 5rem; margin-bottom: 8px; }
        .prompt-word { font-family: var(--font-clear); font-size: 2.2rem; font-weight: 800; color: var(--mc-ink); letter-spacing: 2px; }
        .choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 460px;
        }
        .choice-btn {
            font-family: var(--font-clear);
            background: #f3e6c8;
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.4), inset -4px -4px 0 rgba(0,0,0,0.2);
            padding: 20px 10px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--mc-ink);
            cursor: pointer;
        }
        .choice-btn.word-choice { font-size: 1.6rem; }
        .choice-btn.chinese-choice { flex-direction: column; font-size: 1.8rem; gap: 4px; }
        .choice-btn.chinese-choice .pinyin { font-size: 0.8rem; font-weight: 400; color: #666; }
        .choice-btn:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(255,255,255,0.4), inset 4px 4px 0 rgba(0,0,0,0.2); }
        .choice-btn.correct { background: #bdf2cf; border-color: var(--mc-emerald); animation: pop 0.4s; }
        .choice-btn.incorrect { background: #f7c9c2; border-color: var(--mc-redstone); animation: shake 0.4s; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .replay-btn {
            font-family: var(--font-clear);
            background: var(--mc-gold);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 3px 3px 0 rgba(255,255,255,0.4), inset -3px -3px 0 rgba(0,0,0,0.25);
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--mc-ink);
            margin: 10px 0 20px;
            cursor: pointer;
        }
        .progress-bar-track {
            background: var(--mc-stone-dark);
            border: 2px solid var(--mc-ink);
            border-radius: 4px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar-fill { background: var(--mc-emerald); height: 100%; }
        .footer { text-align: center; color: rgba(43,27,14,0.55); margin-top: 20px; font-size: 0.8rem; }
        .dots-wrap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 320px; font-size: 2.2rem; margin-bottom: 10px; }
        .math-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
        .math-group { display: flex; flex-wrap: wrap; gap: 4px; max-width: 160px; font-size: 2rem; }
        .math-op { font-family: var(--font-pixel); font-size: 1.8rem; color: var(--mc-ink); }
        .trophy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 14px; margin-top: 16px; }
        .trophy { font-family: var(--font-clear); background: var(--mc-wood); border: 3px solid var(--mc-ink); border-radius: 4px; box-shadow: inset 3px 3px 0 rgba(255,255,255,0.35), inset -3px -3px 0 rgba(0,0,0,0.2); padding: 16px; text-align: center; color: var(--mc-ink); font-weight: 700; }
        .trophy.locked { opacity: 0.4; background: var(--mc-stone); }
        .trophy .icon { font-size: 2.4rem; margin-bottom: 4px; }
        .trace-box {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 220px;
            background: #f3e6c8;
            border: 3px solid var(--mc-ink);
            border-radius: 8px;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.4), inset -4px -4px 0 rgba(0,0,0,0.15);
            margin: 0 auto;
            overflow: hidden;
        }
        .trace-ghost {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-clear);
            font-weight: 800;
            color: rgba(43,27,14,0.2);
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            padding: 10px;
            text-align: center;
            word-break: break-word;
        }
        .trace-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
        .trace-controls { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
        .confetti-burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
        .confetti-piece { position: absolute; font-size: 1.8rem; animation: fall 1.1s ease-in forwards; }
        @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(70vh) rotate(360deg); opacity: 0; } }
    </style>
</head>

    // ---------- Progress storage ----------
    function loadProgress() {
        try {
            const raw = localStorage.getItem('kc_progress_v1');
            if (raw) {
                const p = JSON.parse(raw);
                // Migrate pre-levels saves: mathCorrect used to be a single
                // number, and mastery was keyed by category only (always
                // Kindergarten content back then).
                if (typeof p.mathCorrect === 'number') p.mathCorrect = {};
                if (!p.mathCorrect || typeof p.mathCorrect !== 'object') p.mathCorrect = {};
                if (p.mastery) {
                    const migrated = {};
                    for (const k in p.mastery) {
                        if (/_L\d+$/.test(k)) migrated[k] = p.mastery[k];       // already new scheme
                        else if (/_K$|_G1$/.test(k)) migrated[k] = p.mastery[k]; // old per-level key
                        else migrated[k + '_L1'] = p.mastery[k];                // old category-only key
                    }
                    p.mastery = migrated;
                } else {
                    p.mastery = {};
                }
                return p;
            }
        } catch (e) {}
        return { stars: 0, mastery: {}, mathCorrect: {} };
    }
    function saveProgress() { localStorage.setItem('kc_progress_v1', JSON.stringify(progress)); }

    function getMasteryCount(cat, id) {
        return (progress.mastery[cat] && progress.mastery[cat][id]) || 0;

    function bumpMastery(cat, id) {
        if (!progress.mastery[cat]) progress.mastery[cat] = {};
        progress.mastery[cat][id] = (progress.mastery[cat][id] || 0) + 1;
    }
    function categoryMasteredCount(cat, items) {
        return items.filter(it => getMasteryCount(cat, it.id) >= MASTERY_THRESHOLD).length;
    }
    function categoryMasteredAllLevels(cat) {
        let mastered = 0, total = 0;
        for (const lv of cat.levels) {
            mastered += categoryMasteredCount(`${cat.key}_${lv.id}`, lv.items);
            total += lv.items.length;
        }
        return { mastered, total };

    // ---------- Audio ----------
    let muted = localStorage.getItem('kc_muted') === '1';

    // ---------- Voice selection ----------
    // Browsers expose several voices per language; the default is often a
    // low-quality robotic one. Score the available voices and cache the
    // best pick per language so speech sounds as natural as possible.
    let voiceCache = {};
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => { voiceCache = {}; };
    }
    function scoreVoice(v, lang) {
        let score = 0;
        const name = v.name.toLowerCase();
        if (v.lang && v.lang.toLowerCase() === lang.toLowerCase()) score += 5;
        const goodMarkers = ['natural', 'neural', 'enhanced', 'premium', 'google', 'wavenet'];
        goodMarkers.forEach(m => { if (name.includes(m)) score += 3; });
        const knownGoodNames = ['samantha', 'tingting', 'ting-ting', 'sinji', 'mei-jia', 'monica', 'paulina', 'juan', 'jorge', 'diego', 'zosia', 'ava', 'zoe'];
        knownGoodNames.forEach(n => { if (name.includes(n)) score += 2; });
        const badMarkers = ['espeak', 'compact', 'robot'];
        badMarkers.forEach(m => { if (name.includes(m)) score -= 3; });
        if (v.localService) score += 1;
        return score;
    }
    function getBestVoice(lang) {
        if (!('speechSynthesis' in window)) return null;
        if (lang in voiceCache) return voiceCache[lang];
        const voices = window.speechSynthesis.getVoices();
        const langPrefix = lang.split('-')[0];
        const matches = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
        let best = null;
        if (matches.length) {
            best = matches.slice().sort((a, b) => scoreVoice(b, lang) - scoreVoice(a, lang))[0];
        }
        voiceCache[lang] = best;
        return best;
    }

    function playBrowserUtterance(text, lang, rate) {
        return new Promise((resolve) => {
            if (!('speechSynthesis' in window)) { resolve(); return; }
            try {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = lang; u.rate = rate || 0.85; u.pitch = 1.1;
                const voice = getBestVoice(lang);
                if (voice) u.voice = voice;
                u.onend = resolve; u.onerror = resolve;
                window.speechSynthesis.speak(u);
            } catch (e) { resolve(); }
        });
    }

    function stopAllAudio() {
        if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    }
    function speak(text, opts) {
        if (muted) return;
        stopAllAudio();
        const lang = (opts && opts.lang) || 'en-US';
        playBrowserUtterance(text, lang).catch(() => {});
    }
    function speakSequence(parts, rate) {
        if (muted) return;
        stopAllAudio();
        (async () => {
            for (const p of parts) {
                await playBrowserUtterance(p, 'en-US', rate || 0.7);
            }
        })().catch(() => {});
    }
    function speakBilingual(foreignText, foreignLang, enText) {
        if (muted) return;
        stopAllAudio();
        (async () => {
            await playBrowserUtterance(foreignText, foreignLang);
            await playBrowserUtterance(enText, 'en-US');
        })().catch(() => {});
    }

        const prev = state.stack.pop();
        if (prev) { state.screen = prev.screen; state.params = prev.params; }

    // ---------- Helpers ----------
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }
    function pickChoices(pool, correct, count) {
        const others = pool.filter(p => p.id !== correct.id);
        const chosen = shuffle(others).slice(0, count - 1).concat([correct]);
        return shuffle(chosen);
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

    // ---------- Shape rendering ----------
    function shapeVisualHTML(item, size) {
        size = size || 70;
        if (item.emoji) return `<div style="font-size:${size*0.75}px;">${item.emoji}</div>`;
        const s = `width:${size}px;height:${size}px;background:#667eea;`;
        switch (item.id) {
            case 'Circle': return `<div style="${s}border-radius:50%;"></div>`;
            case 'Square': return `<div style="${s}"></div>`;
            case 'Rectangle': return `<div style="width:${size*1.4}px;height:${size*0.7}px;background:#667eea;"></div>`;
            case 'Oval': return `<div style="width:${size*1.4}px;height:${size*0.8}px;background:#667eea;border-radius:50%;"></div>`;
            case 'Triangle': return `<div style="width:0;height:0;border-left:${size/2}px solid transparent;border-right:${size/2}px solid transparent;border-bottom:${size}px solid #667eea;"></div>`;
            case 'Pentagon': return `<div style="${s}clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);"></div>`;
            case 'Hexagon': return `<div style="${s}clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);"></div>`;
            case 'Octagon': return `<div style="${s}clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);"></div>`;
            case 'Trapezoid': return `<div style="width:${size*1.3}px;height:${size*0.8}px;background:#667eea;clip-path:polygon(20% 0%,80% 0%,100% 100%,0% 100%);"></div>`;
            default: return '';
        }
    }
    function colorVisualHTML(item, size) {
        size = size || 90;
        const border = item.border ? 'border:2px solid #ddd;' : '';
        return `<div style="width:${size}px;height:${size}px;background:${item.hex};border-radius:16px;${border}"></div>`;
    }
    function wordMediaHTML(item, size) {
        size = size || 64;
        if (item.img) return `<img src="${item.img}" alt="${esc(item.id)}" style="width:${size}px;height:${size}px;object-fit:contain;">`;
        return `<span style="font-size:${size * 0.55}px;">${item.emoji}</span>`;
    }

    // ---------- Chinese tone helpers ----------
    // Colors and marks for the four tones + neutral tone. Coloring tones is a
    // well-established scaffold for young learners who can't yet read pinyin.
    const TONE_COLORS = { 1:'#e53935', 2:'#fb8c00', 3:'#43a047', 4:'#1e88e5', 0:'#757575' };
    const TONE_MARKS = { 1:'ˉ', 2:'ˊ', 3:'ˇ', 4:'ˋ' };
    const TONE_DIACRITIC = {
        'ā':1,'á':2,'ǎ':3,'à':4, 'ē':1,'é':2,'ě':3,'è':4, 'ī':1,'í':2,'ǐ':3,'ì':4,
        'ō':1,'ó':2,'ǒ':3,'ò':4, 'ū':1,'ú':2,'ǔ':3,'ù':4, 'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4, 'ü':0
    };
    function toneOf(pinyin) {
        for (const ch of (pinyin || '')) {
            if (TONE_DIACRITIC[ch] !== undefined) return TONE_DIACRITIC[ch];
        }
        const m = (pinyin || '').match(/([0-4])/);
        if (m) return parseInt(m[1], 10);
        return 0;
    }
    function pinyinHTML(pinyin, size) {
        size = size || '0.8rem';
        const t = toneOf(pinyin);
        const color = TONE_COLORS[t];
        const mark = TONE_MARKS[t] || '';
        return `<span style="font-size:${size};color:${color};font-weight:700;">${esc(pinyin)} <span style="opacity:0.85;">${mark}</span></span>`;
    }

    // ---------- Render: Home ----------
    function renderHome() {
        const mathSolved = Object.values(progress.mathCorrect).reduce((a, b) => a + (b || 0), 0);
        const cards = CATEGORIES.map(c => {
            const { mastered, total } = categoryMasteredAllLevels(c);
            const sub = c.key === 'math' ? `${mathSolved} solved` : `${mastered}/${total} mastered`;
            const action = c.leveled ? `go('level', {key:'${c.key}'})` : `go('category', {key:'${c.key}', level:'L1'})`;
            return `<div class="card cat-${c.key}" onclick="${action}">
                <div class="icon">${c.icon}</div>
                <div class="label">${c.name}</div>
                <div class="sublabel">${sub}</div>
            </div>`;
        }).join('');
        return `
        ${topbar(false)}
        <h1>⛏️ Minecraft Classroom ⛏️</h1>
        <div class="grid">
            ${cards}
            <div class="card cat-progress" onclick="go('progress')">
                <div class="icon">🏆</div>
                <div class="label">My Progress</div>
                <div class="sublabel">${progress.stars} diamonds</div>
            </div>
        </div>
        <div class="footer">Tap a card to start learning!</div>`;
    }

    // ---------- Render: Level picker ----------
    function renderLevelPicker() {
        const key = state.params.key;
        const cat = CATEGORIES.find(c => c.key === key);
        const isMath = key === 'math';
        const cards = cat.levels.map(lv => {
            let sub;
            if (isMath) {
                sub = `${progress.mathCorrect[lv.id] || 0} solved`;
            } else {
                const m = categoryMasteredCount(`${key}_${lv.id}`, lv.items);
                sub = `${m}/${lv.items.length} mastered`;
            }
            return `<div class="card" onclick="go('category', {key:'${key}', level:'${lv.id}'})">
                <div class="icon">${lv.icon}</div>
                <div class="label">${lv.label}</div>
                <div class="sublabel">${sub}</div>
            </div>`;
        }).join('');
        return `${topbar(true)}
        <h2>${cat.icon} ${cat.name}</h2>
        <div class="grid">${cards}</div>
        <div class="footer">Choose a level!</div>`;
    }

    // ---------- Render: Level picker ----------
    function topbar(showBack) {
        return `<div class="topbar">
            <div class="topbar-left">
                ${showBack ? `<button class="icon-btn" onclick="goBack()">⬅️</button>` : ''}
                <button class="icon-btn" onclick="goHome()">🏠</button>
            </div>
            <div class="topbar-right">
                <div class="star-badge">💎 ${progress.stars}</div>
                <button class="icon-btn" onclick="toggleMute()">${muted ? '🔇' : '🔊'}</button>
            </div>
        </div>`;
    }
    function toggleMute() {
        muted = !muted;
        localStorage.setItem('kc_muted', muted ? '1' : '0');
        render();
    }

    // ---------- Render: Category ----------
    function renderCategory() {
        const { key, level } = state.params;
        const cat = CATEGORIES.find(c => c.key === key);
        const lvLabel = (cat.levels.find(l => l.id === level) || {}).label || '';
        if (key === 'math') {
            const lvNum = parseInt(String(level).replace(/\D/g, ''), 10) || 1;
            const desc = lvNum >= 5 ? 'Practice addition and subtraction!' : 'Practice adding numbers together!';
            return `${topbar(true)}
            <div class="center-col">
                <div style="font-size:4rem;">➕</div>
                <h2>Math — ${lvLabel}</h2>
                <p style="color:#888;margin-bottom:20px;">${desc}</p>
                <button class="big-btn play" onclick="startMath('${level}')">🎮 Play</button>
            </div>`;
        }
        const showWrite = TRACE_CATEGORIES.includes(key);
        return `${topbar(true)}
        <div class="center-col">
            <div style="font-size:4rem;">${cat.icon}</div>
            <h2>${cat.name}${cat.leveled ? ' — ' + lvLabel : ''}</h2>
            <button class="big-btn learn" onclick="go('learn', {key:'${key}', level:'${level}'})">📖 Learn</button>
            ${showWrite ? `<button class="big-btn write" onclick="startTrace('${key}', '${level}')">✏️ Write</button>` : ''}
            <button class="big-btn play" onclick="startQuiz('${key}', '${level}')">🎮 Play</button>
        </div>`;
    }

    // ---------- Render: Learn ----------
    function renderLearn() {
        const { key, level } = state.params;
        const cat = CATEGORIES.find(c => c.key === key);
        const items = getCategoryItems(key, level);
        const scopedKey = `${key}_${level}`;
        const cards = items.map(it => {
            const mastered = getMasteryCount(scopedKey, it.id) >= MASTERY_THRESHOLD;
            let visual, label = it.id;
            if (key === 'letters') visual = `<div class="icon">${it.id}</div>`;
            else if (key === 'numbers') visual = `<div class="icon">${it.n}</div>`;
            else if (key === 'colors') visual = colorVisualHTML(it, 60);
            else if (key === 'shapes') visual = shapeVisualHTML(it, 55);
            else if (key === 'animals') visual = `<div class="icon">${it.emoji}</div>`;
            else if (key === 'words') { visual = `<div class="icon">${wordMediaHTML(it, 56)}</div>`; label = it.id; }
            else if (key === 'chinese') {
                visual = `<div class="icon">${wordMediaHTML(it, 56)}</div>`;
                label = `<div style="font-size:1.4rem;">${it.hanzi}</div>${pinyinHTML(it.pinyin, '0.9rem')}<div style="font-size:0.75rem;color:rgba(43,27,14,0.55);font-weight:400;">${it.en}</div>`;
            }
            else if (key === 'spanish') {
                visual = `<div class="icon">${wordMediaHTML(it, 56)}</div>`;
                label = `<div style="font-size:1.4rem;">${it.es}</div><div style="font-size:0.75rem;color:rgba(43,27,14,0.55);font-weight:400;">${it.en}</div>`;
            }
            return `<div class="card" onclick="learnTap('${key}','${it.id}','${level}')">
                ${mastered ? '<div class="mastered-check">✓</div>' : ''}
                ${visual}
                <div class="label">${label}</div>
            </div>`;
        }).join('');
        return `${topbar(true)}
        <h2>${cat.icon} ${cat.name}${cat.leveled ? ' — ' + (cat.levels.find(l => l.id === level) || {}).label : ''} — Learn</h2>
        <div class="grid">${cards}</div>
        <div class="footer">Tap a card to hear it!</div>`;
    }
    function learnTap(key, id, level) {
        const items = getCategoryItems(key, level);
        if (key === 'letters') {
            const it = items.find(l => l.id === id);
            speakSequence([id, `${id} is for ${it.word}`]);
        } else if (key === 'numbers') {
            speak(id);
        } else if (key === 'words') {
            speakSequence(id.split('').concat([id]));
        } else if (key === 'chinese') {
            const it = items.find(w => w.id === id);
            speakBilingual(it.hanzi, 'zh-CN', it.en);
        } else if (key === 'spanish') {
            const it = items.find(w => w.id === id);
            speakBilingual(it.es, 'es-ES', it.en);
        } else {
            speak(id);
        }
    }

    // ---------- Quiz engine ----------
    let quiz = null;
    function startQuiz(key, level) {
        const items = getCategoryItems(key, level);
        const questions = [];
        for (let i = 0; i < ROUND_LENGTH; i++) questions.push(buildQuestion(key, items, level));
        quiz = { key, level, questions, idx: 0, correctFirstTry: 0, firstAttempt: true, awaitingNext: false, stars: 0 };
        go('play', { key, level });
    }
    function buildQuestion(key, items, level) {
        const correct = items[Math.floor(Math.random() * items.length)];
        if (key === 'letters') {
            if (Math.random() < 0.5) {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'letter-find',
                    promptHTML: `<div class="prompt-word">Find the letter</div><div class="prompt-visual">${correct.id}</div>`,
                    speakText: `Find the letter ${correct.id}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, speak: c.id }))
                };
            } else {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'letter-phonics',
                    promptHTML: `<div class="prompt-word">Which letter does this start with?</div><div class="prompt-visual">${correct.emoji}</div>`,
                    speakText: `${correct.word}. Which letter does it start with?`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, speak: c.id }))
                };
            }
        }
        if (key === 'numbers') {
            if (Math.random() < 0.5) {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'number-find',
                    promptHTML: `<div class="prompt-word">Find the number</div><div class="prompt-visual">${correct.n}</div>`,
                    speakText: `Find the number ${correct.n}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.n, speak: c.n }))
                };
            } else {
                const n = Math.min(correct.n, 10) || 1;
                const target = items.find(i => i.n === n);
                const dots = '🧱'.repeat(n);
                const near = items.filter(i => Math.abs(i.n - n) <= 3 && i.n !== n);
                const choices = shuffle(shuffle(near).slice(0, 3).concat([target]));
                return {
                    mode: 'number-count',
                    promptHTML: `<div class="prompt-word">How many blocks?</div><div class="dots-wrap">${dots}</div>`,
                    speakText: `How many blocks do you count?`,
                    itemId: target.id,
                    choices: choices.map(c => ({ id: c.id, html: c.n, speak: c.n }))
                };
            }
        }
        if (key === 'colors') {
            const choices = pickChoices(items, correct, 4);
            return {
                mode: 'find',
                promptHTML: `<div class="prompt-word">Find the color: ${correct.id}</div>`,
                speakText: `Find the color ${correct.id}`,
                itemId: correct.id,
                choices: choices.map(c => ({ id: c.id, html: colorVisualHTML(c, 70), speak: c.id }))
            };
        }
        if (key === 'shapes') {
            const choices = pickChoices(items, correct, 4);
            return {
                mode: 'find',
                promptHTML: `<div class="prompt-word">Find the shape: ${correct.id}</div>`,
                speakText: `Find the ${correct.id}`,
                itemId: correct.id,
                choices: choices.map(c => ({ id: c.id, html: shapeVisualHTML(c, 60), speak: c.id }))
            };
        }
        if (key === 'animals') {
            const choices = pickChoices(items, correct, 4);
            return {
                mode: 'find',
                promptHTML: `<div class="prompt-word">Find the: ${correct.id}</div>`,
                speakText: `Find the ${correct.id}`,
                itemId: correct.id,
                choices: choices.map(c => ({ id: c.id, html: `<div style="font-size:3rem;">${c.emoji}</div>`, speak: c.id }))
            };
        }
        if (key === 'words') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'word-picture',
                    promptHTML: `<div class="prompt-word">Which word says this?</div><div class="prompt-visual">${wordMediaHTML(correct, 110)}</div>`,
                    speakText: `Which word says this?`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: wordMediaHTML(c, 90), cls: 'word-choice', speak: c.id }))
                };
            } else {
                return {
                    mode: 'word-sound',
                    promptHTML: `<div class="prompt-word">${correct.id}</div><button class="replay-btn" onclick="soundOutCurrentWord()">🔊 Sound it out</button>`,
                    speakText: null,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: wordMediaHTML(c, 90), speak: c.id }))
                };
            }
        }
        if (key === 'chinese') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'chinese-find',
                    promptHTML: `<div class="prompt-visual">${wordMediaHTML(correct, 100)}</div><div class="prompt-word">${correct.en}</div>`,
                    speakText: `Find the Chinese word for ${correct.en}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: `<div>${c.hanzi}</div>${pinyinHTML(c.pinyin, '0.8rem')}`, cls: 'chinese-choice', speak: c.hanzi }))
                };
            } else {
                return {
                    mode: 'chinese-listen',
                    promptHTML: `<div class="prompt-word">${correct.hanzi}</div>${pinyinHTML(correct.pinyin, '1.2rem')}<button class="replay-btn" onclick="replayForeign()">🔊 Listen Again</button>`,
                    speakText: correct.hanzi,
                    lang: 'zh-CN',
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: wordMediaHTML(c, 90), speak: c.en }))
                };
            }
        }
        if (key === 'spanish') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'spanish-find',
                    promptHTML: `<div class="prompt-visual">${wordMediaHTML(correct, 100)}</div><div class="prompt-word">${correct.en}</div>`,
                    speakText: `Find the Spanish word for ${correct.en}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.es, cls: 'word-choice', speak: c.es }))
                };
            } else {
                return {
                    mode: 'spanish-listen',
                    promptHTML: `<div class="prompt-word">${correct.es}</div><button class="replay-btn" onclick="replayForeign()">🔊 Listen Again</button>`,
                    speakText: correct.es,
                    lang: 'es-ES',
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: wordMediaHTML(c, 90), speak: c.en }))
                };
            }
        }
    }
    function soundOutCurrentWord() {
        const q = quiz.questions[quiz.idx];
        speakSequence(q.itemId.split('').concat([q.itemId]));
    }
    function replayForeign() {
        const q = quiz.questions[quiz.idx];
        speak(q.speakText, { lang: q.lang });
    }

    function renderPlay() {
        const q = quiz.questions[quiz.idx];
        const choicesHTML = q.choices.map(c => `
            <button class="choice-btn ${c.cls || ''}" data-id="${esc(c.id)}" onclick="handleChoice('${esc(c.id)}', this)">${c.html}</button>
        `).join('');
        return `${topbar(true)}
        <div class="center-col">
            <div style="color:#999;margin-bottom:8px;">Question ${quiz.idx + 1} of ${quiz.questions.length}</div>
            <div class="prompt-box">${q.promptHTML}</div>
            <div class="choices">${choicesHTML}</div>
        </div>`;
    }
    function afterPlayRender() {
        const q = quiz.questions[quiz.idx];
        if (q.speakText) speak(q.speakText, { lang: q.lang });
    }
    function handleChoice(id, btnEl) {
        if (quiz.awaitingNext) return;
        const q = quiz.questions[quiz.idx];
        const correct = id === q.itemId;
        if (correct) {
            btnEl.classList.add('correct');
            quiz.awaitingNext = true;
            awardStar();
            quiz.stars += 1;
            if (quiz.firstAttempt) {
                bumpMastery(`${quiz.key}_${quiz.level}`, q.itemId);
                quiz.correctFirstTry += 1;
            }
            saveProgress();
            confettiBurst();
            speak(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
            setTimeout(nextQuestion, 900);
        } else {
            btnEl.classList.add('incorrect');
            btnEl.disabled = true;
            quiz.firstAttempt = false;
            speak(RETRY[Math.floor(Math.random() * RETRY.length)]);
        }
        renderTopbarStarsOnly();
    }
    function renderTopbarStarsOnly() {
        const badge = document.querySelector('.star-badge');
        if (badge) badge.textContent = `💎 ${progress.stars}`;
    }
    function nextQuestion() {
        quiz.idx += 1;
        quiz.firstAttempt = true;
        quiz.awaitingNext = false;
        if (quiz.idx >= quiz.questions.length) {
            go('roundEnd', { stars: quiz.stars, key: quiz.key, level: quiz.level });
        } else {
            render();
        }
    }

    // ---------- Math game ----------
    let mathState = null;
    function startMath(level) {
        mathState = { idx: 0, stars: 0, level, questions: [] };
        for (let i = 0; i < ROUND_LENGTH; i++) mathState.questions.push(buildMathQuestion(level));
        go('mathPlay', { level });
    }
    function buildMathQuestion(level) {
        const lvNum = parseInt(String(level).replace(/\D/g, ''), 10) || 1;
        const solved = progress.mathCorrect[level] || 0;
        const range = solved >= 25 ? lvNum + 5 : (solved >= 10 ? lvNum + 3 : lvNum + 1);
        if (lvNum >= 5 && Math.random() < 0.4) {
            const a = 2 + Math.floor(Math.random() * range);
            const b = 1 + Math.floor(Math.random() * (a - 1));
            const answer = a - b;
            const wrongPool = shuffle([answer - 2, answer - 1, answer + 1, answer + 2].filter(n => n >= 0 && n !== answer));
            const choices = shuffle([answer, ...wrongPool.slice(0, 3)]);
            return { op: 'sub', a, b, answer, choices, awaitingNext: false, firstAttempt: true };
        }
        const a = 1 + Math.floor(Math.random() * range);
        const b = 1 + Math.floor(Math.random() * range);
        const answer = a + b;
        const wrongPool = shuffle([answer - 2, answer - 1, answer + 1, answer + 2].filter(n => n > 0 && n !== answer));
        const choices = shuffle([answer, ...wrongPool.slice(0, 3)]);
        return { op: 'add', a, b, answer, choices, awaitingNext: false, firstAttempt: true };
    }
    function renderMathPlay() {
        const q = mathState.questions[mathState.idx];
        const choicesHTML = q.choices.map(n => `
            <button class="choice-btn" data-id="${n}" onclick="handleMathChoice(${n}, this)">${n}</button>
        `).join('');
        const opSymbol = q.op === 'sub' ? '−' : '+';
        return `${topbar(true)}
        <div class="center-col">
            <div style="color:#999;margin-bottom:8px;">Question ${mathState.idx + 1} of ${mathState.questions.length}</div>
            <div class="math-row">
                <div class="math-group">${'🍎'.repeat(q.a)}</div>
                <div class="math-op">${opSymbol}</div>
                <div class="math-group">${'🍎'.repeat(q.b)}</div>
                <div class="math-op">=</div>
                <div class="math-op">?</div>
            </div>
            <div class="choices">${choicesHTML}</div>
        </div>`;
    }
    function afterMathPlayRender() {
        const q = mathState.questions[mathState.idx];
        const verb = q.op === 'sub' ? 'minus' : 'plus';
        const question = q.op === 'sub' ? 'How many apples are left?' : 'How many apples in total?';
        speak(`${q.a} ${verb} ${q.b}. ${question}`);
    }
    function handleMathChoice(n, btnEl) {
        const q = mathState.questions[mathState.idx];
        if (q.awaitingNext) return;
        if (n === q.answer) {
            btnEl.classList.add('correct');
            q.awaitingNext = true;
            awardStar();
            mathState.stars += 1;
            if (q.firstAttempt) { progress.mathCorrect[mathState.level] = (progress.mathCorrect[mathState.level] || 0) + 1; }
            saveProgress();
            confettiBurst();
            speak(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
            setTimeout(nextMathQuestion, 900);
        } else {
            btnEl.classList.add('incorrect');
            btnEl.disabled = true;
            q.firstAttempt = false;
            speak(RETRY[Math.floor(Math.random() * RETRY.length)]);
        }
        renderTopbarStarsOnly();
    }
    function nextMathQuestion() {
        mathState.idx += 1;
        if (mathState.idx >= mathState.questions.length) {
            go('roundEnd', { stars: mathState.stars, key: 'math', level: mathState.level });
        } else {
            render();
        }
    }

    // ---------- Write / Trace ----------
    let traceState = null;
    function getTraceText(key, item) {
        if (key === 'chinese') return item.hanzi;
        if (key === 'spanish') return item.es;
        return item.id;
    }
    function traceFontSize(text) {
        const len = Math.max(1, text.length);
        if (len <= 2) return '8rem';
        if (len <= 4) return '6rem';
        if (len <= 6) return '4.5rem';
        return '3.5rem';
    }
    function speakTraceItem(key, item) {
        if (key === 'letters') {
            speakSequence([item.id, `${item.id} is for ${item.word}`]);
        } else if (key === 'chinese') {
            speakBilingual(item.hanzi, 'zh-CN', item.en);
        } else if (key === 'spanish') {
            speakBilingual(item.es, 'es-ES', item.en);
        } else {
            speak(item.id);
        }
    }
    function startTrace(key, level) {
        const items = getCategoryItems(key, level);
        const pool = shuffle(items).slice(0, Math.min(ROUND_LENGTH, items.length));
        traceState = { key, level, items: pool, idx: 0, stars: 0 };
        go('trace', { key, level });
    }
    function renderTrace() {
        const { key, level } = state.params;
        const cat = CATEGORIES.find(c => c.key === key);
        const item = traceState.items[traceState.idx];
        const text = getTraceText(key, item);
        return `${topbar(true)}
        <div class="center-col">
            <div style="color:#999;margin-bottom:8px;">Item ${traceState.idx + 1} of ${traceState.items.length}</div>
            <h2>${cat.icon} ${cat.name}${cat.leveled ? ' — ' + (cat.levels.find(l => l.id === level) || {}).label : ''} — Write</h2>
            <div class="trace-box">
                <div class="trace-ghost" style="font-size:${traceFontSize(text)};">${esc(text)}</div>
                <canvas id="traceCanvas" class="trace-canvas"></canvas>
            </div>
            ${key === 'chinese' ? `<div style="margin-top:10px;">${pinyinHTML(item.pinyin, '1.1rem')}</div>` : ''}
            <div class="trace-controls">
                <button class="icon-btn" onclick="replayTrace()">🔊</button>
                <button class="icon-btn" onclick="clearTraceCanvas()">🧹</button>
            </div>
            <button class="big-btn again" onclick="nextTraceItem()">➡️ Next</button>
        </div>`;
    }
    function fitTraceGhost(text) {
        const ghost = document.querySelector('.trace-ghost');
        const box = document.querySelector('.trace-box');
        if (!ghost || !box) return;
        const cs = getComputedStyle(ghost);
        const isWide = /[㐀-鿿豈-﫿]/.test(text);
        const span = document.createElement('span');
        span.style.fontFamily = cs.fontFamily;
        span.style.fontWeight = cs.fontWeight;
        span.style.letterSpacing = cs.letterSpacing;
        span.style.whiteSpace = 'nowrap';
        span.style.position = 'absolute';
        span.style.visibility = 'hidden';
        span.style.fontSize = '100px';
        span.textContent = text;
        document.body.appendChild(span);
        const r = span.getBoundingClientRect();
        span.remove();
        const w100 = r.width || 1;
        const h100 = r.height || 100;
        const maxW = box.clientWidth - 12;
        const maxH = box.clientHeight - 12;
        let fs = Math.floor(Math.min(maxW / (w100 / 100), maxH / (h100 / 100)));
        fs = Math.max(24, fs);
        ghost.style.fontSize = fs + 'px';
    }
    function afterTraceRender() {
        const canvas = document.getElementById('traceCanvas');
        if (canvas) {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.strokeStyle = '#3fbf5f';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            let drawing = false;
            let lastX = 0, lastY = 0;
            const getPos = (e) => {
                const r = canvas.getBoundingClientRect();
                return { x: e.clientX - r.left, y: e.clientY - r.top };
            };
            canvas.addEventListener('pointerdown', (e) => {
                drawing = true;
                const p = getPos(e);
                lastX = p.x; lastY = p.y;
                e.preventDefault();
            });
            canvas.addEventListener('pointermove', (e) => {
                if (!drawing) return;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                lastX = p.x; lastY = p.y;
                e.preventDefault();
            });
            const stop = () => { drawing = false; };
            canvas.addEventListener('pointerup', stop);
            canvas.addEventListener('pointerleave', stop);
            canvas.addEventListener('pointercancel', stop);
        }
        const item = traceState.items[traceState.idx];
        fitTraceGhost(getTraceText(traceState.key, item));
        speakTraceItem(traceState.key, item);
    }
    function replayTrace() {
        const item = traceState.items[traceState.idx];
        speakTraceItem(traceState.key, item);
    }
    function clearTraceCanvas() {
        const canvas = document.getElementById('traceCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    function nextTraceItem() {
        awardStar();
        traceState.stars += 1;
        saveProgress();
        confettiBurst();
        renderTopbarStarsOnly();
        traceState.idx += 1;
        if (traceState.idx >= traceState.items.length) {
            go('roundEnd', { stars: traceState.stars, key: 'trace', category: traceState.key, level: traceState.level });
        } else {
            render();
        }
    }

    // ---------- Round end / Progress ----------
    function renderRoundEnd() {
        const { stars, key, level, category } = state.params;
        const isTrace = key === 'trace';
        let againAction;
        if (key === 'math') againAction = `startMath('${level}')`;
        else if (isTrace) againAction = `startTrace('${category}', '${level}')`;
        else againAction = `startQuiz('${key}', '${level}')`;
        return `${topbar(false)}
        <div class="center-col">
            <div style="font-size:4rem;">🎉</div>
            <h2>${isTrace ? 'Great Writing!' : 'Round Complete!'}</h2>
            <p style="font-size:1.4rem;color:#0e6b7a;font-weight:700;margin-bottom:20px;">You earned ${stars} 💎</p>
            <button class="big-btn again" onclick="${againAction}">🔁 ${isTrace ? 'Write More' : 'Play Again'}</button>
            <button class="big-btn home" onclick="goHome()">🏠 Home</button>
        </div>`;
    }
    function renderProgress() {
        const rows = CATEGORIES.map(c => {
            const { mastered, total } = categoryMasteredAllLevels(c);
            const pct = Math.round((mastered / total) * 100);
            return `<div style="margin-bottom:16px;">
                <div style="display:flex;justify-content:space-between;font-weight:700;">
                    <span>${c.icon} ${c.name}</span><span>${mastered}/${total}</span>
                </div>
                <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
            </div>`;
        }).join('');
        const trophies = TROPHIES.map(t => {
            const unlocked = progress.stars >= t;
            return `<div class="trophy ${unlocked ? '' : 'locked'}">
                <div class="icon">${unlocked ? '🏆' : '🔒'}</div>
                <div>${t} diamonds</div>
            </div>`;
        }).join('');
        return `${topbar(true)}
        <h2>🏆 My Progress</h2>
        <div class="star-badge" style="margin:0 auto 20px;width:fit-content;font-size:1.1rem;">💎 ${progress.stars} total diamonds</div>
        ${rows}
        <div style="margin-top:10px;font-weight:700;">Math solved: ${Object.values(progress.mathCorrect).reduce((a, b) => a + (b || 0), 0)} total</div>
        <div class="trophy-grid">${trophies}</div>`;
    }

    // ---------- Main render ----------
    function render() {
        const app = document.getElementById('app');
        let html = '';
        if (state.screen === 'home') html = renderHome();
        else if (state.screen === 'level') html = renderLevelPicker();
        else if (state.screen === 'category') html = renderCategory();
        else if (state.screen === 'learn') html = renderLearn();
        else if (state.screen === 'play') html = renderPlay();
        else if (state.screen === 'mathPlay') html = renderMathPlay();
        else if (state.screen === 'trace') html = renderTrace();
        else if (state.screen === 'roundEnd') html = renderRoundEnd();
        else if (state.screen === 'progress') html = renderProgress();
        app.innerHTML = html;
        if (state.screen === 'play') afterPlayRender();
        if (state.screen === 'mathPlay') afterMathPlayRender();
        if (state.screen === 'trace') afterTraceRender();
    }

    render();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
    </script>
</body>
</html>
