<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5d9c2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Classroom">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="A supplemental kindergarten learning app: letters, numbers, English, Chinese, Spanish, and math.">
    <title>⛏️ Minecraft Classroom ⛏️</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-sky-top: #7ec8e3;
            --mc-sky-bottom: #cdeefb;
            --mc-grass: #5d9c2e;
            --mc-grass-dark: #457a20;
            --mc-dirt: #8b5a2b;
            --mc-dirt-dark: #6b431f;
            --mc-wood: #c8a165;
            --mc-wood-dark: #a07c46;
            --mc-stone: #9a9a9a;
            --mc-stone-dark: #707070;
            --mc-diamond: #4ec9e0;
            --mc-gold: #ffd700;
            --mc-emerald: #3fbf5f;
            --mc-redstone: #d64530;
            --mc-ink: #2b1b0e;
            --mc-panel: #d8b988;
            --font-pixel: 'Press Start 2P', monospace;
            --font-clear: system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        html, body { height: 100%; overscroll-behavior: none; }
        body {
            font-family: var(--font-clear);
            background: linear-gradient(180deg, var(--mc-sky-top) 0%, var(--mc-sky-bottom) 70%);
            min-height: 100vh;
            padding: 16px 16px 46px;
            position: relative;
        }
        body::after {
            content: '';
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 40px;
            background:
                linear-gradient(180deg, var(--mc-grass) 0 10px, var(--mc-dirt) 10px 40px),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.12) 0 4px, transparent 4px 40px);
            border-top: 3px solid var(--mc-grass-dark);
            z-index: 0;
        }
        .container {
            background:
                repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0 6px, transparent 6px 24px),
                var(--mc-panel);
            border: 4px solid var(--mc-ink);
            border-radius: 6px;
            padding: 24px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 12px 0 rgba(0,0,0,0.25), inset 4px 4px 0 rgba(255,255,255,0.25), inset -4px -4px 0 rgba(0,0,0,0.2);
            min-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }
        .topbar-left, .topbar-right { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            font-size: 1.6rem;
            background: var(--mc-stone);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 3px 3px 0 rgba(255,255,255,0.45), inset -3px -3px 0 rgba(0,0,0,0.3);
            width: 56px;
            height: 56px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:active { transform: translateY(2px); box-shadow: inset -3px -3px 0 rgba(255,255,255,0.45), inset 3px 3px 0 rgba(0,0,0,0.3); }
        .star-badge {
            font-family: var(--font-pixel);
            background: var(--mc-diamond);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 3px 3px 0 rgba(255,255,255,0.45), inset -3px -3px 0 rgba(0,0,0,0.25);
            padding: 12px 16px;
            font-size: 1rem;
            color: #063a42;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        h1 { font-family: var(--font-pixel); text-align: center; font-size: 1.5rem; line-height: 1.6; color: var(--mc-emerald); text-shadow: 3px 3px 0 rgba(0,0,0,0.35); margin-bottom: 20px; }
        h2 { font-family: var(--font-pixel); text-align: center; font-size: 1.1rem; line-height: 1.6; color: var(--mc-ink); text-shadow: 2px 2px 0 rgba(255,255,255,0.4); margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--mc-wood);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.35), inset -4px -4px 0 rgba(0,0,0,0.25);
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.05s;
            position: relative;
            min-height: 96px;
        }
        .card:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(255,255,255,0.35), inset 4px 4px 0 rgba(0,0,0,0.25); }
        .card.cat-letters { background: var(--mc-wood); }
        .card.cat-numbers { background: var(--mc-stone); }
        .card.cat-words { background: #e8d9b5; }
        .card.cat-chinese { background: #e2a63c; }
        .card.cat-spanish { background: #e08a4f; }
        .card.cat-math { background: var(--mc-gold); }
        .card.cat-progress { background: var(--mc-diamond); }
        .card.cat-science { background: #a8e6cf; }
        .card.cat-patterns { background: #dda0dd; }
        .card.cat-comparing { background: #ffd93d; }
        .card.cat-positions { background: #87ceeb; }
        .card.cat-measurement { background: #ffb347; }
        .card.cat-time { background: #98fb98; }
        .card.cat-money { background: #ffd700; }
        .card.cat-onemoreless { background: #ff6b6b; }
        .card.cat-rhyming { background: #a18cd1; }
        .card.cat-sightwords { background: #fad390; }
        .icon { font-size: 3.2rem; margin-bottom: 8px; }
        .label { font-family: var(--font-clear); font-size: 1.3rem; color: var(--mc-ink); font-weight: 700; }
        .sublabel { font-family: var(--font-clear); font-size: 0.85rem; color: rgba(43,27,14,0.65); margin-top: 4px; }
        .mastered-check {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--mc-emerald);
            color: white;
            border: 2px solid var(--mc-ink);
            border-radius: 4px;
            width: 24px;
            height: 24px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .big-btn {
            font-family: var(--font-pixel);
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 10px auto;
            padding: 20px 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            cursor: pointer;
            color: white;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.35), inset -4px -4px 0 rgba(0,0,0,0.3);
        }
        .big-btn.learn { background: var(--mc-diamond); }
        .big-btn.play { background: var(--mc-redstone); }
        .big-btn.again { background: var(--mc-emerald); }
        .big-btn.home { background: var(--mc-wood-dark); }
        .big-btn.write { background: var(--mc-gold); color: var(--mc-ink); }
        .big-btn:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(255,255,255,0.35), inset 4px 4px 0 rgba(0,0,0,0.3); }
        .center-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .prompt-box { margin-bottom: 24px; }
        .prompt-visual { font-size: 5rem; margin-bottom: 8px; }
        .prompt-word { font-family: var(--font-clear); font-size: 2.2rem; font-weight: 800; color: var(--mc-ink); letter-spacing: 2px; }
        .choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 460px;
        }
        .choice-btn {
            font-family: var(--font-clear);
            background: #f3e6c8;
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.4), inset -4px -4px 0 rgba(0,0,0,0.2);
            padding: 20px 10px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--mc-ink);
            cursor: pointer;
        }
        .choice-btn.word-choice { font-size: 1.6rem; }
        .choice-btn.chinese-choice { flex-direction: column; font-size: 1.8rem; gap: 4px; }
        .choice-btn:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(255,255,255,0.4), inset 4px 4px 0 rgba(0,0,0,0.2); }
        .choice-btn.correct { background: #bdf2cf; border-color: var(--mc-emerald); animation: pop 0.4s; }
        .choice-btn.incorrect { background: #f7c9c2; border-color: var(--mc-redstone); animation: shake 0.4s; }
        .choice-btn.persist { box-shadow: 0 0 0 4px var(--mc-gold); }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .replay-btn {
            font-family: var(--font-clear);
            background: var(--mc-gold);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 3px 3px 0 rgba(255,255,255,0.4), inset -3px -3px 0 rgba(0,0,0,0.25);
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--mc-ink);
            margin: 10px 0 20px;
            cursor: pointer;
        }
        .progress-bar-track {
            background: var(--mc-stone-dark);
            border: 2px solid var(--mc-ink);
            border-radius: 4px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar-fill { background: var(--mc-emerald); height: 100%; }
        .footer { text-align: center; color: rgba(43,27,14,0.55); margin-top: 20px; font-size: 0.8rem; }
        .dots-wrap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 320px; font-size: 2.2rem; margin-bottom: 10px; }
        .math-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .math-eq { font-family: var(--font-pixel); font-size: 2.2rem; color: var(--mc-ink); line-height: 1.5; display: flex; align-items: center; gap: 10px; }
        .math-eq .op { color: var(--mc-redstone); }
        .math-eq .qm { color: var(--mc-emerald); }
        .trophy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 14px; margin-top: 16px; }
        .trophy { font-family: var(--font-clear); background: var(--mc-wood); border: 3px solid var(--mc-ink); border-radius: 4px; box-shadow: inset 3px 3px 0 rgba(255,255,255,0.35), inset -3px -3px 0 rgba(0,0,0,0.2); padding: 16px; text-align: center; color: var(--mc-ink); font-weight: 700; }
        .trophy.locked { opacity: 0.4; background: var(--mc-stone); }
        .trophy .icon { font-size: 2.4rem; margin-bottom: 4px; }
        .trace-box {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 220px;
            background: #f3e6c8;
            border: 3px solid var(--mc-ink);
            border-radius: 8px;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.4), inset -4px -4px 0 rgba(0,0,0,0.15);
            margin: 0 auto;
            overflow: hidden;
        }
        .trace-ghost {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-clear);
            font-weight: 800;
            color: rgba(43,27,14,0.2);
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            padding: 10px;
            text-align: center;
            white-space: nowrap;
        }
        .trace-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
        .trace-controls { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
        .color-picker { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
        .color-swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--mc-ink); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
        .color-swatch:hover { transform: scale(1.15); }
        .color-swatch.active { box-shadow: 0 0 0 3px var(--mc-gold), 2px 2px 0 rgba(0,0,0,0.2); transform: scale(1.15); }
        .confetti-burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
        .confetti-piece { position: absolute; font-size: 1.8rem; animation: fall 1.1s ease-in forwards; }
        @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(70vh) rotate(360deg); opacity: 0; } }
        .draw-canvas { width: 100%; max-width: 800px; height: 500px; background: #fff; border: 3px solid var(--mc-ink); border-radius: 8px; touch-action: none; cursor: crosshair; box-shadow: inset 4px 4px 0 rgba(255,255,255,0.4), inset -4px -4px 0 rgba(0,0,0,0.15); }
        .draw-toolbar { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 14px; flex-wrap: wrap; }
        .draw-toolbar .icon-btn { font-size: 1.8rem; }
        .draw-swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--mc-ink); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
        .draw-swatch:hover { transform: scale(1.15); }
        .draw-swatch.active { box-shadow: 0 0 0 3px var(--mc-gold), 2px 2px 0 rgba(0,0,0,0.2); transform: scale(1.15); }
        .draw-size { display: flex; gap: 8px; align-items: center; margin-left: 8px; }
        .draw-size-btn { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--mc-ink); background: #f3e6c8; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .draw-size-btn.active { background: var(--mc-gold); }
        .draw-dot { border-radius: 50%; background: var(--mc-ink); }
        .draw-tool-btn { width: 48px; height: 48px; border-radius: 10px; border: 3px solid var(--mc-ink); background: #f3e6c8; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); transition: background 0.15s; }
        .draw-tool-btn:hover { background: #e8d5a8; }
        .draw-tool-btn.active { background: var(--mc-gold); }
        .learn-display { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 40; }
        .learn-display-inner { background: #f3e6c8; border: 4px solid var(--mc-ink); border-radius: 12px; padding: 30px 50px; text-align: center; box-shadow: 6px 6px 0 rgba(0,0,0,0.3); max-width: 90vw; }
        .learn-display-letter { font-size: 6rem; font-family: var(--font-clear); font-weight: 800; color: var(--mc-ink); min-height: 100px; display: flex; align-items: center; justify-content: center; transition: opacity 0.15s; }
        .learn-display-word { font-size: 2.5rem; font-family: var(--font-clear); font-weight: 700; color: var(--mc-ink); margin-top: 10px; }
        .learn-display-sub { font-size: 1.2rem; color: #888; margin-top: 8px; }
        /* Timed Challenge */
        .card.cat-timed { background: #e74c3c; }
        .timer-ring { position: relative; width: 80px; height: 80px; margin: 0 auto 10px; }
        .timer-ring svg { transform: rotate(-90deg); }
        .timer-ring circle { fill: none; stroke-width: 6; }
        .timer-ring .track { stroke: var(--mc-stone-dark); }
        .timer-ring .fill { stroke: var(--mc-emerald); stroke-dasharray: 220; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
        .timer-ring .fill.urgent { stroke: var(--mc-redstone); }
        .timer-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-pixel); font-size: 1.4rem; color: var(--mc-ink); }
        /* Streak */
        .streak-badge {
            font-family: var(--font-pixel);
            font-size: 0.85rem;
            color: var(--mc-ink);
            background: var(--mc-gold);
            border: 2px solid var(--mc-ink);
            border-radius: 4px;
            padding: 6px 12px;
            margin-bottom: 12px;
            display: none;
            animation: pop 0.3s;
        }
        .streak-badge.active { display: inline-block; }
        .streak-badge.fire { background: #ff6b35; color: #fff; }
        .streak-badge.unstoppable { background: #9b59b6; color: #fff; }
        .streak-badge.legendary { background: linear-gradient(135deg, #ffd700, #ff6b35); color: #fff; font-size: 1rem; }
        /* Pattern sequence display */
        .pattern-seq { font-size: 2.4rem; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
        .pattern-q { font-size: 2.4rem; color: var(--mc-redstone); font-weight: 800; }
        /* Comparison visual */
        .compare-wrap { display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 2.5rem; margin-bottom: 10px; }
        .compare-emojis { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .compare-emoji-row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 180px; }
        .compare-symbol { font-family: var(--font-pixel); font-size: 2rem; color: var(--mc-redstone); }
        /* Position scene */
        .position-scene { font-size: 2.8rem; margin-bottom: 10px; letter-spacing: 4px; }
        /* Measurement items */
        .measure-wrap { display: flex; align-items: center; justify-content: center; gap: 30px; font-size: 2rem; margin-bottom: 10px; }
        .measure-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .measure-emoji { font-size: 3rem; }
        /* Coin display */
        .coin-wrap { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
        .coin { font-size: 2.2rem; }
        .coin-label { font-family: var(--font-pixel); font-size: 0.7rem; color: var(--mc-ink); }
        .coin-stack { display: flex; flex-direction: column; align-items: center; }
        /* Word choice for sight words */
        .choice-btn.sightword-choice { font-size: 2.5rem; font-weight: 800; letter-spacing: 3px; }
        .choice-btn.compare-choice { font-size: 2.8rem; font-weight: 800; }
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script>
    // ---------- Data ----------
    // ---------- Levels ----------
    // Per-index level icons, reused by every leveled subject.
    const LEVEL_ICONS = ['🌱','🌿','🔥','⭐','🌟','💎','🪙','🏆','👑','🌈'];

    // ---------- Letters / Numbers / Colors / Shapes (no levels) ----------
    const LETTERS = [
        {id:'A',word:'Apple',emoji:'🍎'},{id:'B',word:'Ball',emoji:'⚽'},{id:'C',word:'Cat',emoji:'🐱'},
        {id:'D',word:'Dog',emoji:'🐶'},{id:'E',word:'Elephant',emoji:'🐘'},{id:'F',word:'Fish',emoji:'🐟'},
        {id:'G',word:'Grapes',emoji:'🍇'},{id:'H',word:'Hat',emoji:'👒'},{id:'I',word:'Ice Cream',emoji:'🍦'},
        {id:'J',word:'Juice',emoji:'🧃'},{id:'K',word:'Kite',emoji:'🪁'},{id:'L',word:'Lion',emoji:'🦁'},
        {id:'M',word:'Moon',emoji:'🌙'},{id:'N',word:'Nest',emoji:'🪺'},{id:'O',word:'Orange',emoji:'🍊'},
        {id:'P',word:'Pig',emoji:'🐷'},{id:'Q',word:'Queen',emoji:'👸'},{id:'R',word:'Rainbow',emoji:'🌈'},
        {id:'S',word:'Sun',emoji:'☀️'},{id:'T',word:'Tree',emoji:'🌳'},{id:'U',word:'Umbrella',emoji:'☂️'},
        {id:'V',word:'Van',emoji:'🚐'},{id:'W',word:'Watermelon',emoji:'🍉'},{id:'X',word:'X-ray',emoji:'🩻'},
        {id:'Y',word:'Yo-yo',emoji:'🪀'},{id:'Z',word:'Zebra',emoji:'🦓'}
    ];
    const NUMBERS = Array.from({length:20}, (_,i) => ({id:String(i+1), n:i+1}));

    // ---------- Shared vocabulary (English / Chinese / Spanish) ----------
    // One source of truth per level. Add a word here and it appears in all three
    // languages automatically. To add a level, append another array to VOCAB_LEVELS.
    const VOCAB_LEVELS = [
        [ // Level 1 — 3–4 letters (mob + item catalog)
            {id:'axe',emoji:'🪓',img:'images/words/axe.png',en:'Axe',zh:{hanzi:'斧'},es:'Hacha'},
            {id:'bat',emoji:'🦇',img:'images/words/bat.png',en:'Bat',zh:{hanzi:'蝙蝠'},es:'Murciélago'},
            {id:'bee',emoji:'🐝',img:'images/words/bee.png',en:'Bee',zh:{hanzi:'蜜蜂'},es:'Abeja'},
            {id:'bow',emoji:'🏹',img:'images/words/bow.png',en:'Bow',zh:{hanzi:'弓'},es:'Arco'},
            {id:'cat',emoji:'🐱',img:'images/words/cat.png',en:'Cat',zh:{hanzi:'猫'},es:'Gato'},

    function loadProgress() {
        try {
            const raw = localStorage.getItem('kc_progress_v1');
            if (raw) {
                const p = JSON.parse(raw);
                // Migrate pre-levels saves: mathCorrect used to be a single
                // number, and mastery was keyed by category only (always
                // Kindergarten content back then).
                if (typeof p.mathCorrect === 'number') p.mathCorrect = {};
                if (!p.mathCorrect || typeof p.mathCorrect !== 'object') p.mathCorrect = {};
                if (p.mastery) {
                    const migrated = {};
                    for (const k in p.mastery) {
                        if (/_L\d+$/.test(k)) migrated[k] = p.mastery[k];       // already new scheme
                        else if (/_K$|_G1$/.test(k)) migrated[k] = p.mastery[k]; // old per-level key
                        else migrated[k + '_L1'] = p.mastery[k];                // old category-only key
                    }
                    p.mastery = migrated;
                } else {
                    p.mastery = {};
                }
                if (!p.due || typeof p.due !== 'object') p.due = {};
                return p;
            }
        } catch (e) {}
        return { stars: 0, mastery: {}, mathCorrect: {} };

    // ---------- Spaced repetition (research B) ----------
    // mastery[cat][id] stays a count (backward-compatible). A parallel due[]
    // map tracks when an item should next be reviewed. Intervals expand as the
    // child masters the item: 1d -> 3d -> 7d -> 14d.
    const SR_INTERVALS_DAYS = [1, 3, 7, 14, 30];
    function srIntervalDays(count) {
        // count = number of times correctly answered (mastery count)
        const idx = Math.max(0, Math.min(count - 1, SR_INTERVALS_DAYS.length - 1));
        return SR_INTERVALS_DAYS[idx];
    }
    function dueTimestampFor(cat, id) {
        const m = (progress.due && progress.due[cat] && progress.due[cat][id]) || 0;
        return m;
    }
    function isDue(cat, id) {
        const t = dueTimestampFor(cat, id);
        return t === 0 || Date.now() >= t;
    }
    function scheduleNextReview(cat, id, count) {
        if (!progress.due) progress.due = {};
        if (!progress.due[cat]) progress.due[cat] = {};
        const days = srIntervalDays(count);
        progress.due[cat][id] = Date.now() + days * 24 * 60 * 60 * 1000;
    }

    function getMasteryCount(cat, id) {
        return (progress.mastery[cat] && progress.mastery[cat][id]) || 0;
    }
    function bumpMastery(cat, id) {
        if (!progress.mastery[cat]) progress.mastery[cat] = {};
        const count = (progress.mastery[cat][id] || 0) + 1;
        progress.mastery[cat][id] = count;
        scheduleNextReview(cat, id, count);
    }
    function categoryMasteredCount(cat, items) {
        return items.filter(it => getMasteryCount(cat, it.id) >= MASTERY_THRESHOLD).length;
    }
    function categoryDueCount(cat, items) {
        return items.filter(it => getMasteryCount(cat, it.id) >= MASTERY_THRESHOLD && isDue(cat, it.id)).length;
    }
    function categoryMasteredAllLevels(cat) {
        let mastered = 0, total = 0;
        for (const lv of cat.levels) {

            total += lv.items.length;

        return { mastered, total };

    // ---------- Voice selection ----------
    // Browsers expose several voices per language; the default is often a
    // low-quality robotic one. Score the available voices and cache the
    // best pick per language so speech sounds as natural as possible.
    let voiceCache = {};
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => { voiceCache = {}; };
    }
    function scoreVoice(v, lang) {
        let score = 0;
        const name = v.name.toLowerCase();
        if (v.lang && v.lang.toLowerCase() === lang.toLowerCase()) score += 5;
        const goodMarkers = ['natural', 'neural', 'enhanced', 'premium', 'google', 'wavenet'];
        goodMarkers.forEach(m => { if (name.includes(m)) score += 3; });
        const knownGoodNames = ['samantha', 'tingting', 'ting-ting', 'sinji', 'mei-jia', 'monica', 'paulina', 'juan', 'jorge', 'diego', 'zosia', 'ava', 'zoe'];
        knownGoodNames.forEach(n => { if (name.includes(n)) score += 2; });
        const badMarkers = ['espeak', 'compact', 'robot'];
        badMarkers.forEach(m => { if (name.includes(m)) score -= 3; });
        if (v.localService) score += 1;
        return score;
    }
    function getBestVoice(lang) {
        if (!('speechSynthesis' in window)) return null;
        if (lang in voiceCache) return voiceCache[lang];
        const voices = window.speechSynthesis.getVoices();
        const langPrefix = lang.split('-')[0];
        const matches = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
        let best = null;
        if (matches.length) {
            best = matches.slice().sort((a, b) => scoreVoice(b, lang) - scoreVoice(a, lang))[0];
        }
        voiceCache[lang] = best;
        return best;
    }

    function playBrowserUtterance(text, lang, rate) {
        return new Promise((resolve) => {
            if (!('speechSynthesis' in window)) { resolve(); return; }
            try {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = lang; u.rate = rate || 0.85; u.pitch = 1.1;
                const voice = getBestVoice(lang);
                if (voice) u.voice = voice;
                u.onend = resolve; u.onerror = resolve;
                window.speechSynthesis.speak(u);
            } catch (e) { resolve(); }
        });
    }

    function stopAllAudio() {
        if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    }

        if (muted) return;

        if (muted) return;

    // ---------- Descriptive praise (research: specific feedback > generic) ----------
    // Builds an item-aware confirmation instead of a random "Good job!".
    function descriptivePraise(key, q) {
        if (key === 'math') {
            const word = MATH_WORD[q.op];
            return `Correct! ${q.a} ${word} ${q.b} is ${q.answer}!`;
        }
        if (key === 'letters') {
            const it = LETTERS.find(l => l.id === q.itemId);
            return it ? `Yes! ${it.id} is for ${it.word}!` : `Correct!`;
        }
        if (key === 'numbers') {
            return `Yes! That is ${q.itemId}!`;
        }
        if (key === 'words') {
            return `Great! That is ${q.itemId}!`;
        }
        if (key === 'chinese') {
            const it = CHINESE.find(w => w.id === q.itemId);
            return it ? `对! ${it.hanzi} is ${it.en}!` : `Correct!`;
        }
        if (key === 'spanish') {
            const it = SPANISH.find(w => w.id === q.itemId);
            return it ? `¡Sí! ${it.es} is ${it.en}!` : `Correct!`;
        }
        return PRAISE[Math.floor(Math.random() * PRAISE.length)];
    }
    function descriptiveRetry(key, q) {
        if (key === 'math') {
            return `Not quite — try again! ${q.a} ${MATH_WORD[q.op]} ${q.b}?`;
        }
        return RETRY[Math.floor(Math.random() * RETRY.length)];
    }
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }
    function pickChoices(pool, correct, count) {
        const others = pool.filter(p => p.id !== correct.id);
        const chosen = shuffle(others).slice(0, count - 1).concat([correct]);
        return shuffle(chosen);
    }

    // ---------- Render: Learn ----------
    function renderLearn() {
        const { key, level } = state.params;
        const cat = CATEGORIES.find(c => c.key === key);
        const items = getCategoryItems(key, level);
        const scopedKey = `${key}_${level}`;
        const cards = items.map(it => {
            const mastered = getMasteryCount(scopedKey, it.id) >= MASTERY_THRESHOLD;
            let visual, label = it.id;
            if (key === 'letters') visual = `<div class="icon">${it.id}</div>`;
            else if (key === 'numbers') visual = `<div class="icon">${it.n}</div>`;
            else if (key === 'words') { visual = `<div class="icon">${wordMediaHTML(it, 56)}</div>`; label = it.id; }
            else if (key === 'chinese') {
                visual = `<div class="icon">${wordMediaHTML(it, 56)}</div>`;
                label = `<div style="font-size:1.4rem;">${it.hanzi}</div><div style="font-size:0.75rem;color:rgba(43,27,14,0.55);font-weight:400;">${it.en}</div>`;
            }
            else if (key === 'spanish') {
                visual = `<div class="icon">${wordMediaHTML(it, 56)}</div>`;
                label = `<div style="font-size:1.4rem;">${it.es}</div><div style="font-size:0.75rem;color:rgba(43,27,14,0.55);font-weight:400;">${it.en}</div>`;
            }
            else if (key === 'science') {
                visual = `<div class="icon" style="font-size:2.5rem;">${it.emoji}</div>`;
                label = `<div style="font-size:1.4rem;">${it.id}</div>`;
            }
            else if (key === 'patterns') {
                const seq = it.sequence.map(e => `<span>${e}</span>`).join('');
                visual = `<div style="font-size:1.2rem;display:flex;gap:3px;align-items:center;justify-content:center;">${seq} <span style="color:var(--mc-redstone);font-weight:800;">❓</span></div>`;
                label = `<div style="font-size:0.9rem;">Pattern</div>`;
            }
            else if (key === 'comparing') {
                const e1 = Array(it.num1).fill(it.emoji1).join('');
                const e2 = Array(it.num2).fill(it.emoji2).join('');
                visual = `<div style="font-size:0.9rem;text-align:center;line-height:1.2;">${e1}<br>⚖️<br>${e2}</div>`;
                label = `<div style="font-size:0.9rem;">${it.num1} vs ${it.num2}</div>`;
            }
            else if (key === 'positions') {
                visual = `<div class="position-scene">${it.scene}</div>`;
                label = `<div style="font-size:0.9rem;">${it.answer}</div>`;
            }
            else if (key === 'measurement') {
                visual = `<div style="font-size:1.2rem;display:flex;gap:6px;align-items:center;justify-content:center;"><span>${it.item1.emoji}</span> vs <span>${it.item2.emoji}</span></div>`;
                label = `<div style="font-size:0.9rem;">${it.item1.label} / ${it.item2.label}</div>`;
            }
            else if (key === 'time') {
                visual = `<div style="font-size:2.5rem;">${it.emoji}</div>`;
                label = `<div style="font-size:1.2rem;font-weight:700;">${it.time || it.activity || ''}</div>`;
            }
            else if (key === 'money') {
                const coinHtml = it.coins.map(c => `<span style="font-size:1rem;">${c.emoji}</span>`).join('');
                visual = `<div style="font-size:1.2rem;">${coinHtml}</div>`;
                label = `<div style="font-size:1.2rem;font-weight:700;">${it.total}¢</div>`;
            }
            else if (key === 'onemoreless') {
                const sym = it.mode === 'more' ? '+ 1' : '- 1';
                visual = `<div style="font-size:2.5rem;font-weight:800;">${it.number} ${sym}</div>`;
                label = `<div style="font-size:1.2rem;">= ${it.answer}</div>`;
            }
            else if (key === 'rhyming') {
                visual = `<div style="font-size:2.5rem;">${it.emoji}</div>`;
                label = `<div style="font-size:1.4rem;font-weight:700;">${it.word}</div>`;
            }
            else if (key === 'sightwords') {
                visual = `<div style="font-size:2.5rem;font-weight:800;letter-spacing:3px;">${it.id}</div>`;
                label = `<div style="font-size:0.9rem;">sight word</div>`;
            }
            return `<div class="card" onclick="learnTap('${key}','${it.id}','${level}')">
                ${mastered ? '<div class="mastered-check">✓</div>' : ''}
                ${visual}
                <div class="label">${label}</div>
            </div>`;
        }).join('');
        return `${topbar(true)}
        <h2>${cat.icon} ${cat.name}${cat.leveled ? ' — ' + (cat.levels.find(l => l.id === level) || {}).label : ''} — Learn</h2>
        <div class="grid">${cards}</div>
        <div class="footer">Tap a card to hear it!</div>`;

    function showLearnDisplay(bigText, subText) {

            overlay.id = 'learnDisplay';
            overlay.className = 'learn-display';

        }
        overlay.innerHTML = `<div class="learn-display-inner">
            <div class="learn-display-letter">${esc(bigText)}</div>
            ${subText ? `<div class="learn-display-word">${esc(subText)}</div>` : ''}
        </div>`;
        overlay.style.display = 'flex';
    }
    function hideLearnDisplay() {
        const overlay = document.getElementById('learnDisplay');
        if (overlay) overlay.style.display = 'none';
    }
    async function speakWithDisplay(text, lang, bigText, subText, rate) {
        showLearnDisplay(bigText || text, subText);
        await playBrowserUtterance(text, lang, rate || 0.85);
    }
    async function learnTap(key, id, level) {
        const items = getCategoryItems(key, level);
        if (key === 'letters') {
            const it = items.find(l => l.id === id);
            for (const ch of id.split('')) {
                await speakWithDisplay(ch, 'en-US', ch);
            }
            showLearnDisplay(id, `${id} is for ${it.word}`);
            await playBrowserUtterance(`${id} is for ${it.word}`, 'en-US', 0.7);
        } else if (key === 'numbers') {
            showLearnDisplay(id);
            await playBrowserUtterance(id, 'en-US');
        } else if (key === 'words') {
            const letters = id.split('');
            for (const ch of letters) {
                await speakWithDisplay(ch, 'en-US', ch, letters.join(''));
            }
            showLearnDisplay(id);
            await playBrowserUtterance(id, 'en-US');
        } else if (key === 'chinese') {
            const it = items.find(w => w.id === id);
            showLearnDisplay(it.hanzi, it.en);
            await playBrowserUtterance(it.hanzi, 'zh-CN');
            showLearnDisplay(it.hanzi, it.en);
            await playBrowserUtterance(it.en, 'en-US');
        } else if (key === 'spanish') {
            const it = items.find(w => w.id === id);
            showLearnDisplay(it.es, it.en);
            await playBrowserUtterance(it.es, 'es-ES');
            showLearnDisplay(it.es, it.en);
            await playBrowserUtterance(it.en, 'en-US');
        } else if (key === 'science') {
            const it = items.find(s => s.id === id);
            showLearnDisplay(`${it.emoji} ${it.id}`, it.fact);
            await playBrowserUtterance(`${it.id}. ${it.fact}`, 'en-US');
        } else if (key === 'patterns') {
            const it = items.find(p => p.id === id);
            const seq = it.sequence.join(' ');
            showLearnDisplay(`${seq} ❓`, `The answer is ${it.answer}`);
            await playBrowserUtterance(`The pattern is ${seq}. What comes next? The answer is ${it.answer}.`, 'en-US');
        } else if (key === 'comparing') {
            const it = items.find(c => c.id === id);
            const sym = it.answer === '>' ? 'greater than' : it.answer === '<' ? 'less than' : 'equal to';
            showLearnDisplay(`${it.num1} ${it.answer} ${it.num2}`, `${it.num1} is ${sym} ${it.num2}`);
            await playBrowserUtterance(`${it.num1} is ${sym} ${it.num2}.`, 'en-US');
        } else if (key === 'positions') {
            const it = items.find(p => p.id === id);
            showLearnDisplay(it.scene, it.scenario);
            await playBrowserUtterance(it.scenario, 'en-US');
        } else if (key === 'measurement') {
            const it = items.find(m => m.id === id);
            showLearnDisplay(`${it.item1.emoji} vs ${it.item2.emoji}`, `${it.question} The answer is ${it.answer}!`);
            await playBrowserUtterance(`${it.question} The answer is ${it.answer}!`, 'en-US');
        } else if (key === 'time') {
            const it = items.find(t => t.id === id);
            const displayText = it.activity ? `${it.emoji} ${it.activity}` : `${it.emoji} ${it.time}`;
            showLearnDisplay(displayText, it.activity ? `This happens in the ${it.time}` : `This clock shows ${it.time}`);
            await playBrowserUtterance(it.activity ? `In the ${it.time}, we ${it.activity.toLowerCase()}` : `This clock shows ${it.time}`, 'en-US');
        } else if (key === 'money') {
            const it = items.find(m => m.id === id);
            const coinList = it.coins.map(c => c.label || (c.value + ' cents')).join(', ');
            showLearnDisplay(`${it.total}¢`, `Coins: ${coinList}`);
            await playBrowserUtterance(`These coins add up to ${it.total} cents. That is ${it.total} cents.`, 'en-US');
        } else if (key === 'onemoreless') {
            const it = items.find(o => o.id === id);
            const word = it.mode === 'more' ? 'one more' : 'one less';
            const expr = it.mode === 'more' ? `${it.number} plus 1` : `${it.number} minus 1`;
            showLearnDisplay(`${it.number} ${it.mode === 'more' ? '+ 1' : '- 1'} = ${it.answer}`, `${word} of ${it.number} is ${it.answer}`);
            await playBrowserUtterance(`${expr} is ${it.answer}. ${word} of ${it.number} is ${it.answer}.`, 'en-US');
        } else if (key === 'rhyming') {
            const it = items.find(r => r.id === id);
            showLearnDisplay(`${it.emoji} ${it.word}`, `Rhymes with: ${it.correct}`);
            await playBrowserUtterance(`${it.word}. ${it.word} rhymes with ${it.correct}.`, 'en-US');
        } else if (key === 'sightwords') {
            const it = items.find(s => s.id === id);
            showLearnDisplay(it.id, 'Sight word');
            await playBrowserUtterance(it.id, 'en-US');
        } else {
            showLearnDisplay(id);
            await playBrowserUtterance(id, 'en-US');
        }
        hideLearnDisplay();
    }

    // ---------- Quiz engine ----------
    let quiz = null;
    function startQuiz(key, level) {
        const items = getCategoryItems(key, level);
        const questions = [];
        for (let i = 0; i < ROUND_LENGTH; i++) questions.push(buildQuestion(key, items, level));
        quiz = { key, level, questions, idx: 0, correctFirstTry: 0, firstAttempt: true, awaitingNext: false, stars: 0, streak: 0 };
        go('play', { key, level });
    }
    function buildQuestion(key, items, level) {
        // Adaptive weighting (research C) + spaced repetition (B):
        // weight each item by how much it needs practice — weak / due items
        // get a higher chance of being selected; already-mastered-and-not-due
        // items are still included but down-weighted.
        const catKey = `${key}_${level}`;
        const weighted = items.map(it => {
            const count = getMasteryCount(catKey, it.id);
            const due = isDue(catKey, it.id);
            let w = 1;
            if (count === 0) w = 5;            // never seen — high priority
            else if (count < MASTERY_THRESHOLD) w = 3; // learning — medium-high
            else if (due) w = 2;                // mastered but due for review
            else w = 0.4;                       // mastered & not due — low
            return { it, w };
        });
        const totalW = weighted.reduce((a, x) => a + x.w, 0);
        let r = Math.random() * totalW, correct = weighted[0].it;
        for (const x of weighted) { r -= x.w; if (r <= 0) { correct = x.it; break; } }
        if (key === 'letters') {
            if (Math.random() < 0.5) {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'letter-find',
                    promptHTML: `<div class="prompt-word">Find the letter</div><div class="prompt-visual">${correct.id}</div>`,
                    speakText: `Find the letter ${correct.id}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, speak: c.id }))
                };
            } else {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'letter-phonics',
                    promptHTML: `<div class="prompt-word">Which letter does this start with?</div><div class="prompt-visual">${correct.emoji}</div>`,
                    speakText: `${correct.word}. Which letter does it start with?`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, speak: c.id }))
                };
            }
        }
        if (key === 'numbers') {
            if (Math.random() < 0.5) {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'number-find',
                    promptHTML: `<div class="prompt-word">Find the number</div><div class="prompt-visual">${correct.n}</div>`,
                    speakText: `Find the number ${correct.n}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.n, speak: c.n }))
                };
            } else {
                const n = Math.min(correct.n, 10) || 1;
                const target = items.find(i => i.n === n);
                const dots = '🧱'.repeat(n);
                const near = items.filter(i => Math.abs(i.n - n) <= 3 && i.n !== n);
                const choices = shuffle(shuffle(near).slice(0, 3).concat([target]));
                return {
                    mode: 'number-count',
                    promptHTML: `<div class="prompt-word">How many blocks?</div><div class="dots-wrap">${dots}</div>`,
                    speakText: `How many blocks do you count?`,
                    itemId: target.id,
                    choices: choices.map(c => ({ id: c.id, html: c.n, speak: c.n }))
                };
            }
        }
        if (key === 'words') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'word-picture',
                    promptHTML: `<div class="prompt-word">Which word says this?</div><div class="prompt-visual">${wordMediaHTML(correct, 110)}</div>`,
                    speakText: `Which word says this?`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, cls: 'word-choice', speak: c.id }))
                };
            } else {
                return {
                    mode: 'word-sound',
                    promptHTML: `<div class="prompt-word">${correct.id}</div><button class="replay-btn" onclick="soundOutCurrentWord()">🔊 Sound it out</button>`,
                    speakText: null,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: wordMediaHTML(c, 90), speak: c.id }))
                };
            }
        }
        if (key === 'chinese') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'chinese-find',
                    promptHTML: `<div class="prompt-visual">${wordMediaHTML(correct, 100)}</div><div class="prompt-word">${correct.en}</div>`,
                    speakText: `Find the Chinese word for ${correct.en}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: `<div>${c.hanzi}</div>`, cls: 'chinese-choice', speak: c.hanzi }))
                };
            } else {
                return {
                    mode: 'chinese-listen',
                    promptHTML: `<div class="prompt-word">${correct.hanzi}</div><button class="replay-btn" onclick="replayForeign()">🔊 Listen Again</button>`,
                    speakText: correct.hanzi,
                    lang: 'zh-CN',
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: wordMediaHTML(c, 90), speak: c.en }))
                };
            }
        }
        if (key === 'spanish') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'spanish-find',
                    promptHTML: `<div class="prompt-visual">${wordMediaHTML(correct, 100)}</div><div class="prompt-word">${correct.en}</div>`,
                    speakText: `Find the Spanish word for ${correct.en}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.es, cls: 'word-choice', speak: c.es }))
                };
            } else {
                return {
                    mode: 'spanish-listen',
                    promptHTML: `<div class="prompt-word">${correct.es}</div><button class="replay-btn" onclick="replayForeign()">🔊 Listen Again</button>`,
                    speakText: correct.es,
                    lang: 'es-ES',
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: wordMediaHTML(c, 90), speak: c.en }))
                };
            }
        }
        if (key === 'science') {
            if (correct.options) {
                // L9+ levels: question-based (magnets, push/pull, materials, survival)
                const choices = correct.options.map(o => ({ id: o, html: o, speak: o }));
                return {
                    mode: 'science-answer',
                    promptHTML: `<div class="prompt-visual"><span style="font-size:5rem;">${correct.emoji}</span></div><div class="prompt-word">${correct.fact.split('.')[0]}?</div>`,
                    speakText: `${correct.fact.split('.')[0]}?`,
                    itemId: correct.answer,
                    choices: shuffle(choices)
                };
            }
            const choices = pickChoices(items, correct, 4);
            return {
                mode: 'science-find',
                promptHTML: `<div class="prompt-visual"><span style="font-size:5rem;">${correct.emoji}</span></div><div class="prompt-word">What is this?</div>`,
                speakText: `What is this?`,
                itemId: correct.id,
                choices: choices.map(c => ({ id: c.id, html: c.id, cls: 'word-choice', speak: c.id }))
            };
        }
        if (key === 'patterns') {
            const seq = correct.sequence.map(e => `<span>${e}</span>`).join('');
            const choices = correct.options.map(o => ({ id: o, html: o, speak: o }));
            return {
                mode: 'pattern-find',
                promptHTML: `<div class="prompt-word">What comes next?</div><div class="pattern-seq">${seq} <span class="pattern-q">❓</span></div>`,
                speakText: `What comes next in the pattern?`,
                itemId: correct.answer,
                choices: shuffle(choices)
            };
        }
        if (key === 'comparing') {
            const emojis1 = Array(correct.num1).fill(correct.emoji1).join('');
            const emojis2 = Array(correct.num2).fill(correct.emoji2).join('');
            const options = ['>', '<', '='];
            const choices = options.map(o => ({ id: o, html: o, cls: 'compare-choice', speak: o === '>' ? 'greater than' : o === '<' ? 'less than' : 'equal to' }));
            return {

    // ---------- Math operation plan by level ----------
    // Progressive difficulty: addition first, then subtraction, then
    // multiplication, then division — all four mixed by Level 10.
    function opsForLevel(lvNum) {
        if (lvNum <= 4) return ['add'];
        if (lvNum <= 7) return ['add', 'sub'];
        if (lvNum <= 9) return ['add', 'sub', 'mul'];
        return ['add', 'sub', 'mul', 'div'];
    }
    const MATH_SYMBOL = { add: '+', sub: '−', mul: '×', div: '÷' };
    const MATH_WORD = { add: 'plus', sub: 'minus', mul: 'times', div: 'divided by' };
    function buildMathQuestion(level) {
        const lvNum = parseInt(String(level).replace(/\D/g, ''), 10) || 1;
        const solved = progress.mathCorrect[level] || 0;
        const ops = opsForLevel(lvNum);
        const op = ops[Math.floor(Math.random() * ops.length)];
        // Answer range: Level 1 = 1-10, Level 2 = 11-20, Level 3 = 21-30, etc.
        const minAnswer = (lvNum - 1) * 10 + 1;
        const maxAnswer = lvNum * 10;
        let a, b, answer;
        if (op === 'add') {
            a = 1 + Math.floor(Math.random() * (maxAnswer - 1));
            b = Math.max(1, minAnswer - a + Math.floor(Math.random() * Math.min(a, maxAnswer - minAnswer + 1)));
            answer = a + b;
            // Ensure answer is in range
            while (answer < minAnswer || answer > maxAnswer) {
                a = 1 + Math.floor(Math.random() * (maxAnswer - 1));
                b = 1 + Math.floor(Math.random() * Math.min(a, maxAnswer - 1));
                answer = a + b;
            }
        } else if (op === 'sub') {
            // For subtraction, start with a number that gives answer in range
            a = minAnswer + Math.floor(Math.random() * (maxAnswer - minAnswer + 1));
            b = Math.floor(Math.random() * Math.min(a - 1, maxAnswer - minAnswer));
            answer = a - b;
            // Ensure answer is in range
            while (answer < minAnswer || answer > maxAnswer) {
                a = minAnswer + Math.floor(Math.random() * (maxAnswer - minAnswer + 1));
                b = Math.floor(Math.random() * Math.min(a - 1, maxAnswer - minAnswer));
                answer = a - b;
            }
        } else if (op === 'mul') {
            // Keep factors small and friendly for early learners.
            const maxFactor = Math.min(10, 2 + Math.floor(maxAnswer / 5));
            a = 1 + Math.floor(Math.random() * maxFactor);
            b = 1 + Math.floor(Math.random() * maxFactor);
            answer = a * b;
            // Ensure answer is in range
            while (answer < minAnswer || answer > maxAnswer) {
                a = 1 + Math.floor(Math.random() * maxFactor);
                b = 1 + Math.floor(Math.random() * maxFactor);
                answer = a * b;
            }
        } else { // div — always clean (no remainders)
            b = 1 + Math.floor(Math.random() * Math.min(10, maxAnswer / 5));
            answer = minAnswer + Math.floor(Math.random() * (maxAnswer - minAnswer + 1));
            a = b * answer;
            // Ensure answer is in range
            while (answer < minAnswer || answer > maxAnswer || a > 100) {
                b = 1 + Math.floor(Math.random() * Math.min(10, maxAnswer / 5));
                answer = minAnswer + Math.floor(Math.random() * (maxAnswer - minAnswer + 1));
                a = b * answer;
            }
        }
        // Build 4 distinct answer choices around the correct value.
        const wrongSet = new Set([answer]);
        let delta = 1;
        while (wrongSet.size < 4) {
            const cand = answer + delta;
            if (cand >= 0 && cand !== answer) wrongSet.add(cand);
            if (wrongSet.size < 4) {
                const cand2 = answer - delta;
                if (cand2 >= 0 && cand2 !== answer) wrongSet.add(cand2);
            }
            delta++;
        }
        const choices = shuffle([...wrongSet]);
        return { op, a, b, answer, choices, awaitingNext: false, firstAttempt: true };
    }

    function fitTraceGhost(text) {
        const ghost = document.querySelector('.trace-ghost');
        const box = document.querySelector('.trace-box');
        if (!ghost || !box) return;
        const cs = getComputedStyle(ghost);
        const span = document.createElement('span');
        span.style.fontFamily = cs.fontFamily;
        span.style.fontWeight = cs.fontWeight;
        span.style.letterSpacing = cs.letterSpacing;
        span.style.whiteSpace = 'nowrap';
        span.style.position = 'absolute';
        span.style.visibility = 'hidden';
        span.style.fontSize = '100px';
        span.textContent = text;
        document.body.appendChild(span);
        const r = span.getBoundingClientRect();
        span.remove();
        const w100 = r.width || 1;
        const h100 = r.height || 100;
        const maxW = box.clientWidth - 12;
        const maxH = box.clientHeight - 12;
        let fs = Math.floor(Math.min(maxW / (w100 / 100), maxH / (h100 / 100)));
        fs = Math.max(22, Math.min(fs, 150));
        ghost.style.fontSize = fs + 'px';
    }
    function afterTraceRender() {
        const canvas = document.getElementById('traceCanvas');
        if (canvas) {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.strokeStyle = traceColor;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            let drawing = false;
            let lastX = 0, lastY = 0;
            const getPos = (e) => {
                const r = canvas.getBoundingClientRect();
                return { x: e.clientX - r.left, y: e.clientY - r.top };
            };
            canvas.addEventListener('pointerdown', (e) => {
                drawing = true;
                const p = getPos(e);
                lastX = p.x; lastY = p.y;
                e.preventDefault();
            });
            canvas.addEventListener('pointermove', (e) => {
                if (!drawing) return;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                lastX = p.x; lastY = p.y;
                e.preventDefault();
            });
            const stop = () => { drawing = false; };
            canvas.addEventListener('pointerup', stop);
            canvas.addEventListener('pointerleave', stop);
            canvas.addEventListener('pointercancel', stop);
        }
        const item = traceState.items[traceState.idx];
        fitTraceGhost(getTraceText(traceState.key, item));
        speakTraceItem(traceState.key, item);

            <h2>${isTrace ? 'Great Writing!' : 'Round Complete!'}</h2>
            <p style="font-size:1.4rem;color:#0e6b7a;font-weight:700;margin-bottom:20px;">You earned ${stars} 💎</p>
            <button class="big-btn again" onclick="${againAction}">🔁 ${isTrace ? 'Write More' : 'Play Again'}</button>
            <button class="big-btn home" onclick="goHome()">🏠 Home</button>
        </div>`;
    }
    function renderProgress() {
        const rows = CATEGORIES.map(c => {
            const { mastered, total } = categoryMasteredAllLevels(c);
            const pct = Math.round((mastered / total) * 100);
            return `<div style="margin-bottom:16px;">
                <div style="display:flex;justify-content:space-between;font-weight:700;">
                    <span>${c.icon} ${c.name}</span><span>${mastered}/${total}</span>
                </div>
                <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
            </div>`;
        }).join('');
        const trophies = TROPHIES.map(t => {
            const unlocked = progress.stars >= t;
            return `<div class="trophy ${unlocked ? '' : 'locked'}">
                <div class="icon">${unlocked ? '🏆' : '🔒'}</div>
                <div>${t} diamonds</div>
            </div>`;
        }).join('');
        return `${topbar(true)}
        <h2>🏆 My Progress</h2>
        <div class="star-badge" style="margin:0 auto 20px;width:fit-content;font-size:1.1rem;">💎 ${progress.stars} total diamonds</div>
        ${rows}
        <div style="margin-top:10px;font-weight:700;">Math solved: ${Object.values(progress.mathCorrect).reduce((a, b) => a + (b || 0), 0)} total</div>
        <div class="trophy-grid">${trophies}</div>
        <div style="text-align:center;margin-top:18px;">
            <button class="choice-btn" style="padding:12px 20px;font-size:1rem;" onclick="exportProgress()">📤 Export progress (for parents)</button>
        </div>`;
    }
    // Parent export (research G): dump the progress object as a downloadable JSON file.
    function exportProgress() {
        const data = JSON.stringify({
            exportedAt: new Date().toISOString(),
            stars: progress.stars,
            mastery: progress.mastery,
            due: progress.due,
            mathCorrect: progress.mathCorrect,
            version: 'kc_progress_v1'
        }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `kindergarten-progress-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    // ---------- Timed Challenge Mode (60s rapid-fire) ----------
    let timedState = null;
    let timedInterval = null;
    function startTimedChallenge() {
        // Collect all items from all mastered categories (non-math)
        const pool = [];
        for (const cat of CATEGORIES) {
            if (cat.key === 'math') continue;
            for (const lv of cat.levels) {
                for (const it of lv.items) {
                    pool.push({ key: cat.key, item: it, level: lv.id });
                }
            }
        }
        if (pool.length === 0) { goHome(); return; }
        const questions = [];
        for (let i = 0; i < 30; i++) {
            const pick = pool[Math.floor(Math.random() * pool.length)];
            questions.push(buildQuestion(pick.key, [pick.item], pick.level));
        }
        timedState = { questions, idx: 0, score: 0, timeLeft: 60, streak: 0, awaitingNext: false };
        go('timed', {});
    }
    function renderTimed() {
        if (!timedState || timedState.idx >= timedState.questions.length) return renderTimedEnd();
        const q = timedState.questions[timedState.idx];
        const pct = (timedState.timeLeft / 60) * 100;
        const circ = 2 * Math.PI * 35;
        const offset = circ - (pct / 100) * circ;
        const urgent = timedState.timeLeft <= 10 ? ' urgent' : '';
        const choicesHTML = q.choices.map(c =>
            `<button class="choice-btn ${c.cls || ''}" data-id="${esc(c.id)}" onclick="handleTimedChoice('${esc(c.id)}', this)">${c.html}</button>`
        ).join('');
        return `${topbar(true)}
        <div class="center-col">
            <div class="timer-ring">
                <svg width="80" height="80" viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="35"/><circle class="fill${urgent}" cx="40" cy="40" r="35" style="stroke-dasharray:${circ};stroke-dashoffset:${offset};"/></svg>
                <div class="timer-text">${timedState.timeLeft}s</div>
            </div>
            <div style="color:#999;margin-bottom:8px;">Score: ${timedState.score} | ⏱️ ${timedState.timeLeft}s left</div>
            <div class="prompt-box">${q.promptHTML}</div>
            <div class="choices">${choicesHTML}</div>
        </div>`;
    }
    function afterTimedRender() {
        const q = timedState.questions[timedState.idx];
        if (q.speakText) speak(q.speakText, { lang: q.lang });
        // Start countdown if not already running
        if (!timedInterval) {
            timedInterval = setInterval(() => {
                if (!timedState) { clearInterval(timedInterval); timedInterval = null; return; }
                timedState.timeLeft--;
                if (timedState.timeLeft <= 0) {
                    clearInterval(timedInterval);
                    timedInterval = null;
                    // Save high score
                    const best = parseInt(localStorage.getItem('kc_timed_best') || '0', 10);
                    if (timedState.score > best) localStorage.setItem('kc_timed_best', String(timedState.score));
                    go('timedEnd', { score: timedState.score, best: Math.max(best, timedState.score) });
                } else {
                    render(); // re-render to update timer
                }
            }, 1000);
        }
    }
    function handleTimedChoice(id, btnEl) {
        if (!timedState || timedState.awaitingNext) return;
        const q = timedState.questions[timedState.idx];
        const correct = id === q.itemId;
        if (correct) {
            btnEl.classList.add('correct');
            timedState.awaitingNext = true;
            awardStar();
            timedState.score++;
            timedState.streak = (timedState.streak || 0) + 1;
            if (timedState.streak >= 10) { progress.stars += 10; }
            else if (timedState.streak >= 5) { progress.stars += 5; }
            else if (timedState.streak >= 3) { progress.stars += 2; }
            saveProgress();
            renderTopbarStarsOnly();
            speak(descriptivePraise('timed', q));
            setTimeout(nextTimedQuestion, 600);
        } else {
            btnEl.classList.add('incorrect');
            btnEl.disabled = true;
            timedState.streak = 0;
            speak(RETRY[Math.floor(Math.random() * RETRY.length)]);
        }
    }
    function nextTimedQuestion() {
        if (!timedState) return;
        timedState.idx++;
        timedState.awaitingNext = false;
        if (timedState.idx >= timedState.questions.length || timedState.timeLeft <= 0) {
            if (timedInterval) { clearInterval(timedInterval); timedInterval = null; }
            const best = parseInt(localStorage.getItem('kc_timed_best') || '0', 10);
            if (timedState.score > best) localStorage.setItem('kc_timed_best', String(timedState.score));
            go('timedEnd', { score: timedState.score, best: Math.max(best, timedState.score) });
        } else {
            render();
        }
    }
    function renderTimedEnd() {
        if (timedInterval) { clearInterval(timedInterval); timedInterval = null; }
        const score = timedState ? timedState.score : 0;
        const best = parseInt(localStorage.getItem('kc_timed_best') || '0', 10);
        timedState = null;
        return `${topbar(false)}
        <div class="center-col">
            <div style="font-size:4rem;">⏱️</div>
            <h2>Time's Up!</h2>
            <p style="font-size:1.4rem;color:#0e6b7a;font-weight:700;margin-bottom:8px;">Score: ${score} correct</p>
            <p style="font-size:1rem;color:#888;margin-bottom:20px;">Best: ${best} 💎</p>
            <button class="big-btn play" onclick="startTimedChallenge()">🔁 Try Again</button>
            <button class="big-btn home" onclick="goHome()">🏠 Home</button>
        </div>`;
    }

    // ---------- Main render ----------
    function render() {
        const app = document.getElementById('app');
        let html = '';
        if (state.screen === 'home') html = renderHome();
        else if (state.screen === 'level') html = renderLevelPicker();
        else if (state.screen === 'category') html = renderCategory();
        else if (state.screen === 'learn') html = renderLearn();
        else if (state.screen === 'play') html = renderPlay();
        else if (state.screen === 'mathPlay') html = renderMathPlay();
        else if (state.screen === 'trace') html = renderTrace();
        else if (state.screen === 'roundEnd') html = renderRoundEnd();
        else if (state.screen === 'freeplay') html = renderFreeplay();
        else if (state.screen === 'draw') html = renderDraw();
        else if (state.screen === 'timed') html = renderTimed();
        else if (state.screen === 'timedEnd') html = renderTimedEnd();
        else if (state.screen === 'progress') html = renderProgress();
        app.innerHTML = html;
        if (state.screen === 'play') afterPlayRender();
        if (state.screen === 'mathPlay') afterMathPlayRender();
        if (state.screen === 'trace') afterTraceRender();
        if (state.screen === 'draw') afterDrawRender();
        if (state.screen === 'timed') afterTimedRender();
    }

    // ---------- Render: Draw (blank canvas) ----------
    const DRAW_COLORS = [
        { name: 'Black', hex: '#2b1b0e' },
        { name: 'Red', hex: '#e04040' },
        { name: 'Orange', hex: '#e67e22' },
        { name: 'Yellow', hex: '#f1c40f' },
        { name: 'Green', hex: '#27ae60' },
        { name: 'Blue', hex: '#2980b9' },
        { name: 'Purple', hex: '#9b59b6' },
        { name: 'Pink', hex: '#e84393' },
        { name: 'Brown', hex: '#8B4513' },
        { name: 'White', hex: '#ffffff' },
    ];
    const DRAW_SIZES = [4, 8, 14, 22];
    let drawColor = DRAW_COLORS[0].hex;
    let drawSize = DRAW_SIZES[1];
    let drawEraser = false;
    let drawHistory = [];
    const DRAW_MAX_HISTORY = 30;
    function renderDraw() {
        return `${topbar(true)}
        <div class="center-col">
            <h2>✏️ Draw</h2>
            <canvas id="drawCanvas" class="draw-canvas"></canvas>
            <div class="draw-toolbar">
                ${DRAW_COLORS.map(c => `<div class="draw-swatch${c.hex === drawColor ? ' active' : ''}" style="background:${c.hex};" onclick="pickDrawColor('${c.hex}')" title="${c.name}"></div>`).join('')}
                <div class="draw-size">
                    ${DRAW_SIZES.map(s => `<div class="draw-size-btn${s === drawSize ? ' active' : ''}" onclick="pickDrawSize(${s})" title="Size ${s}"><div class="draw-dot" style="width:${Math.min(s, 20)}px;height:${Math.min(s, 20)}px;"></div></div>`).join('')}
                </div>
                <div class="draw-tool-btn${drawEraser ? ' active' : ''}" id="eraserBtn" onclick="toggleEraser()" title="Eraser">🧽</div>
                <div class="draw-tool-btn" id="undoBtn" onclick="undoDraw()" title="Undo">↩️</div>
                <button class="icon-btn" onclick="clearDrawCanvas()" title="Clear">🧹</button>
            </div>
        </div>`;
    }
    function pickDrawColor(hex) {
        drawColor = hex;
        document.querySelectorAll('.draw-swatch').forEach(s => {
            s.classList.toggle('active', s.style.backgroundColor === hex || s.style.background === hex);
        });
    }
    function pickDrawSize(s) {
        drawSize = s;
        document.querySelectorAll('.draw-size-btn').forEach(b => {
            const dot = b.querySelector('.draw-dot');
            b.classList.toggle('active', parseInt(dot.style.width) === Math.min(s, 20));
        });
    }
    function toggleEraser() {
        drawEraser = !drawEraser;
        const btn = document.getElementById('eraserBtn');
        if (btn) btn.classList.toggle('active', drawEraser);
        const canvas = document.getElementById('drawCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.globalCompositeOperation = drawEraser ? 'destination-out' : 'source-over';
        }
    }
    function saveDrawSnapshot() {
        const canvas = document.getElementById('drawCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        drawHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (drawHistory.length > DRAW_MAX_HISTORY) drawHistory.shift();
    }
    function undoDraw() {
        if (drawHistory.length === 0) return;
        const canvas = document.getElementById('drawCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const snap = drawHistory.pop();
        ctx.putImageData(snap, 0, 0);
    }
    function clearDrawCanvas() {
        const canvas = document.getElementById('drawCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        saveDrawSnapshot();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    function afterDrawRender() {
        drawHistory = [];
        const canvas = document.getElementById('drawCanvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.strokeStyle = drawColor;
        ctx.lineWidth = drawSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalCompositeOperation = drawEraser ? 'destination-out' : 'source-over';
        let drawing = false;
        let lastX = 0, lastY = 0;
        const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        };
        canvas.addEventListener('pointerdown', (e) => {
            drawing = true;
            saveDrawSnapshot();
            const p = getPos(e);
            lastX = p.x; lastY = p.y;
            ctx.globalCompositeOperation = drawEraser ? 'destination-out' : 'source-over';
            ctx.strokeStyle = drawColor;
            ctx.lineWidth = drawSize;
            e.preventDefault();
        });
        canvas.addEventListener('pointermove', (e) => {
            if (!drawing) return;
            const p = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            lastX = p.x; lastY = p.y;
            e.preventDefault();
        });
        const stop = () => { drawing = false; };
        canvas.addEventListener('pointerup', stop);
        canvas.addEventListener('pointerleave', stop);
        canvas.addEventListener('pointercancel', stop);
    }

    // ---------- Render: Free Play (research D — autonomy, no-pressure explore) ----------
    function renderFreeplay() {
        // Reuse the EXACT same card visuals as Learn mode so Free Play matches
        // the rest of the app (real Minecraft PNGs via wordMediaHTML, letters as
        // the big glyph, numbers as the digit). No quiz, no mastery check.
        const groups = [];
        for (const c of CATEGORIES) {
            if (c.key === 'math') continue;
            for (const lv of c.levels) {
                for (const it of lv.items) {
                    groups.push({ key: c.key, id: it.id, level: lv.id });
                }
            }
        }
        const sample = shuffle(groups).slice(0, 28);
        const cards = sample.map(g => {
            const cat = CATEGORIES.find(c => c.key === g.key);
            const items = getCategoryItems(g.key, g.level);
            const it = items.find(x => x.id === g.id);
            if (!it) return '';
            let visual, label = it.id;
            if (g.key === 'letters') visual = `<div class="icon">${it.id}</div>`;
            else if (g.key === 'numbers') visual = `<div class="icon">${it.n}</div>`;
            else if (g.key === 'words') { visual = `<div class="icon">${wordMediaHTML(it, 56)}</div>`; label = it.id; }
            else if (g.key === 'chinese') {
                visual = `<div class="icon">${wordMediaHTML(it, 56)}</div>`;
                label = `<div style="font-size:1.4rem;">${it.hanzi}</div><div style="font-size:0.75rem;color:rgba(43,27,14,0.55);font-weight:400;">${it.en}</div>`;
            }
            else if (g.key === 'spanish') {
                visual = `<div class="icon">${wordMediaHTML(it, 56)}</div>`;
                label = `<div style="font-size:1.4rem;">${it.es}</div><div style="font-size:0.75rem;color:rgba(43,27,14,0.55);font-weight:400;">${it.en}</div>`;
            }
            return `<div class="card" onclick="learnTap('${g.key}','${g.id}','${g.level}')">
                ${visual}
                <div class="label">${label}</div>
            </div>`;
        }).join('');
        return `${topbar(true)}
        <h2>🎨 Free Play</h2>
        <p style="color:#888;text-align:center;margin-bottom:14px;">Tap anything to hear it. No quizzes here!</p>
        <div class="grid">${cards}</div>
        <div class="footer">Just explore!</div>`;
    }

    render();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
    </script>
</body>
