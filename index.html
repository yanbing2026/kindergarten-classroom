<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5d9c2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>⛏️ Minecraft Classroom ⛏️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-sky-top: #7ec8e3;
            --mc-sky-bottom: #cdeefb;
            --mc-grass: #5d9c2e;
            --mc-grass-dark: #457a20;
            --mc-dirt: #8b5a2b;
            --mc-dirt-dark: #6b431f;
            --mc-wood: #c8a165;
            --mc-wood-dark: #a07c46;
            --mc-stone: #9a9a9a;
            --mc-stone-dark: #707070;
            --mc-diamond: #4ec9e0;
            --mc-gold: #ffd700;
            --mc-emerald: #3fbf5f;
            --mc-redstone: #d64530;
            --mc-ink: #2b1b0e;
            --mc-panel: #d8b988;
            --font-pixel: 'Press Start 2P', monospace;
            --font-clear: system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        html, body { height: 100%; overscroll-behavior: none; }
        body {
            font-family: var(--font-clear);
            background: linear-gradient(180deg, var(--mc-sky-top) 0%, var(--mc-sky-bottom) 70%);
            min-height: 100vh;
            padding: 16px 16px 46px;
            position: relative;
        }
        body::after {
            content: '';
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 40px;
            background:
                linear-gradient(180deg, var(--mc-grass) 0 10px, var(--mc-dirt) 10px 40px),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.12) 0 4px, transparent 4px 40px);
            border-top: 3px solid var(--mc-grass-dark);
            z-index: 0;
        }
        .container {
            background:
                repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0 6px, transparent 6px 24px),
                var(--mc-panel);
            border: 4px solid var(--mc-ink);
            border-radius: 6px;
            padding: 24px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 12px 0 rgba(0,0,0,0.25), inset 4px 4px 0 rgba(255,255,255,0.25), inset -4px -4px 0 rgba(0,0,0,0.2);
            min-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }
        .topbar-left, .topbar-right { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            font-size: 1.6rem;
            background: var(--mc-stone);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 3px 3px 0 rgba(255,255,255,0.45), inset -3px -3px 0 rgba(0,0,0,0.3);
            width: 56px;
            height: 56px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:active { transform: translateY(2px); box-shadow: inset -3px -3px 0 rgba(255,255,255,0.45), inset 3px 3px 0 rgba(0,0,0,0.3); }
        .star-badge {
            font-family: var(--font-pixel);
            background: var(--mc-diamond);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 3px 3px 0 rgba(255,255,255,0.45), inset -3px -3px 0 rgba(0,0,0,0.25);
            padding: 12px 16px;
            font-size: 1rem;
            color: #063a42;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        h1 { font-family: var(--font-pixel); text-align: center; font-size: 1.5rem; line-height: 1.6; color: var(--mc-emerald); text-shadow: 3px 3px 0 rgba(0,0,0,0.35); margin-bottom: 20px; }
        h2 { font-family: var(--font-pixel); text-align: center; font-size: 1.1rem; line-height: 1.6; color: var(--mc-ink); text-shadow: 2px 2px 0 rgba(255,255,255,0.4); margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--mc-wood);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.35), inset -4px -4px 0 rgba(0,0,0,0.25);
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.05s;
            position: relative;
            min-height: 96px;
        }
        .card:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(255,255,255,0.35), inset 4px 4px 0 rgba(0,0,0,0.25); }
        .card.cat-letters { background: var(--mc-wood); }
        .card.cat-numbers { background: var(--mc-stone); }
        .card.cat-words { background: #e8d9b5; }
        .card.cat-colors { background: #eef0f2; }
        .card.cat-shapes { background: #cfe0e6; }
        .card.cat-animals { background: var(--mc-grass); }
        .card.cat-chinese { background: #e2a63c; }
        .card.cat-spanish { background: #e08a4f; }
        .card.cat-math { background: var(--mc-gold); }
        .card.cat-progress { background: var(--mc-diamond); }
        .icon { font-size: 3.2rem; margin-bottom: 8px; }
        .label { font-family: var(--font-clear); font-size: 1.3rem; color: var(--mc-ink); font-weight: 700; }
        .sublabel { font-family: var(--font-clear); font-size: 0.85rem; color: rgba(43,27,14,0.65); margin-top: 4px; }
        .mastered-check {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--mc-emerald);
            color: white;
            border: 2px solid var(--mc-ink);
            border-radius: 4px;
            width: 24px;
            height: 24px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .big-btn {
            font-family: var(--font-pixel);
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 10px auto;
            padding: 20px 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            cursor: pointer;
            color: white;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.35), inset -4px -4px 0 rgba(0,0,0,0.3);
        }
        .big-btn.learn { background: var(--mc-diamond); }
        .big-btn.play { background: var(--mc-redstone); }
        .big-btn.again { background: var(--mc-emerald); }
        .big-btn.home { background: var(--mc-wood-dark); }
        .big-btn:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(255,255,255,0.35), inset 4px 4px 0 rgba(0,0,0,0.3); }
        .center-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .prompt-box { margin-bottom: 24px; }
        .prompt-visual { font-size: 5rem; margin-bottom: 8px; }
        .prompt-word { font-family: var(--font-clear); font-size: 2.2rem; font-weight: 800; color: var(--mc-ink); letter-spacing: 2px; }
        .choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 460px;
        }
        .choice-btn {
            font-family: var(--font-clear);
            background: #f3e6c8;
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.4), inset -4px -4px 0 rgba(0,0,0,0.2);
            padding: 20px 10px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--mc-ink);
            cursor: pointer;
        }
        .choice-btn.word-choice { font-size: 1.6rem; }
        .choice-btn.chinese-choice { flex-direction: column; font-size: 1.8rem; gap: 4px; }
        .choice-btn.chinese-choice .pinyin { font-size: 0.8rem; font-weight: 400; color: #666; }
        .choice-btn:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(255,255,255,0.4), inset 4px 4px 0 rgba(0,0,0,0.2); }
        .choice-btn.correct { background: #bdf2cf; border-color: var(--mc-emerald); animation: pop 0.4s; }
        .choice-btn.incorrect { background: #f7c9c2; border-color: var(--mc-redstone); animation: shake 0.4s; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .replay-btn {
            font-family: var(--font-clear);
            background: var(--mc-gold);
            border: 3px solid var(--mc-ink);
            border-radius: 4px;
            box-shadow: inset 3px 3px 0 rgba(255,255,255,0.4), inset -3px -3px 0 rgba(0,0,0,0.25);
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--mc-ink);
            margin: 10px 0 20px;
            cursor: pointer;
        }
        .progress-bar-track {
            background: var(--mc-stone-dark);
            border: 2px solid var(--mc-ink);
            border-radius: 4px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar-fill { background: var(--mc-emerald); height: 100%; }
        .footer { text-align: center; color: rgba(43,27,14,0.55); margin-top: 20px; font-size: 0.8rem; }
        .dots-wrap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 320px; font-size: 2.2rem; margin-bottom: 10px; }
        .math-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
        .math-group { display: flex; flex-wrap: wrap; gap: 4px; max-width: 160px; font-size: 2rem; }
        .math-op { font-family: var(--font-pixel); font-size: 1.8rem; color: var(--mc-ink); }
        .trophy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 14px; margin-top: 16px; }
        .trophy { font-family: var(--font-clear); background: var(--mc-wood); border: 3px solid var(--mc-ink); border-radius: 4px; box-shadow: inset 3px 3px 0 rgba(255,255,255,0.35), inset -3px -3px 0 rgba(0,0,0,0.2); padding: 16px; text-align: center; color: var(--mc-ink); font-weight: 700; }
        .trophy.locked { opacity: 0.4; background: var(--mc-stone); }
        .trophy .icon { font-size: 2.4rem; margin-bottom: 4px; }
        .confetti-burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
        .confetti-piece { position: absolute; font-size: 1.8rem; animation: fall 1.1s ease-in forwards; }
        @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(70vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <script>
    // ---------- Data ----------
    const LETTERS = [

        {id:'Elephant',emoji:'🐘'},{id:'Lion',emoji:'🦁'},{id:'Cow',emoji:'🐮'},{id:'Duck',emoji:'🦆'},
        {id:'Sheep',emoji:'🐑'},{id:'Horse',emoji:'🐴'},{id:'Frog',emoji:'🐸'},{id:'Owl',emoji:'🦉'}
    ];
    const WORDS = [
        {id:'cat',emoji:'🐱'},{id:'dog',emoji:'🐶'},{id:'sun',emoji:'☀️'},{id:'hat',emoji:'👒'},
        {id:'pig',emoji:'🐷'},{id:'hen',emoji:'🐔'},{id:'bus',emoji:'🚌'},{id:'cup',emoji:'☕'},
        {id:'map',emoji:'🗺️'},{id:'fan',emoji:'💨'},{id:'bed',emoji:'🛏️'},{id:'bag',emoji:'👜'},
        {id:'box',emoji:'📦'},{id:'bee',emoji:'🐝'},{id:'egg',emoji:'🥚'},{id:'fox',emoji:'🦊'}
    ];
    const CHINESE = [
        {id:'Hello', hanzi:'你好', pinyin:'nǐ hǎo', en:'Hello', emoji:'👋'},
        {id:'ThankYou', hanzi:'谢谢', pinyin:'xiè xie', en:'Thank you', emoji:'🙏'},
        {id:'Bye', hanzi:'再见', pinyin:'zài jiàn', en:'Bye', emoji:'👋'},
        {id:'Love', hanzi:'爱', pinyin:'ài', en:'Love', emoji:'❤️'},
        {id:'Mom', hanzi:'妈妈', pinyin:'mā ma', en:'Mom', emoji:'👩'},
        {id:'Dad', hanzi:'爸爸', pinyin:'bà ba', en:'Dad', emoji:'👨'},
        {id:'Cat', hanzi:'猫', pinyin:'māo', en:'Cat', emoji:'🐱'},
        {id:'Dog', hanzi:'狗', pinyin:'gǒu', en:'Dog', emoji:'🐶'},
        {id:'Water', hanzi:'水', pinyin:'shuǐ', en:'Water', emoji:'💧'},
        {id:'Sun', hanzi:'太阳', pinyin:'tài yáng', en:'Sun', emoji:'☀️'},
        {id:'Moon', hanzi:'月亮', pinyin:'yuè liang', en:'Moon', emoji:'🌙'},
        {id:'Star', hanzi:'星星', pinyin:'xīng xing', en:'Star', emoji:'⭐'},
        {id:'One', hanzi:'一', pinyin:'yī', en:'One', emoji:'1️⃣'},
        {id:'Two', hanzi:'二', pinyin:'èr', en:'Two', emoji:'2️⃣'},
        {id:'Three', hanzi:'三', pinyin:'sān', en:'Three', emoji:'3️⃣'},
        {id:'Red', hanzi:'红色', pinyin:'hóng sè', en:'Red', emoji:'🔴'},
        {id:'Big', hanzi:'大', pinyin:'dà', en:'Big', emoji:'🐘'},
        {id:'Small', hanzi:'小', pinyin:'xiǎo', en:'Small', emoji:'🐜'},
        {id:'Apple', hanzi:'苹果', pinyin:'píng guǒ', en:'Apple', emoji:'🍎'},
        {id:'Home', hanzi:'家', pinyin:'jiā', en:'Home', emoji:'🏠'}
    ];
    const SPANISH = [
        {id:'Hello', es:'Hola', en:'Hello', emoji:'👋'},
        {id:'ThankYou', es:'Gracias', en:'Thank you', emoji:'🙏'},
        {id:'Bye', es:'Adiós', en:'Bye', emoji:'👋'},
        {id:'Love', es:'Amor', en:'Love', emoji:'❤️'},
        {id:'Mom', es:'Mamá', en:'Mom', emoji:'👩'},
        {id:'Dad', es:'Papá', en:'Dad', emoji:'👨'},
        {id:'Cat', es:'Gato', en:'Cat', emoji:'🐱'},
        {id:'Dog', es:'Perro', en:'Dog', emoji:'🐶'},
        {id:'Water', es:'Agua', en:'Water', emoji:'💧'},
        {id:'Sun', es:'Sol', en:'Sun', emoji:'☀️'},
        {id:'Moon', es:'Luna', en:'Moon', emoji:'🌙'},
        {id:'Star', es:'Estrella', en:'Star', emoji:'⭐'},
        {id:'One', es:'Uno', en:'One', emoji:'1️⃣'},
        {id:'Two', es:'Dos', en:'Two', emoji:'2️⃣'},
        {id:'Three', es:'Tres', en:'Three', emoji:'3️⃣'},
        {id:'Red', es:'Rojo', en:'Red', emoji:'🔴'},
        {id:'Big', es:'Grande', en:'Big', emoji:'🐘'},
        {id:'Small', es:'Pequeño', en:'Small', emoji:'🐜'},
        {id:'Apple', es:'Manzana', en:'Apple', emoji:'🍎'},
        {id:'Home', es:'Casa', en:'Home', emoji:'🏠'}
    ];
    const CATEGORIES = [
        {key:'letters', name:'Letters', icon:'🔤', items:LETTERS},
        {key:'numbers', name:'Numbers', icon:'🔢', items:NUMBERS},
        {key:'words', name:'Words', icon:'📖', items:WORDS},
        {key:'chinese', name:'Chinese', icon:'🇨🇳', items:CHINESE},
        {key:'spanish', name:'Spanish', icon:'🇪🇸', items:SPANISH},
        {key:'colors', name:'Colors', icon:'🌈', items:COLORS},
        {key:'shapes', name:'Shapes', icon:'🔷', items:SHAPES},
        {key:'animals', name:'Animals', icon:'🐾', items:ANIMALS}
    ];
    const PRAISE = ['Great job!','Awesome!','You got it!','Super!','Nice work!','Way to go!','Excellent!'];
    const RETRY = ['Try again!','Almost! Try again.','Not quite, try again!','Keep trying!'];
    const MASTERY_THRESHOLD = 2;
    const ROUND_LENGTH = 8;
    const TROPHIES = [10, 25, 50, 100, 200];

    // ---------- Progress storage ----------
    function loadProgress() {
        try {
            const raw = localStorage.getItem('kc_progress_v1');
            if (raw) return JSON.parse(raw);
        } catch (e) {}
        return { stars: 0, mastery: {}, mathCorrect: 0 };
    }
    function saveProgress() { localStorage.setItem('kc_progress_v1', JSON.stringify(progress)); }
    let progress = loadProgress();

    function getMasteryCount(cat, id) {
        return (progress.mastery[cat] && progress.mastery[cat][id]) || 0;
    }
    function bumpMastery(cat, id) {
        if (!progress.mastery[cat]) progress.mastery[cat] = {};
        progress.mastery[cat][id] = (progress.mastery[cat][id] || 0) + 1;
    }
    function categoryMasteredCount(cat, items) {
        return items.filter(it => getMasteryCount(cat, it.id) >= MASTERY_THRESHOLD).length;
    }

    // ---------- Audio ----------
    let muted = localStorage.getItem('kc_muted') === '1';

    // ---------- Voice selection ----------
    // Browsers expose several voices per language; the default is often a
    // low-quality robotic one. Score the available voices and cache the
    // best pick per language so speech sounds as natural as possible.
    let voiceCache = {};
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => { voiceCache = {}; };
    }
    function scoreVoice(v, lang) {
        let score = 0;
        const name = v.name.toLowerCase();
        if (v.lang && v.lang.toLowerCase() === lang.toLowerCase()) score += 5;
        const goodMarkers = ['natural', 'neural', 'enhanced', 'premium', 'google', 'wavenet'];
        goodMarkers.forEach(m => { if (name.includes(m)) score += 3; });
        const knownGoodNames = ['samantha', 'tingting', 'ting-ting', 'sinji', 'mei-jia', 'monica', 'paulina', 'juan', 'jorge', 'diego', 'zosia', 'ava', 'zoe'];
        knownGoodNames.forEach(n => { if (name.includes(n)) score += 2; });
        const badMarkers = ['espeak', 'compact', 'robot'];
        badMarkers.forEach(m => { if (name.includes(m)) score -= 3; });
        if (v.localService) score += 1;
        return score;
    }
    function getBestVoice(lang) {
        if (!('speechSynthesis' in window)) return null;
        if (lang in voiceCache) return voiceCache[lang];
        const voices = window.speechSynthesis.getVoices();
        const langPrefix = lang.split('-')[0];
        const matches = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
        let best = null;
        if (matches.length) {
            best = matches.slice().sort((a, b) => scoreVoice(b, lang) - scoreVoice(a, lang))[0];
        }
        voiceCache[lang] = best;
        return best;
    }

    function playBrowserUtterance(text, lang, rate) {
        return new Promise((resolve) => {
            if (!('speechSynthesis' in window)) { resolve(); return; }
            try {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = lang; u.rate = rate || 0.85; u.pitch = 1.1;
                const voice = getBestVoice(lang);
                if (voice) u.voice = voice;
                u.onend = resolve; u.onerror = resolve;
                window.speechSynthesis.speak(u);
            } catch (e) { resolve(); }
        });
    }

    // ---------- Gemini TTS (optional, higher-quality voice) ----------
    // If the user has saved a Google AI Studio API key, we call Gemini's
    // TTS model for natural speech and cache the resulting audio in
    // IndexedDB (keyed by text+lang) so repeat taps don't re-pay for the
    // same clip. Any failure (no key, offline, bad response) silently
    // falls back to the free browser voice above.
    const GEMINI_MODEL = 'gemini-2.5-flash-preview-tts';
    const GEMINI_VOICE = 'Leda';
    const GEMINI_LANG_NAMES = { 'en-US': 'English', 'zh-CN': 'Mandarin Chinese', 'es-ES': 'Spanish' };
    let currentAudioEl = null;

    function stopAllAudio() {
        if (currentAudioEl) { try { currentAudioEl.pause(); } catch (e) {} currentAudioEl = null; }
        if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    }
    function playBlob(blob) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(blob);
            const el = new Audio(url);
            currentAudioEl = el;
            const done = () => { URL.revokeObjectURL(url); if (currentAudioEl === el) currentAudioEl = null; resolve(); };
            el.onended = done; el.onerror = done;
            el.play().catch(done);
        });
    }
    function base64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }
    function writeAsciiString(view, offset, str) {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }
    function pcmToWavBlob(pcmBytes, sampleRate) {
        const numChannels = 1, bitsPerSample = 16;
        const byteRate = sampleRate * numChannels * bitsPerSample / 8;
        const blockAlign = numChannels * bitsPerSample / 8;
        const dataSize = pcmBytes.length;
        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);
        writeAsciiString(view, 0, 'RIFF');
        view.setUint32(4, 36 + dataSize, true);
        writeAsciiString(view, 8, 'WAVE');
        writeAsciiString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);
        writeAsciiString(view, 36, 'data');
        view.setUint32(40, dataSize, true);
        new Uint8Array(buffer, 44).set(pcmBytes);
        return new Blob([buffer], { type: 'audio/wav' });
    }
    async function fetchGeminiAudio(text, lang, apiKey) {
        const langName = GEMINI_LANG_NAMES[lang] || 'English';
        const prompt = `Say warmly and clearly in ${langName}, at a slow, friendly pace for a young child: ${text}`;
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseModalities: ['AUDIO'],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: GEMINI_VOICE } } }
                }
            })
        });
        if (!resp.ok) throw new Error('Gemini TTS request failed: ' + resp.status);
        const data = await resp.json();
        const part = data.candidates && data.candidates[0] && data.candidates[0].content &&
            data.candidates[0].content.parts && data.candidates[0].content.parts[0];
        const inline = part && part.inlineData;
        if (!inline || !inline.data) throw new Error('No audio data in Gemini response');
        const rateMatch = /rate=(\d+)/.exec(inline.mimeType || '');
        const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
        return pcmToWavBlob(base64ToBytes(inline.data), sampleRate);
    }

    // ---------- Audio cache (IndexedDB) ----------
    const CACHE_DB_NAME = 'kc_audio_cache_v1';
    const CACHE_STORE = 'clips';
    let cacheDbPromise = null;
    function openCacheDB() {
        if (cacheDbPromise) return cacheDbPromise;
        cacheDbPromise = new Promise((resolve, reject) => {
            if (!('indexedDB' in window)) { reject(new Error('no indexedDB')); return; }
            const req = indexedDB.open(CACHE_DB_NAME, 1);
            req.onupgradeneeded = () => { req.result.createObjectStore(CACHE_STORE); };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
        return cacheDbPromise;
    }
    async function audioCacheGet(key) {
        try {
            const db = await openCacheDB();
            return await new Promise((resolve, reject) => {
                const tx = db.transaction(CACHE_STORE, 'readonly');
                const req = tx.objectStore(CACHE_STORE).get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        } catch (e) { return null; }
    }
    async function audioCacheSet(key, blob) {
        try {
            const db = await openCacheDB();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(CACHE_STORE, 'readwrite');
                tx.objectStore(CACHE_STORE).put(blob, key);
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
        } catch (e) {}
    }
    async function clearAudioCache() {
        try {
            const db = await openCacheDB();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(CACHE_STORE, 'readwrite');
                tx.objectStore(CACHE_STORE).clear();
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
        } catch (e) {}
    }

    // ---------- Unified speech entry points ----------
    async function playClip(text, lang) {
        const cacheKey = lang + '|' + GEMINI_VOICE + '|' + text;
        const cached = await audioCacheGet(cacheKey);
        if (cached) { await playBlob(cached); return; }
        const apiKey = localStorage.getItem('kc_gemini_key');
        if (apiKey) {
            try {
                const blob = await fetchGeminiAudio(text, lang, apiKey);
                audioCacheSet(cacheKey, blob);
                await playBlob(blob);
                return;
            } catch (e) { /* fall through to browser voice */ }
        }
        await playBrowserUtterance(text, lang);
    }
    function speak(text, opts) {
        if (muted) return;
        stopAllAudio();
        const lang = (opts && opts.lang) || 'en-US';
        playClip(text, lang).catch(() => {});
    }
    function speakSequence(parts, rate) {
        if (muted) return;
        stopAllAudio();
        (async () => {
            const combinedText = parts.join('. ');
            const cacheKey = 'en-US|' + GEMINI_VOICE + '|' + combinedText;
            const cached = await audioCacheGet(cacheKey);
            if (cached) { await playBlob(cached); return; }
            const apiKey = localStorage.getItem('kc_gemini_key');
            if (apiKey) {
                try {
                    const blob = await fetchGeminiAudio(combinedText, 'en-US', apiKey);
                    audioCacheSet(cacheKey, blob);
                    await playBlob(blob);
                    return;
                } catch (e) { /* fall through to browser voice */ }
            }
            for (const p of parts) {
                await playBrowserUtterance(p, 'en-US', rate || 0.7);
            }
        })().catch(() => {});
    }
    function speakBilingual(foreignText, foreignLang, enText) {
        if (muted) return;
        stopAllAudio();
        (async () => {
            await playClip(foreignText, foreignLang);
            await playClip(enText, 'en-US');
        })().catch(() => {});
    }

    // ---------- Nav ----------
    let state = { screen: 'home', params: null, stack: [] };
    function go(screen, params) {
        state.stack.push({ screen: state.screen, params: state.params });
        state.screen = screen; state.params = params || null;
        render();
    }
    function goBack() {
        const prev = state.stack.pop();
        if (prev) { state.screen = prev.screen; state.params = prev.params; }
        else { state.screen = 'home'; state.params = null; }
        render();
    }
    function goHome() { state.stack = []; state.screen = 'home'; state.params = null; render(); }

    // ---------- Helpers ----------
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }
    function pickChoices(pool, correct, count) {
        const others = pool.filter(p => p.id !== correct.id);
        const chosen = shuffle(others).slice(0, count - 1).concat([correct]);
        return shuffle(chosen);
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function awardStar() { progress.stars += 1; saveProgress(); }

    function confettiBurst() {
        const layer = document.createElement('div');
        layer.className = 'confetti-burst';
        const emojis = ['💎','🟩','🪙','✨'];
        for (let i = 0; i < 18; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            piece.style.left = (Math.random() * 100) + 'vw';
            piece.style.top = '-20px';
            piece.style.animationDelay = (Math.random() * 0.3) + 's';
            layer.appendChild(piece);
        }
        document.body.appendChild(layer);
        setTimeout(() => layer.remove(), 1500);
    }

    // ---------- Shape rendering ----------
    function shapeVisualHTML(item, size) {
        size = size || 70;
        if (item.emoji) return `<div style="font-size:${size*0.75}px;">${item.emoji}</div>`;
        const s = `width:${size}px;height:${size}px;background:#667eea;`;
        switch (item.id) {
            case 'Circle': return `<div style="${s}border-radius:50%;"></div>`;
            case 'Square': return `<div style="${s}"></div>`;
            case 'Rectangle': return `<div style="width:${size*1.4}px;height:${size*0.7}px;background:#667eea;"></div>`;
            case 'Oval': return `<div style="width:${size*1.4}px;height:${size*0.8}px;background:#667eea;border-radius:50%;"></div>`;
            case 'Triangle': return `<div style="width:0;height:0;border-left:${size/2}px solid transparent;border-right:${size/2}px solid transparent;border-bottom:${size}px solid #667eea;"></div>`;
            default: return '';
        }
    }
    function colorVisualHTML(item, size) {
        size = size || 90;
        const border = item.border ? 'border:2px solid #ddd;' : '';
        return `<div style="width:${size}px;height:${size}px;background:${item.hex};border-radius:16px;${border}"></div>`;
    }

    // ---------- Render: Home ----------
    function renderHome() {
        const cards = CATEGORIES.map(c => {
            const mastered = categoryMasteredCount(c.key, c.items);
            return `<div class="card cat-${c.key}" onclick="go('category', {key:'${c.key}'})">
                <div class="icon">${c.icon}</div>
                <div class="label">${c.name}</div>
                <div class="sublabel">${mastered}/${c.items.length} mastered</div>
            </div>`;
        }).join('');
        return `
        ${topbar(false)}
        <h1>⛏️ Minecraft Classroom ⛏️</h1>
        <div class="grid">
            ${cards}
            <div class="card cat-math" onclick="go('category', {key:'math'})">
                <div class="icon">➕</div>
                <div class="label">Math</div>
                <div class="sublabel">${progress.mathCorrect} solved</div>
            </div>
            <div class="card cat-progress" onclick="go('progress')">
                <div class="icon">🏆</div>
                <div class="label">My Progress</div>
                <div class="sublabel">${progress.stars} diamonds</div>
            </div>
        </div>
        <div class="footer">Tap a card to start learning!</div>`;
    }

    function topbar(showBack) {
        return `<div class="topbar">
            <div class="topbar-left">
                ${showBack ? `<button class="icon-btn" onclick="goBack()">⬅️</button>` : ''}
                <button class="icon-btn" onclick="goHome()">🏠</button>
            </div>
            <div class="topbar-right">
                <div class="star-badge">💎 ${progress.stars}</div>
                <button class="icon-btn" onclick="toggleMute()">${muted ? '🔇' : '🔊'}</button>
                <button class="icon-btn" onclick="settingsMsg={text:'',color:''}; go('settings')">⚙️</button>
            </div>
        </div>`;
    }
    function toggleMute() {
        muted = !muted;
        localStorage.setItem('kc_muted', muted ? '1' : '0');
        render();
    }

    // ---------- Render: Category ----------
    function renderCategory() {
        const key = state.params.key;
        if (key === 'math') {
            return `${topbar(true)}
            <div class="center-col">
                <div style="font-size:4rem;">➕</div>
                <h2>Math</h2>
                <p style="color:#888;margin-bottom:20px;">Practice adding numbers together!</p>
                <button class="big-btn play" onclick="startMath()">🎮 Play</button>
            </div>`;
        }
        const cat = CATEGORIES.find(c => c.key === key);
        return `${topbar(true)}
        <div class="center-col">
            <div style="font-size:4rem;">${cat.icon}</div>
            <h2>${cat.name}</h2>
            <button class="big-btn learn" onclick="go('learn', {key:'${key}'})">📖 Learn</button>
            <button class="big-btn play" onclick="startQuiz('${key}')">🎮 Play</button>
        </div>`;
    }

    // ---------- Render: Learn ----------
    function renderLearn() {
        const key = state.params.key;
        const cat = CATEGORIES.find(c => c.key === key);
        const cards = cat.items.map(it => {
            const mastered = getMasteryCount(key, it.id) >= MASTERY_THRESHOLD;
            let visual, label = it.id;
            if (key === 'letters') visual = `<div class="icon">${it.id}</div>`;
            else if (key === 'numbers') visual = `<div class="icon">${it.n}</div>`;
            else if (key === 'colors') visual = colorVisualHTML(it, 60);
            else if (key === 'shapes') visual = shapeVisualHTML(it, 55);
            else if (key === 'animals') visual = `<div class="icon">${it.emoji}</div>`;
            else if (key === 'words') { visual = `<div class="icon">${it.emoji}</div>`; label = it.id; }
            else if (key === 'chinese') {
                visual = `<div class="icon">${it.emoji}</div>`;
                label = `<div style="font-size:1.4rem;">${it.hanzi}</div><div style="font-size:0.8rem;color:rgba(43,27,14,0.7);font-weight:400;">${it.pinyin}</div><div style="font-size:0.75rem;color:rgba(43,27,14,0.55);font-weight:400;">${it.en}</div>`;
            }
            else if (key === 'spanish') {
                visual = `<div class="icon">${it.emoji}</div>`;
                label = `<div style="font-size:1.4rem;">${it.es}</div><div style="font-size:0.75rem;color:rgba(43,27,14,0.55);font-weight:400;">${it.en}</div>`;
            }
            return `<div class="card" onclick="learnTap('${key}','${it.id}')">
                ${mastered ? '<div class="mastered-check">✓</div>' : ''}
                ${visual}
                <div class="label">${label}</div>
            </div>`;
        }).join('');
        return `${topbar(true)}
        <h2>${cat.icon} ${cat.name} — Learn</h2>
        <div class="grid">${cards}</div>
        <div class="footer">Tap a card to hear it!</div>`;
    }
    function learnTap(key, id) {
        if (key === 'letters') {
            const it = LETTERS.find(l => l.id === id);
            speakSequence([id, `${id} is for ${it.word}`]);
        } else if (key === 'numbers') {
            speak(id);
        } else if (key === 'words') {
            speakSequence(id.split('').concat([id]));
        } else if (key === 'chinese') {
            const it = CHINESE.find(w => w.id === id);
            speakBilingual(it.hanzi, 'zh-CN', it.en);
        } else if (key === 'spanish') {
            const it = SPANISH.find(w => w.id === id);
            speakBilingual(it.es, 'es-ES', it.en);
        } else {
            speak(id);
        }
    }

    // ---------- Quiz engine ----------
    let quiz = null;
    function startQuiz(key) {
        const cat = CATEGORIES.find(c => c.key === key);
        const questions = [];
        for (let i = 0; i < ROUND_LENGTH; i++) questions.push(buildQuestion(key, cat.items));
        quiz = { key, questions, idx: 0, correctFirstTry: 0, firstAttempt: true, awaitingNext: false, stars: 0 };
        go('play', { key });
    }
    function buildQuestion(key, items) {
        const correct = items[Math.floor(Math.random() * items.length)];
        if (key === 'letters') {
            if (Math.random() < 0.5) {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'letter-find',
                    promptHTML: `<div class="prompt-word">Find the letter</div><div class="prompt-visual">${correct.id}</div>`,
                    speakText: `Find the letter ${correct.id}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, speak: c.id }))
                };
            } else {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'letter-phonics',
                    promptHTML: `<div class="prompt-word">Which letter does this start with?</div><div class="prompt-visual">${correct.emoji}</div>`,
                    speakText: `${correct.word}. Which letter does it start with?`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, speak: c.id }))
                };
            }
        }
        if (key === 'numbers') {
            if (Math.random() < 0.5) {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'number-find',
                    promptHTML: `<div class="prompt-word">Find the number</div><div class="prompt-visual">${correct.n}</div>`,
                    speakText: `Find the number ${correct.n}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.n, speak: c.n }))
                };
            } else {
                const n = Math.min(correct.n, 10) || 1;
                const target = items.find(i => i.n === n);
                const dots = '🧱'.repeat(n);
                const near = items.filter(i => Math.abs(i.n - n) <= 3 && i.n !== n);
                const choices = shuffle(shuffle(near).slice(0, 3).concat([target]));
                return {
                    mode: 'number-count',
                    promptHTML: `<div class="prompt-word">How many blocks?</div><div class="dots-wrap">${dots}</div>`,
                    speakText: `How many blocks do you count?`,
                    itemId: target.id,
                    choices: choices.map(c => ({ id: c.id, html: c.n, speak: c.n }))
                };
            }
        }
        if (key === 'colors') {
            const choices = pickChoices(items, correct, 4);
            return {
                mode: 'find',
                promptHTML: `<div class="prompt-word">Find the color: ${correct.id}</div>`,
                speakText: `Find the color ${correct.id}`,
                itemId: correct.id,
                choices: choices.map(c => ({ id: c.id, html: colorVisualHTML(c, 70), speak: c.id }))
            };
        }
        if (key === 'shapes') {
            const choices = pickChoices(items, correct, 4);
            return {
                mode: 'find',
                promptHTML: `<div class="prompt-word">Find the shape: ${correct.id}</div>`,
                speakText: `Find the ${correct.id}`,
                itemId: correct.id,
                choices: choices.map(c => ({ id: c.id, html: shapeVisualHTML(c, 60), speak: c.id }))
            };
        }
        if (key === 'animals') {
            const choices = pickChoices(items, correct, 4);
            return {
                mode: 'find',
                promptHTML: `<div class="prompt-word">Find the: ${correct.id}</div>`,
                speakText: `Find the ${correct.id}`,
                itemId: correct.id,
                choices: choices.map(c => ({ id: c.id, html: `<div style="font-size:3rem;">${c.emoji}</div>`, speak: c.id }))
            };
        }
        if (key === 'words') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'word-picture',
                    promptHTML: `<div class="prompt-word">Which word says this?</div><div class="prompt-visual">${correct.emoji}</div>`,
                    speakText: `Which word says this?`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, cls: 'word-choice', speak: c.id }))
                };
            } else {
                return {
                    mode: 'word-sound',
                    promptHTML: `<div class="prompt-word">${correct.id}</div><button class="replay-btn" onclick="soundOutCurrentWord()">🔊 Sound it out</button>`,
                    speakText: null,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: `<div style="font-size:3rem;">${c.emoji}</div>`, speak: c.id }))
                };
            }
        }
        if (key === 'chinese') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'chinese-find',
                    promptHTML: `<div class="prompt-visual">${correct.emoji}</div><div class="prompt-word">${correct.en}</div>`,
                    speakText: `Find the Chinese word for ${correct.en}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: `<div>${c.hanzi}</div><div class="pinyin">${c.pinyin}</div>`, cls: 'chinese-choice', speak: c.hanzi }))
                };
            } else {
                return {
                    mode: 'chinese-listen',
                    promptHTML: `<div class="prompt-word">${correct.hanzi}</div><div style="font-size:1.1rem;color:#777;margin-top:6px;">${correct.pinyin}</div><button class="replay-btn" onclick="replayForeign()">🔊 Listen Again</button>`,
                    speakText: correct.hanzi,
                    lang: 'zh-CN',
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: `<div style="font-size:3rem;">${c.emoji}</div>`, speak: c.en }))
                };
            }
        }
        if (key === 'spanish') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'spanish-find',
                    promptHTML: `<div class="prompt-visual">${correct.emoji}</div><div class="prompt-word">${correct.en}</div>`,
                    speakText: `Find the Spanish word for ${correct.en}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.es, cls: 'word-choice', speak: c.es }))
                };
            } else {
                return {
                    mode: 'spanish-listen',
                    promptHTML: `<div class="prompt-word">${correct.es}</div><button class="replay-btn" onclick="replayForeign()">🔊 Listen Again</button>`,
                    speakText: correct.es,
                    lang: 'es-ES',
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: `<div style="font-size:3rem;">${c.emoji}</div>`, speak: c.en }))
                };
            }
        }
    }
    function soundOutCurrentWord() {
        const q = quiz.questions[quiz.idx];
        speakSequence(q.itemId.split('').concat([q.itemId]));
    }
    function replayForeign() {
        const q = quiz.questions[quiz.idx];
        speak(q.speakText, { lang: q.lang });
    }

    function renderPlay() {
        const q = quiz.questions[quiz.idx];
        const choicesHTML = q.choices.map(c => `
            <button class="choice-btn ${c.cls || ''}" data-id="${esc(c.id)}" onclick="handleChoice('${esc(c.id)}', this)">${c.html}</button>
        `).join('');
        return `${topbar(true)}
        <div class="center-col">
            <div style="color:#999;margin-bottom:8px;">Question ${quiz.idx + 1} of ${quiz.questions.length}</div>
            <div class="prompt-box">${q.promptHTML}</div>
            <div class="choices">${choicesHTML}</div>
        </div>`;
    }
    function afterPlayRender() {
        const q = quiz.questions[quiz.idx];
        if (q.speakText) speak(q.speakText, { lang: q.lang });
    }
    function handleChoice(id, btnEl) {
        if (quiz.awaitingNext) return;
        const q = quiz.questions[quiz.idx];
        const correct = id === q.itemId;
        if (correct) {
            btnEl.classList.add('correct');
            quiz.awaitingNext = true;
            awardStar();
            quiz.stars += 1;
            if (quiz.firstAttempt) {
                bumpMastery(quiz.key === 'math' ? 'math' : quiz.key, q.itemId);
                quiz.correctFirstTry += 1;
            }
            saveProgress();
            confettiBurst();
            speak(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
            setTimeout(nextQuestion, 900);
        } else {
            btnEl.classList.add('incorrect');
            btnEl.disabled = true;
            quiz.firstAttempt = false;
            speak(RETRY[Math.floor(Math.random() * RETRY.length)]);
        }
        renderTopbarStarsOnly();
    }
    function renderTopbarStarsOnly() {
        const badge = document.querySelector('.star-badge');
        if (badge) badge.textContent = `💎 ${progress.stars}`;
    }
    function nextQuestion() {
        quiz.idx += 1;
        quiz.firstAttempt = true;
        quiz.awaitingNext = false;
        if (quiz.idx >= quiz.questions.length) {
            go('roundEnd', { stars: quiz.stars, key: quiz.key });
        } else {
            render();
        }
    }

    // ---------- Math game ----------
    let mathState = null;
    function startMath() {
        mathState = { idx: 0, stars: 0, questions: [] };
        for (let i = 0; i < ROUND_LENGTH; i++) mathState.questions.push(buildMathQuestion());
        go('mathPlay');
    }
    function buildMathQuestion() {
        const level = progress.mathCorrect >= 25 ? 6 : (progress.mathCorrect >= 10 ? 5 : 3);
        const a = 1 + Math.floor(Math.random() * level);
        const b = 1 + Math.floor(Math.random() * level);
        const sum = a + b;
        const wrongPool = shuffle([sum - 2, sum - 1, sum + 1, sum + 2].filter(n => n > 0 && n !== sum));
        const choices = shuffle([sum, ...wrongPool.slice(0, 3)]);
        return { a, b, sum, choices, awaitingNext: false, firstAttempt: true };
    }
    function renderMathPlay() {
        const q = mathState.questions[mathState.idx];
        const choicesHTML = q.choices.map(n => `
            <button class="choice-btn" data-id="${n}" onclick="handleMathChoice(${n}, this)">${n}</button>
        `).join('');
        return `${topbar(true)}
        <div class="center-col">
            <div style="color:#999;margin-bottom:8px;">Question ${mathState.idx + 1} of ${mathState.questions.length}</div>
            <div class="math-row">
                <div class="math-group">${'🍎'.repeat(q.a)}</div>
                <div class="math-op">+</div>
                <div class="math-group">${'🍎'.repeat(q.b)}</div>
                <div class="math-op">=</div>
                <div class="math-op">?</div>
            </div>
            <div class="choices">${choicesHTML}</div>
        </div>`;
    }
    function afterMathPlayRender() {
        const q = mathState.questions[mathState.idx];
        speak(`${q.a} plus ${q.b}. How many apples in total?`);
    }
    function handleMathChoice(n, btnEl) {
        const q = mathState.questions[mathState.idx];
        if (q.awaitingNext) return;
        if (n === q.sum) {
            btnEl.classList.add('correct');
            q.awaitingNext = true;
            awardStar();
            mathState.stars += 1;
            if (q.firstAttempt) { progress.mathCorrect += 1; }
            saveProgress();
            confettiBurst();
            speak(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
            setTimeout(nextMathQuestion, 900);
        } else {
            btnEl.classList.add('incorrect');
            btnEl.disabled = true;
            q.firstAttempt = false;
            speak(RETRY[Math.floor(Math.random() * RETRY.length)]);
        }
        renderTopbarStarsOnly();
    }
    function nextMathQuestion() {
        mathState.idx += 1;
        if (mathState.idx >= mathState.questions.length) {
            go('roundEnd', { stars: mathState.stars, key: 'math' });
        } else {
            render();
        }
    }

    // ---------- Round end / Progress ----------
    function renderRoundEnd() {
        const { stars, key } = state.params;
        return `${topbar(false)}
        <div class="center-col">
            <div style="font-size:4rem;">🎉</div>
            <h2>Round Complete!</h2>
            <p style="font-size:1.4rem;color:#0e6b7a;font-weight:700;margin-bottom:20px;">You earned ${stars} 💎</p>
            <button class="big-btn again" onclick="${key === 'math' ? 'startMath()' : `startQuiz('${key}')`}">🔁 Play Again</button>
            <button class="big-btn home" onclick="goHome()">🏠 Home</button>
        </div>`;
    }
    function renderProgress() {
        const rows = CATEGORIES.map(c => {
            const mastered = categoryMasteredCount(c.key, c.items);
            const pct = Math.round((mastered / c.items.length) * 100);
            return `<div style="margin-bottom:16px;">
                <div style="display:flex;justify-content:space-between;font-weight:700;">
                    <span>${c.icon} ${c.name}</span><span>${mastered}/${c.items.length}</span>
                </div>
                <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
            </div>`;
        }).join('');
        const trophies = TROPHIES.map(t => {
            const unlocked = progress.stars >= t;
            return `<div class="trophy ${unlocked ? '' : 'locked'}">
                <div class="icon">${unlocked ? '🏆' : '🔒'}</div>
                <div>${t} diamonds</div>
            </div>`;
        }).join('');
        return `${topbar(true)}
        <h2>🏆 My Progress</h2>
        <div class="star-badge" style="margin:0 auto 20px;width:fit-content;font-size:1.1rem;">💎 ${progress.stars} total diamonds</div>
        ${rows}
        <div style="margin-top:10px;font-weight:700;">Math problems solved: ${progress.mathCorrect}</div>
        <div class="trophy-grid">${trophies}</div>`;
    }

    // ---------- Main render ----------
    // ---------- Render: Settings ----------
    let settingsMsg = { text: '', color: '' };
    function setSettingsMsg(text, color) {
        settingsMsg = { text, color: color || 'var(--mc-ink)' };
        render();
    }
    function renderSettings() {
        const hasKey = !!localStorage.getItem('kc_gemini_key');
        return `${topbar(true)}
        <h2>⚙️ Voice Settings</h2>
        <div style="max-width:420px;margin:0 auto;">
            <p style="color:rgba(43,27,14,0.75);font-size:0.9rem;margin-bottom:14px;text-align:center;">
                Add a free Google AI Studio API key for a more natural voice. Get one at
                <strong>aistudio.google.com</strong>. Without a key, the app automatically uses your browser's built-in voice — everything still works.
            </p>
            <div style="text-align:center;font-weight:700;margin-bottom:10px;">${hasKey ? '✅ AI voice is active' : '🔈 Using free browser voice'}</div>
            <input id="geminiKeyInput" type="password" placeholder="Paste your API key here"
                style="display:block;width:100%;padding:14px;border:3px solid var(--mc-ink);border-radius:4px;font-size:1rem;margin-bottom:12px;font-family:var(--font-clear);">
            <button class="big-btn play" onclick="testGeminiVoice()">🔊 Test Voice</button>
            <button class="big-btn again" onclick="saveGeminiKey()">💾 Save Key (without testing)</button>
            ${hasKey ? `<button class="big-btn home" onclick="clearGeminiKey()">🗑️ Remove Key</button>` : ''}
            <button class="big-btn learn" onclick="clearAudioCacheAndNotify()">🧹 Clear Cached Audio</button>
            <div id="settingsMsg" style="text-align:center;font-weight:700;margin-top:8px;min-height:1.2em;color:${settingsMsg.color || 'var(--mc-ink)'};">${settingsMsg.text}</div>
            <p style="color:rgba(43,27,14,0.5);font-size:0.75rem;margin-top:16px;text-align:center;">
                Your key is saved only in this browser (never uploaded anywhere else) and used solely to request audio from Google's API.
            </p>
        </div>`;
    }
    async function testGeminiVoice() {
        const input = document.getElementById('geminiKeyInput');
        const typed = input ? input.value.trim() : '';
        const key = typed || localStorage.getItem('kc_gemini_key') || '';
        if (!key) { setSettingsMsg('Please paste a key first.', 'var(--mc-redstone)'); return; }
        setSettingsMsg('Testing your key...', 'var(--mc-ink)');
        try {
            const blob = await fetchGeminiAudio('Hello! This is a test.', 'en-US', key);
            localStorage.setItem('kc_gemini_key', key);
            setSettingsMsg('✅ It works! Playing a test clip...', 'var(--mc-emerald)');
            await playBlob(blob);
            setSettingsMsg('✅ It works! Key saved.', 'var(--mc-emerald)');
        } catch (e) {
            setSettingsMsg('❌ Didn\'t work: ' + (e && e.message ? e.message : 'unknown error'), 'var(--mc-redstone)');
        }
    }
    function saveGeminiKey() {
        const input = document.getElementById('geminiKeyInput');
        const val = input ? input.value.trim() : '';
        if (!val) { setSettingsMsg('Please paste a key first.', 'var(--mc-redstone)'); return; }
        localStorage.setItem('kc_gemini_key', val);
        setSettingsMsg('Key saved (untested).', 'var(--mc-ink)');
    }
    function clearGeminiKey() {
        localStorage.removeItem('kc_gemini_key');
        setSettingsMsg('Key removed.', 'var(--mc-ink)');
    }
    function clearAudioCacheAndNotify() {
        clearAudioCache().then(() => {
            setSettingsMsg('Cached audio cleared!', 'var(--mc-emerald)');
            setTimeout(() => { if (settingsMsg.text === 'Cached audio cleared!') setSettingsMsg('', ''); }, 2000);
        });
    }

    function render() {
        const app = document.getElementById('app');
        let html = '';
        if (state.screen === 'home') html = renderHome();
        else if (state.screen === 'category') html = renderCategory();
        else if (state.screen === 'learn') html = renderLearn();
        else if (state.screen === 'play') html = renderPlay();
        else if (state.screen === 'mathPlay') html = renderMathPlay();
        else if (state.screen === 'roundEnd') html = renderRoundEnd();
        else if (state.screen === 'progress') html = renderProgress();
        else if (state.screen === 'settings') html = renderSettings();
        app.innerHTML = html;
        if (state.screen === 'play') afterPlayRender();
        if (state.screen === 'mathPlay') afterMathPlayRender();
    }

    render();
    </script>
</body>
</html>
