<script>
/* ---------- Boot safety: never leave a blank page on startup failure ---------- */
(function(){
  const BOOT_KEY='kc_boot_error_v1';
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function report(kind,message,source,line,column,stack){
    const data={kind:kind||'startup',message:String(message||'Unknown error'),source:source||'',line:line||0,column:column||0,stack:stack||'',url:location.href,time:new Date().toISOString()};
    window.__KC_BOOT_ERROR=data;
    try{localStorage.setItem(BOOT_KEY,JSON.stringify(data));}catch(_){}
    let box=document.getElementById('kcBootError');
    if(!box){box=document.createElement('div');box.id='kcBootError';box.style.cssText='position:fixed;inset:0;z-index:100000;background:#f4ead7;color:#2b1b0e;padding:18px;font-family:system-ui,sans-serif;overflow:auto;display:flex;align-items:center;justify-content:center;';document.body.appendChild(box);}
    box.innerHTML='<div style="width:min(760px,100%);background:#fff;border:4px solid #8b2e2e;border-radius:14px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.22)"><h2 style="margin:0 0 10px">🐞 BlockQuest could not start</h2><p style="margin:6px 0"><strong>'+esc(data.kind)+'</strong>: '+esc(data.message)+'</p><p style="margin:6px 0;font-size:.85rem">This report contains the exact error so it can be fixed without guessing.</p><pre style="white-space:pre-wrap;word-break:break-word;background:#f7f3ed;padding:10px;border-radius:8px;font-size:.72rem;max-height:42vh;overflow:auto">'+esc(JSON.stringify(data,null,2))+'</pre><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" onclick="navigator.clipboard?.writeText(JSON.stringify(window.__KC_BOOT_ERROR,null,2)).then(()=>alert(&quot;Report copied.&quot;))" style="padding:10px 14px;border:2px solid #333;border-radius:8px;font-weight:800">Copy Report</button><button type="button" onclick="location.reload()" style="padding:10px 14px;border:2px solid #333;border-radius:8px;font-weight:800">Reload</button></div></div>';
  }
  window.__KC_REPORT_BOOT_ERROR=report;
  window.addEventListener('error',function(e){report('window.error',e.message,e.filename,e.lineno,e.colno,e.error&&e.error.stack);});
  window.addEventListener('unhandledrejection',function(e){const r=e.reason;report('unhandledrejection',r&&r.message||String(r),'',0,0,r&&r.stack);});
  window.setTimeout(function(){
    const app=document.getElementById('app');
    if(app && !app.innerHTML.trim() && !window.__KC_BOOT_ERROR){
      report('empty-app','Application initialization completed without rendering a screen.','','','', '');
    }
  },5000);
})();
</script>

    <script>
    // ---------- App version ----------
    const APP_VERSION = 'v2-20261004-ci-and-shuffle';

    // ---------- Debug / Dev Mode ----------
    // Hidden diagnostic screen for parents and developers.
    // Activate by tapping the version badge 5 times quickly, or
    // by adding ?debug=1 to the URL.
    let debugMode = false;
    let debugTapCount = 0;
    let debugTapTimer = null;
    function activateDebug() {
      debugMode = !debugMode;
      render();
    }
    function handleDebugTap() {
      debugTapCount++;
      if (debugTapTimer) clearTimeout(debugTapTimer);
      debugTapTimer = setTimeout(() => { debugTapCount = 0; }, 2000);
      if (debugTapCount >= 5) {
        debugTapCount = 0;
        activateDebug();
      }
    }
    function renderDebugPanel() {
      if (!debugMode) return '';
      const cacheNames = [];
      if ('caches' in self) {
        caches.keys().then(names => {
          const el = document.getElementById('debugCacheNames');
          if (el) el.textContent = names.join('\n');
        }).catch(() => {});
      }
      const swReg = navigator.serviceWorker ? 'registered' : 'unsupported';
      const offlineReady = navigator.onLine ? 'online' : 'offline';
      // Count total content
      let totalItems = 0;
      const catCounts = CATEGORIES.map(c => {
        const items = c.levels.reduce((a, l) => a + l.items.length, 0);
        totalItems += items;
        return `${c.icon} ${c.name}: ${items} items`;
      }).join('\n');
      // Find missing images
      const missingImages = [];
      CATEGORIES.forEach(c => {
        c.levels.forEach(lv => {
          lv.items.forEach(it => {
            if (it.img) {
              // We can't easily test image existence here without async,
              // but we can flag references that don't end in known extensions.
              if (!/\.(png|webp|jpg|jpeg|gif|svg)$/i.test(it.img)) {
                missingImages.push(`[format] ${c.key}/${lv.id}/${it.id}: ${it.img}`);
              }
            }
          });
        });
      });
      // Duplicate IDs per category/level
      const dupIds = [];
      CATEGORIES.forEach(c => {
        c.levels.forEach(lv => {
          const seen = new Map();
          lv.items.forEach(it => {
            if (seen.has(it.id)) dupIds.push(`[dup] ${c.key}/${lv.id}: ${it.id}`);
            seen.set(it.id, true);
          });
        });
      });
      const progressCounts = Object.entries(progress.mastery || {}).map(([k,v]) => {
        const count = typeof v === 'object' ? Object.keys(v).length : 0;
        return `${k}: ${count} items`;
      }).join('\n');
      return `
      <div style="position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;overflow:auto;padding:20px;font-family:monospace;color:#0f0;font-size:0.85rem;">
        <div style="max-width:800px;margin:0 auto;background:#111;border:2px solid #0f0;border-radius:8px;padding:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="color:#0f0;margin:0;">🛠️ Developer Debug</h2>
            <button onclick="activateDebug()" style="background:#333;color:#0f0;border:1px solid #0f0;padding:6px 12px;cursor:pointer;border-radius:4px;">Close</button>
          </div>
          <div style="margin-bottom:12px;"><strong>App version:</strong> ${APP_VERSION}</div>
          <div style="margin-bottom:12px;"><strong>Service Worker:</strong> ${swReg}</div>
          <div style="margin-bottom:12px;"><strong>Network:</strong> ${offlineReady}</div>
          <div style="margin-bottom:12px;"><strong>Cache names:</strong>\n<pre id="debugCacheNames" style="color:#ff0;">scanning...</pre></div>
          <div style="margin-bottom:12px;"><strong>Content summary:</strong>\n<pre>${catCounts}\nTotal items: ${totalItems}</pre></div>
          <div style="margin-bottom:12px;"><strong>Progress records:</strong>\n<pre>${progressCounts || 'none yet'}</pre></div>
          <div style="margin-bottom:12px;"><strong>Duplicate IDs:</strong>\n<pre>${dupIds.length ? dupIds.join('\n') : 'none detected'}</pre></div>
          <div style="margin-bottom:12px;"><strong>Image reference issues:</strong>\n<pre>${missingImages.length ? missingImages.join('\n') : 'none detected'}</pre></div>
          <div style="margin-top:16px;color:#888;font-size:0.75rem;">Tap the version badge 5x to toggle this panel.</div>
        </div>
      </div>`;
    }

    function getCategoryItems(key, level) {
        const cat = CATEGORIES.find(c => c.key === key);
        const lv = cat.levels.find(l => l.id === level) || cat.levels[0];
        return lv.items;
    }
    const PRAISE = ['Great job!','Awesome!','You got it!','Super!','Nice work!','Way to go!','Excellent!'];
    const RETRY = ['Try again!','Almost! Try again.','Not quite, try again!','Keep trying!'];
    const MASTERY_THRESHOLD = 2;
    const ROUND_LENGTH = 8;
    const TROPHIES = [10, 25, 50, 100, 200];
    const WORLD_STAGES = [
        { threshold: 0, icon: '🌱', name: 'Spawn Point', text: 'Your adventure begins!' },
        { threshold: 10, icon: '🌲', name: 'Forest', text: 'The forest is growing!' },
        { threshold: 25, icon: '🏘️', name: 'Village', text: 'Build a friendly village!' },
        { threshold: 50, icon: '⛏️', name: 'Mine', text: 'Dig deeper and discover!' },
        { threshold: 100, icon: '🏰', name: 'Castle', text: 'Your learning kingdom!' },
        { threshold: 200, icon: '🌈', name: 'Sky Realm', text: 'A whole new world!' }
    ];
    function getWorldStage(stars = progress.stars) { let stage = WORLD_STAGES[0]; for (const s of WORLD_STAGES) if (stars >= s.threshold) stage = s; return stage; }
    const WORLD_CONTENT = [
        { skills:['Letters','Sounds','Numbers'], buildings:['🏠 Starter House','🌾 Learning Farm','🪵 Crafting Table'] },
        { skills:['Words','Rhyming','Sight Words'], buildings:['🌲 Forest Library','🪵 Word Workshop','🐑 Animal Pen'] },
        { skills:['Sentences','Categories','Prepositions'], buildings:['🏘️ Village School','📚 Trading Hall','🛤️ Village Path'] },
        { skills:['Math','Measuring','Time','Money'], buildings:['⛏️ Diamond Mine','⚒️ Math Forge','🚂 Minecart Station'] },
        { skills:['Science','Patterns','3D Shapes','Sort & Classify'], buildings:['🏰 Castle Lab','🔬 Experiment Room','🗼 Shape Tower'] },
        { skills:['Chinese','Spanish','Free Play','Challenge'], buildings:['🌈 Sky Temple','☁️ Cloud Library','🚀 Adventure Port'] }
    ];
    const BUILDING_PHASES = ['🧱 Foundation','🏗️ Framing','🏠 Building','✨ Finished'];
    function getWorldSkillPercent(name) {
        const cat = CATEGORIES.find(c => c.name === name);
        if (!cat) return 0;
        const s = categoryLearningStats(cat);
        return s.total ? Math.round(s.mastered / s.total * 100) : 0;
    }
    function getBuildingPhase(percent) {
        if (percent >= 100) return { index:3, label:BUILDING_PHASES[3] };
        if (percent >= 67) return { index:2, label:BUILDING_PHASES[2] };
        if (percent >= 34) return { index:1, label:BUILDING_PHASES[1] };
        return { index:0, label:BUILDING_PHASES[0] };
    }
    function buildingVisual(name, percent) {
        const phase=getBuildingPhase(percent);
        const icons = phase.index===0 ? ['🧱','🌱'] : phase.index===1 ? ['🧱','🪵','🔨'] : phase.index===2 ? ['🏠','🪟','🚪'] : ['🏠','✨','💎'];
        return '<div class="world-building '+(phase.index===3?'finished':'')+'"><div class="building-art">'+icons.join('')+'</div><div class="building-info"><strong>'+esc(name)+'</strong><span>'+phase.label+' · '+percent+'%</span><div class="building-track"><div class="building-fill" style="width:'+percent+'%"></div></div></div></div>';
    }
    let openWorldStage = null;
    function toggleWorldStage(index) {
        const stage = WORLD_STAGES[index], stars = progress.stars;
        if (!stage || stars < stage.threshold) return;
        openWorldStage = openWorldStage === index ? null : index;
        document.querySelectorAll('.world-node').forEach((el,i) => el.classList.toggle('selected', i === openWorldStage));
        const panel = document.querySelector('.world-detail');
        if (!panel) return;
        if (openWorldStage === null) { panel.classList.remove('open'); panel.innerHTML=''; return; }
        const data = WORLD_CONTENT[index] || WORLD_CONTENT[0];
        const skills = data.skills.map(name => {
            const cat = CATEGORIES.find(c => c.name === name);
            if (!cat) return '<span class="world-skill-chip">📘 '+esc(name)+'</span>';
            const stats = categoryLearningStats(cat);
            const pct = stats.total ? Math.round(stats.mastered / stats.total * 100) : 0;
            return '<span class="world-skill-chip '+(pct===100?'mastered':'')+'">'+cat.icon+' '+esc(name)+' <b>'+pct+'%</b></span>';
        }).join('');
        const buildings = data.buildings.map(b => buildingVisual(b.slice(b.indexOf(' ')+1), Math.min(100, Math.round(data.skills.reduce((sum,name) => sum + getWorldSkillPercent(name), 0) / Math.max(1, data.skills.length))))).join('');
        panel.innerHTML='<div class="world-detail-title">'+stage.icon+' '+esc(stage.name)+' <button class="world-close" onclick="toggleWorldStage('+index+')" aria-label="Close">✕</button></div><div class="world-detail-grid"><div><div class="world-detail-label">📚 LEARNING SKILLS</div><div class="world-skills">'+skills+'</div></div><div><div class="world-detail-label">🏗️ BUILDINGS</div><div class="world-buildings">'+buildings+'</div></div></div>';
        panel.classList.remove('open'); void panel.offsetWidth; panel.classList.add('open');
    }
    function renderWorldProgress(compact = false) {
        const stars = progress.stars, stage = getWorldStage(stars), next = WORLD_STAGES.find(s => s.threshold > stars);
        const pct = next ? Math.min(100, Math.round(((stars - stage.threshold) / (next.threshold - stage.threshold)) * 100)) : 100;
        const nodes = WORLD_STAGES.map((s, i) => {
            const unlocked = stars >= s.threshold, active = i === stage.index;
            return '<button type="button" class="world-node '+(unlocked?'unlocked ':'')+(active?'active ':'')+'" '+(unlocked?'onclick="toggleWorldStage('+i+')"':'disabled')+' aria-label="'+esc(s.name)+(unlocked?', open world details':', locked')+'"><div class="world-node-icon">'+(unlocked?s.icon:'🔒')+'</div><div class="world-node-name">'+esc(s.name)+'</div><div class="world-node-threshold">'+s.threshold+' 💎</div></button>';
        }).join('<div class="world-connector"></div>');
        return '<div class="world-progress '+(compact?'compact':'')+'"><div class="world-header"><span>🗺️ <strong>My Learning World</strong></span><span>💎 '+stars+(next?' / '+next.threshold:'')+'</span></div><div class="world-map">'+nodes+'</div><div class="world-detail" aria-live="polite"></div><div class="world-track"><div class="world-fill" style="width:'+pct+'%"></div></div><div class="world-text">'+(next?next.icon+' '+esc(next.name)+' is '+(next.threshold-stars)+' diamonds away!':'🌈 Your world is fully unlocked!')+'</div></div>';
    }
    function getAccounts(){try{return JSON.parse(localStorage.getItem('kc_accounts_v1')||'{}')}catch(e){return {};}}
    function getCurrentAccount(){return localStorage.getItem('kc_current_account')||'';}
    function accountProgressKey(name){return 'kc_account_progress_v1_'+name.toLowerCase();}
    // ---------- Supabase cloud accounts (name+PIN stored server-side) ----------
    let supa = null;
    function initSupabase(deferred) {
        if (supa || !window.supabase) return;
        try {
            supa = window.supabase.createClient('https://sjqhcpbdgaeapljbllhp.supabase.co','sb_publishable_DMSaun0u7qH2pAQzupS8Ww_G780gpm9');
            window.supa = supa;
            if (deferred) {
                if (typeof refreshMembership === 'function') refreshMembership(true).catch(() => {});
                if (window.KCData) window.KCData.flushNormalized().catch(() => {});
            }
        } catch (e) {
            console.warn('Supabase init failed', e);
        }
    }
    initSupabase(false);
    window.supa = supa;
    window.__initSupabase = () => initSupabase(true);
    const supaScript = document.getElementById('supabaseScript') || document.querySelector('script[src*="supabase-js"]');
    if (supaScript && !supa) {
        supaScript.addEventListener('load', () => initSupabase(true));
        supaScript.addEventListener('error', () => {
            console.warn('Supabase CDN unreachable, running in offline mode');
        });
    }
    function getCurrentAccountName(){
        const key=getCurrentAccount();
        if(!key)return '';
        try{const accounts=getAccounts();return accounts[key]?.name || key;}catch(_){return key;}
    }
    function cacheAccount(name){
        const key=name.toLowerCase();
        try{const accounts=getAccounts();accounts[key]={name:name};localStorage.setItem('kc_accounts_v1',JSON.stringify(accounts));}catch(_){}
        const previous=localStorage.getItem('kc_current_account')||'';
        if(previous!==key&&window.KCData) window.KCData.setPlayerId('');
        localStorage.setItem('kc_current_account',key);
        return key;
    }
    // PIN protection: the PIN is never stored in localStorage or sent to Supabase as plaintext.
    const PIN_HASH_ITERATIONS=120000;
    function bytesToBase64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s);}
    function base64ToBytes(value){const s=atob(value),out=new Uint8Array(s.length);for(let i=0;i<s.length;i++)out[i]=s.charCodeAt(i);return out;}
    function constantTimeEqual(a,b){if(!a||!b||a.length!==b.length)return false;let x=0;for(let i=0;i<a.length;i++)x|=a.charCodeAt(i)^b.charCodeAt(i);return x===0;}
    async function derivePinVerifier(pin,saltB64){
        const salt=base64ToBytes(saltB64);
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
        const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:PIN_HASH_ITERATIONS,hash:'SHA-256'},material,256);
        return bytesToBase64(new Uint8Array(bits));
    }
    function makePinSalt(){
        const salt=new Uint8Array(16);crypto.getRandomValues(salt);return bytesToBase64(salt);
    }
    // Cloud account API: direct players-table reads are blocked by RLS.
    // The browser sends only a PBKDF2 verifier to the RPCs, never the PIN itself.
    let currentPinVerifier='';
    const LOGIN_MAX_ATTEMPTS=5,LOGIN_LOCKOUT_MS=30000;
    const loginAttemptState={};
    function canAttemptLogin(key){
        const s=loginAttemptState[key]||{count:0,until:0};
        if(Date.now()<s.until)return false;
        return true;
    }
    function recordLoginFailure(key){
        const s=loginAttemptState[key]||{count:0,until:0};
        s.count++;
        if(s.count>=LOGIN_MAX_ATTEMPTS){s.until=Date.now()+LOGIN_LOCKOUT_MS;s.count=0;}
        loginAttemptState[key]=s;
    }
    function clearLoginFailures(key){delete loginAttemptState[key];}
    async function cloudCreate(name,pin,progressObj){
        const pin_salt=makePinSalt();
        const pin_hash=await derivePinVerifier(pin,pin_salt);
        const {data,error}=await supa.rpc('create_player',{
            p_name:name,p_pin_hash:pin_hash,p_pin_salt:pin_salt,p_progress:progressObj||{}
        });
        if(data&&data[0]) currentPinVerifier=pin_hash;
        return {data:data&&data[0]?data[0]:null,error};
    }
    async function cloudLogin(name,pin){
        const pin_hash=await derivePinVerifier(pin, await getPinSaltForLogin(name));
        const {data,error}=await supa.rpc('login_player',{p_name:name,p_pin_hash:pin_hash});
        if(error||!data||!data[0])return null;
        currentPinVerifier=pin_hash;
        return data[0];
    }
    async function ensureNormalizedAuth(name){
        if(!supa||!currentPinVerifier)return {ok:false,reason:'missing credentials'};
        try{
            const sessionResult=await supa.auth.getSession();
            let session=sessionResult.data?.session||null;
            // Each player account gets its own anonymous Auth identity. This
            // prevents one browser session from becoming the owner of
            // multiple player accounts under the RLS ownership model.
            if(session){ await supa.auth.signOut(); session=null; }
            const anon=await supa.auth.signInAnonymously();
            if(anon.error||!anon.data?.session)return {ok:false,reason:anon.error?.message||'anonymous auth unavailable'};
            const {data,error}=await supa.rpc('claim_player_auth',{p_name:name,p_pin_hash:currentPinVerifier});
            if(error||!data)return {ok:false,reason:error?.message||'claim failed'};
            if(window.KCData) window.KCData.setPlayerId(data);
            if(window.KCData) await window.KCData.flushNormalized();
            return {ok:true,playerId:data};
        }catch(error){ return {ok:false,reason:error?.message||String(error)}; }
    }
    async function getPinSaltForLogin(name){
        const {data,error}=await supa.rpc('get_player_salt',{p_name:name});
        if(error||!data||!data[0]||!data[0].pin_salt)throw new Error('Account not found');
        return data[0].pin_salt;
    }
    async function cloudSaveProgress(name,progressObj){
        if(!supa||!name||!currentPinVerifier)return false;
        try{
            const {data,error}=await supa.rpc('save_player_progress',{
                p_name:name,p_pin_hash:currentPinVerifier,p_progress:progressObj||{}
            });
            return !error&&data===true;
        }catch(_){return false;}
    }
    let cloudSyncTimer=null;
    let cloudSyncRetryTimer=null;
    let cloudSyncInFlight=false;
    let cloudSyncPending=false;
    function setCloudSyncStatus(state){
        const el=document.getElementById('accountSyncStatus');
        if(!el)return;
        const labels={syncing:'☁️ Syncing…',saved:'☁️ Saved',offline:'⚠️ Saved locally'};
        el.textContent=labels[state]||labels.saved;
    }
    function scheduleCloudProgressSync(delay=600){
        if(!getCurrentAccount()||typeof cloudSaveProgress!=='function')return;
        cloudSyncPending=true;
        clearTimeout(cloudSyncTimer);
        cloudSyncTimer=setTimeout(syncCloudProgress,delay);
        setCloudSyncStatus('syncing');
    }
    async function syncCloudProgress(){
        if(!cloudSyncPending||cloudSyncInFlight||!getCurrentAccount())return;
        cloudSyncPending=false;
        cloudSyncInFlight=true;
        setCloudSyncStatus('syncing');
        const ok=await cloudSaveProgress(getCurrentAccountName(),progress);
        cloudSyncInFlight=false;
        if(ok){
            clearTimeout(cloudSyncRetryTimer);

    // ---------- Progress storage ----------
    function loadProgress() {
        try {
            const raw = localStorage.getItem(getCurrentAccount() ? accountProgressKey(getCurrentAccount()) : 'kc_progress_v1');
            if (raw) {
                const p = JSON.parse(raw);
                // Migrate pre-levels saves: mathCorrect used to be a single
                // number, and mastery was keyed by category only (always
                // Kindergarten content back then).
                if (typeof p.mathCorrect === 'number') p.mathCorrect = {};
                if (!p.mathCorrect || typeof p.mathCorrect !== 'object') p.mathCorrect = {};
                if (typeof p.mathStreak !== 'number') p.mathStreak = 0;
                if (p.mastery) {
                    const migrated = {};
                    for (const k in p.mastery) {
                        if (/_L\d+$/.test(k)) migrated[k] = p.mastery[k];       // already new scheme
                        else if (/_K$|_G1$/.test(k)) migrated[k] = p.mastery[k]; // old per-level key
                        else migrated[k + '_L1'] = p.mastery[k];                // old category-only key
                    }
                    p.mastery = migrated;
                } else {
                    p.mastery = {};
                }
                if (!p.due || typeof p.due !== 'object') p.due = {};
                if (!Array.isArray(p.activityLog)) p.activityLog = [];
                if (!p.gradeMastery || typeof p.gradeMastery !== 'object') p.gradeMastery = {};
                return p;
            }
        } catch (e) {}
        return { stars: 0, mastery: {}, due: {}, mathCorrect: {}, mathStreak: 0, activityLog: [], gradeMastery: {} };
    }
    function logActivity(type, key, itemId, correct, firstTry) {
        if (!Array.isArray(progress.activityLog)) progress.activityLog = [];
        progress.activityLog.push({ at: Date.now(), type, key, itemId, correct: !!correct, firstTry: !!firstTry });
        if (progress.activityLog.length > 300) progress.activityLog = progress.activityLog.slice(-300);
        if (window.KCData) window.KCData.recordActivity({
            eventType: type || 'question', lessonKey: itemId || null,
            subjectKey: key || null, correct: !!correct, firstTry: !!firstTry,
            metadata: { source: 'legacy-logActivity' }
        });
    }
    function getActivitySummary(days = 7) {
        const cutoff = Date.now() - days * 86400000;
        const recent = (progress.activityLog || []).filter(x => x.at >= cutoff);
        const byKey = {};
        recent.forEach(x => { if (!byKey[x.key]) byKey[x.key] = { key: x.key, attempts: 0, correct: 0, firstTry: 0 }; byKey[x.key].attempts++; if (x.correct) byKey[x.key].correct++; if (x.correct && x.firstTry) byKey[x.key].firstTry++; });
        return { attempts: recent.length, correct: recent.filter(x => x.correct).length, firstTry: recent.filter(x => x.correct && x.firstTry).length, days: new Set(recent.map(x => new Date(x.at).toLocaleDateString())).size, skills: Object.values(byKey).sort((a,b) => b.correct - a.correct || b.attempts - a.attempts) };
    }
    function saveProgress() {
        localStorage.setItem(getCurrentAccount() ? accountProgressKey(getCurrentAccount()) : 'kc_progress_v1', JSON.stringify(progress));
        if (window.KCData) { window.KCData.localSnapshot(progress); window.KCData.flushNormalized().catch(()=>{}); }
        if(getCurrentAccount()&&typeof cloudSaveProgress==='function') scheduleCloudProgressSync();
    }
    function todayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    function ensureDailyState() {
        if (!progress.daily || progress.daily.date !== todayKey()) {
            progress.daily = { date: todayKey(), tasks: {}, completed: false, rewardClaimed: false };
        }
        if (!progress.daily.tasks) progress.daily.tasks = {};
        if (!getDueReviewItems(1).length && !progress.daily.tasks.review) progress.daily.tasks.review = true;
        return progress.daily;
    }
    function recordDailyTask(task) {
        const d = ensureDailyState();
        if (d.tasks[task]) return false;
        d.tasks[task] = true;
        const done = ['practice','math','review'].every(t => d.tasks[t]);
        if (done && !d.completed) {
            d.completed = true;
            if (!d.rewardClaimed) {
                d.rewardClaimed = true;
                progress.stars += 5;
                progress.dailyReward = { date: d.date, stars: 5 };
            }
            updateLearningStreak();
        }
        saveProgress();
        return done;
    }
    function updateLearningStreak() {
        const d = ensureDailyState();
        if (!d.completed) return;
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yKey = yesterday.toISOString().slice(0, 10);
        const last = progress.learningStreak || { current: 0, best: 0, lastDate: null };
        if (last.lastDate === d.date) return;
        last.current = last.lastDate === yKey ? last.current + 1 : 1;
        last.best = Math.max(last.best || 0, last.current);
        last.lastDate = d.date;
        progress.learningStreak = last;
    }

    // ---------- Daily free-time limit & membership ----------
    // Free tier: DAILY_FREE_SECONDS of play per calendar day, per device.

    const DAILY_FREE_SECONDS = 600; // 10 minutes

    function usageStorageKey() { return 'kc_usage_v1_' + todayKey(); }
    function getUsageSeconds() { try { return Math.max(0, parseInt(localStorage.getItem(usageStorageKey()) || '0', 10) || 0); } catch (e) { return 0; } }
    function setUsageSeconds(s) { try { localStorage.setItem(usageStorageKey(), String(Math.max(0, Math.floor(s)))); } catch (e) {} }
    function addUsageSeconds(n) { if (n > 0) setUsageSeconds(getUsageSeconds() + n); }
    function dailyFreeSeconds() { return DAILY_FREE_SECONDS; }
    function usageRemainingSeconds() { return Math.max(0, dailyFreeSeconds() - getUsageSeconds()); }

    // Membership: the SERVER is the source of truth (Supabase), localStorage is

    // Supabase SQL editor. Until then, fetchCloudMembership() returns null and
    // the app falls back to local behavior.
    // Stable per-device id used to bind single-use membership codes.
    function getDeviceId() {
        try {
            let id = localStorage.getItem('kc_device_id_v1');
            if (!id) {
                id = (window.crypto && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : 'dev-' + Date.now() + '-' + Math.floor(Math.random() * 1e9);
                localStorage.setItem('kc_device_id_v1', id);
            }
            return id;
        } catch (e) { return 'dev-unknown'; }
    }
    const MEMBERSHIP_RECHECK_MS = 15 * 60 * 1000; // re-validate every 15 min
    let lastMembershipCheck = 0;

    function getMembership() { try { return JSON.parse(localStorage.getItem('kc_membership_v1') || 'null'); } catch (e) { return null; } }
    function isMember() { const m = getMembership(); return !!(m && m.active); }
    function unwrapRpc(data) { const d = Array.isArray(data) ? data[0] : data; return (d && typeof d === 'object') ? d : {}; }

    // Server verdict: true/false, or null when unavailable (offline, Supabase
    // failed to load, or the 008 migration hasn't been run yet).
    async function fetchCloudMembership() {
        if (!supa) return null;
        try {
            const { data, error } = await supa.rpc('check_device_membership', { p_device_id: getDeviceId() });
            if (error) return null;
            return unwrapRpc(data).is_member === true;
        } catch (e) { return null; }
    }
    // Re-validate against the server. A `false` verdict REVOKES any local flag
    // (this is what kills forged localStorage entries). `null` keeps the last
    // known state so the app still works offline. Re-renders on change.
    async function refreshMembership(force) {
        const now = Date.now();
        if (!force && now - lastMembershipCheck < MEMBERSHIP_RECHECK_MS) return isMember();
        lastMembershipCheck = now;
        const was = isMember();
        try {
            const verdict = await fetchCloudMembership();
            if (verdict === true) {
                try { localStorage.setItem('kc_membership_v1', JSON.stringify({ active: true, source: 'cloud', serverAt: now })); } catch (e) {}
            } else if (verdict === false) {
                try { localStorage.setItem('kc_membership_v1', JSON.stringify({ active: false, source: 'cloud', serverAt: now })); } catch (e) {}
            }
        } catch (e) {}
        if (isMember() !== was) { try { render(); } catch (e) {} }
        return isMember();
    }

    // child masters the item: 1d -> 3d -> 7d -> 14d.
    const SR_INTERVALS_DAYS = [1, 3, 7, 14, 30];
    function srIntervalDays(count) {
        // count = number of times correctly answered (mastery count)
        const idx = Math.max(0, Math.min(count - 1, SR_INTERVALS_DAYS.length - 1));
        return SR_INTERVALS_DAYS[idx];
    }
    function dueTimestampFor(cat, id) {
        const m = (progress.due && progress.due[cat] && progress.due[cat][id]) || 0;
        return m;
    }
    function isDue(cat, id) {
        const t = dueTimestampFor(cat, id);
        return t === 0 || Date.now() >= t;
    }
    function scheduleNextReview(cat, id, count) {
        if (!progress.due) progress.due = {};
        if (!progress.due[cat]) progress.due[cat] = {};
        const days = srIntervalDays(count);
        progress.due[cat][id] = Date.now() + days * 24 * 60 * 60 * 1000;
    }

    function getMasteryCount(cat, id) {
        return (progress.mastery[cat] && progress.mastery[cat][id]) || 0;
    }
    function bumpMastery(cat, id) {
        if (!progress.mastery[cat]) progress.mastery[cat] = {};
        const before = progress.mastery[cat][id] || 0;
        const count = before + 1;
        progress.mastery[cat][id] = count;
        scheduleNextReview(cat, id, count);
        if (count === MASTERY_THRESHOLD && before < MASTERY_THRESHOLD) {
            mcLevelUpBurst(cat);
        }
    }
    // A mistake during review knocks mastery back a step instead of leaving
    // it frozen, modeling forgetting in spaced-repetition practice.
    // (Cherry-picked from PR #2; that PR's dashboard/adventure/review-session
    // features already exist on main in newer forms.)
    function decayMastery(cat, id) {
        if (!progress.mastery[cat]) return;
        const count = progress.mastery[cat][id] || 0;
        if (count <= 0) return;
        const decayed = count - 1;
        progress.mastery[cat][id] = decayed;
        scheduleNextReview(cat, id, Math.max(1, decayed));
    }
    function mcLevelUpBurst(catKey) {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const cat = CATEGORIES.find(c => c.key === String(catKey).split('_')[0]);
        const name = cat ? cat.name : 'Skill';

        layer.className = 'mc-levelup';
        layer.innerHTML = '<div class="mc-levelup-box"><div class="mc-levelup-icon">⬆️</div><div class="mc-levelup-title">LEVEL UP!</div><div class="mc-levelup-skill">' + esc(name) + ' mastered!</div><div class="mc-levelup-reward">+2 💎</div></div>';

        speak('Level up! ' + name + ' mastered!');
    }
    function categoryMasteredCount(cat, items) {
        return items.filter(it => getMasteryCount(cat, it.id) >= MASTERY_THRESHOLD).length;
    }
    function categoryDueCount(cat, items) {
        return items.filter(it => getMasteryCount(cat, it.id) >= MASTERY_THRESHOLD && isDue(cat, it.id)).length;
    }
    function categoryLearningStats(cat) {
        let mastered = 0, learning = 0, review = 0, total = 0;
        for (const lv of cat.levels) {
            const key = `${cat.key}_${lv.id}`;
            for (const it of lv.items) {
                const count = getMasteryCount(key, it.id); total++;
                if (count >= MASTERY_THRESHOLD) { mastered++; if (isDue(key, it.id)) review++; }
                else if (count > 0) learning++;
            }
        }
        return { mastered, learning, review, total };
    }
    function skillStatus(stats) {
        if (stats.review > 0) return { icon: '🔄', label: `${stats.review} to review` };
        if (stats.learning > 0) return { icon: '🌱', label: `${stats.learning} learning` };
        if (stats.mastered === stats.total && stats.total > 0) return { icon: '🏆', label: 'Mastered' };
        return { icon: '⬜', label: 'Ready to learn' };
    }
    function renderSkillMap() {

    // ---------- Voice selection ----------
    // Browsers expose several voices per language; the default is often a
    // low-quality robotic one. Score the available voices and cache the
    // best pick per language so speech sounds as natural as possible.
    let voiceCache = {};
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => { voiceCache = {}; };
    }
    function scoreVoice(v, lang) {
        let score = 0;
        const name = v.name.toLowerCase();
        if (v.lang && v.lang.toLowerCase() === lang.toLowerCase()) score += 5;
        const goodMarkers = ['natural', 'neural', 'enhanced', 'premium', 'google', 'wavenet'];
        goodMarkers.forEach(m => { if (name.includes(m)) score += 3; });
        const knownGoodNames = ['samantha', 'tingting', 'ting-ting', 'sinji', 'mei-jia', 'monica', 'paulina', 'juan', 'jorge', 'diego', 'zosia', 'ava', 'zoe'];
        knownGoodNames.forEach(n => { if (name.includes(n)) score += 2; });
        const badMarkers = ['espeak', 'compact', 'robot'];
        badMarkers.forEach(m => { if (name.includes(m)) score -= 3; });
        if (v.localService) score += 1;
        return score;
    }
    function getBestVoice(lang) {
        if (!('speechSynthesis' in window)) return null;
        if (lang in voiceCache) return voiceCache[lang];
        const voices = window.speechSynthesis.getVoices();
        const langPrefix = lang.split('-')[0];
        const matches = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
        let best = null;
        if (matches.length) {
            best = matches.slice().sort((a, b) => scoreVoice(b, lang) - scoreVoice(a, lang))[0];
        }
        voiceCache[lang] = best;
        return best;
    }

    function playBrowserUtterance(text, lang, rate) {
        return new Promise((resolve) => {
            if (!('speechSynthesis' in window)) { resolve(); return; }
            try {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = lang; u.rate = rate || 0.85; u.pitch = 1.1;
                const voice = getBestVoice(lang);
                if (voice) u.voice = voice;
                u.onend = resolve; u.onerror = resolve;
                window.speechSynthesis.speak(u);
            } catch (e) { resolve(); }
        });
    }

    function stopAllAudio() {
        if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }

    // ---------- Descriptive praise (research: specific feedback > generic) ----------
    // Builds an item-aware confirmation instead of a random "Good job!".
    function descriptivePraise(key, q) {
        if (key === 'math') {
            if (q && q.praiseText) return q.praiseText;
            const word = (typeof MATH_WORD !== 'undefined' && MATH_WORD[q.op]) || 'plus';
            return `Correct! ${q.a} ${word} ${q.b} is ${q.answer}!`;
        }
        if (key === 'letters') {
            const it = LETTERS.find(l => l.id === q.itemId);
            return it ? `Yes! ${it.id} is for ${it.word}!` : `Correct!`;
        }
        if (key === 'numbers') {
            return `Yes! That is ${q.itemId}!`;
        }
        if (key === 'words') {
            return `Great! That is ${q.itemId}!`;
        }
        if (key === 'chinese') {
            const it = CHINESE.find(w => w.id === q.itemId);
            return it ? `对! ${it.hanzi} is ${it.en}!` : `Correct!`;
        }
        if (key === 'spanish') {
            const it = SPANISH.find(w => w.id === q.itemId);
            return it ? `¡Sí! ${it.es} is ${it.en}!` : `Correct!`;
        }
        return PRAISE[Math.floor(Math.random() * PRAISE.length)];
    }
    function descriptiveRetry(key, q) {
        if (key === 'math') {
            if (q && q.retryText) return q.retryText;
            const word = (typeof MATH_WORD !== 'undefined' && MATH_WORD[q.op]) || 'plus';
            return `Not quite — try again! ${q.a} ${word} ${q.b}?`;
        }
        return RETRY[Math.floor(Math.random() * RETRY.length)];
    }
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }
    function pickChoices(pool, correct, count) {
        const others = pool.filter(p => p.id !== correct.id);
        const chosen = shuffle(others).slice(0, count - 1).concat([correct]);
        return shuffle(chosen);
    }

    function getTodayLesson() {
        // Smart daily recommendation: prioritize due reviews, recent mistakes, learning items, then unseen skills.
        const recent = (progress.activityLog || []).filter(x => x.at >= Date.now() - 7 * 86400000);
        const errors = {};
        recent.filter(x => !x.correct).forEach(x => { errors[x.key] = (errors[x.key] || 0) + 1; });
        const candidates = [];
        for (const c of CATEGORIES) for (const lv of c.levels) {
            const catKey = `${c.key}_${lv.id}`;
            const due = lv.items.filter(it => getMasteryCount(catKey, it.id) >= MASTERY_THRESHOLD && isDue(catKey, it.id)).length;
            const learning = lv.items.filter(it => { const n=getMasteryCount(catKey,it.id); return n>0 && n<MASTERY_THRESHOLD; }).length;
            const unseen = lv.items.filter(it => getMasteryCount(catKey,it.id)===0).length;
            const recentErrors = errors[catKey] || errors[c.key] || 0;
            const score = due*6 + recentErrors*5 + learning*2 + Math.min(unseen,3)*1.5;
            if (score > 0) candidates.push({cat:c,level:lv,score,due,learning,recentErrors});
        }
        candidates.sort((a,b) => b.score-a.score);
        const best=candidates[0];
        if (best) {
            const catKey=`${best.cat.key}_${best.level.id}`;
            const item=best.level.items.find(it => {
                const n=getMasteryCount(catKey,it.id);
                return (best.recentErrors && n<MASTERY_THRESHOLD) || (n>=MASTERY_THRESHOLD && isDue(catKey,it.id)) || n===0;
            }) || null;
            const reason=best.recentErrors ? 'Let’s practice this one again!' : best.due ? 'Review time!' : best.learning ? 'Keep building your skills!' : 'A new skill awaits!';
            return {cat:best.cat,level:best.level,item,reason};
        }
        const c=CATEGORIES.find(x=>x.key==='math') || CATEGORIES[0];
        return {cat:c,level:c.levels[0],item:null,reason:'Ready for another adventure?'};
    }

    // ---------- Quiz engine ----------
    let quiz = null;
    let gradeQuiz = null;
    function startQuiz(key, level, targetId) {
        const items = getCategoryItems(key, level);
        if (!items || items.length === 0) {
            goHome();
            return;
        }
        quiz = { key, level, items, questions: [], idx: 0, correctFirstTry: 0, firstAttempt: true, awaitingNext: false, stars: 0, streak: 0, retryQueue: [], wrongAttempts: 0, usedItemIds: [] };
        // Generate one question at a time so recent performance can affect the next question.
        const q0 = buildQuestion(key, items, level, targetId, quiz.usedItemIds);
        if (!q0) {
            goHome();
            return;
        }
        quiz.questions.push(q0);
        const usedId = q0.sourceItemId || q0.itemId;
        if (usedId) quiz.usedItemIds.push(usedId);
        quiz.blipolaContext = blipola.startQuestion(quiz.questions[0]);
        quiz.blipolaRecommendation = blipola.recommend(key, targetId || quiz.questions[0].itemId);
        go('play', { key, level });
    }
    function buildQuestion(key, items, level, targetId, excludeIds = []) {
        if (!items || items.length === 0) return null;
        // Adaptive weighting (research C) + spaced repetition (B):
        // weight each item by how much it needs practice — weak / due items
        // get a higher chance of being selected; already-mastered-and-not-due
        // items are still included but down-weighted.
        const catKey = `${key}_${level}`;
        const weighted = items.map(it => {
            const count = getMasteryCount(catKey, it.id);
            const due = isDue(catKey, it.id);
            let w = 1;
            if (count === 0) w = 5;            // never seen — high priority
            else if (count < MASTERY_THRESHOLD) w = 3; // learning — medium-high
            else if (due) w = 2;                // mastered but due for review
            else w = 0.4;                       // mastered & not due — low
            return { it, w };
        });
        const excludeSet = (typeof excludeIds !== 'undefined' && excludeIds) ? (excludeIds instanceof Set ? excludeIds : new Set(excludeIds)) : null;
        const available = (excludeSet && excludeSet.size > 0) ? weighted.filter(x => !excludeSet.has(x.it.id)) : [];
        const active = available.length > 0 ? available : weighted;
        const totalW = active.reduce((a, x) => a + x.w, 0);
        let r = Math.random() * totalW, correct = active[0] ? active[0].it : null;
        for (const x of active) { r -= x.w; if (r <= 0) { correct = x.it; break; } }
        if (targetId) {
            const targetKey = (typeof targetId === 'object' && targetId) ? targetId.itemId : targetId;
            const target = items.find(it => it.id === targetId || it.id === targetKey);
            if (target) correct = target;
        }
        if (!correct) return null;
        const q = (() => {
        if (key === 'letters') {
            if (Math.random() < 0.5) {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'letter-find',
                    promptHTML: `<div class="prompt-word">Find the letter</div><div class="prompt-visual">${correct.id}</div>`,
                    speakText: `Find the letter ${correct.id}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, speak: c.id }))
                };
            } else {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'letter-phonics',
                    promptHTML: `<div class="prompt-word">Which letter does this start with?</div><div class="prompt-visual">${correct.emoji}</div>`,
                    speakText: `${correct.word}. Which letter does it start with?`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, speak: c.id }))
                };
            }
        }
        if (key === 'numbers') {
            if (Math.random() < 0.5) {
                const choices = pickChoices(items, correct, 4);
                return {
                    mode: 'number-find',
                    promptHTML: `<div class="prompt-word">Find the number</div><div class="prompt-visual">${correct.n}</div>`,
                    speakText: `Find the number ${correct.n}`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.n, speak: c.n }))
                };
            } else {
                const n = Math.min(correct.n, 10) || 1;
                const target = items.find(i => i.n === n);
                const dots = '🧱'.repeat(n);
                const near = items.filter(i => Math.abs(i.n - n) <= 3 && i.n !== n);
                const choices = shuffle(shuffle(near).slice(0, 3).concat([target]));
                return {
                    mode: 'number-count',
                    promptHTML: `<div class="prompt-word">How many blocks?</div><div class="dots-wrap">${dots}</div>`,
                    speakText: `How many blocks do you count?`,
                    itemId: target.id,
                    choices: choices.map(c => ({ id: c.id, html: c.n, speak: c.n }))
                };
            }
        }
        if (key === 'words') {
            const choices = pickChoices(items, correct, 4);
            if (Math.random() < 0.5) {
                return {
                    mode: 'word-picture',
                    promptHTML: `<div class="prompt-word">Which word says this?</div><div class="prompt-visual">${wordMediaHTML(correct, 110)}</div>`,
                    speakText: `Which word says this?`,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: c.id, cls: 'word-choice', speak: c.id }))
                };
            } else {
                return {
                    mode: 'word-sound',
                    promptHTML: `<div class="prompt-word">${correct.id}</div><button class="replay-btn" onclick="soundOutCurrentWord()">🔊 Sound it out</button>`,
                    speakText: null,
                    itemId: correct.id,
                    choices: choices.map(c => ({ id: c.id, html: wordMediaHTML(c, 90), speak: c.id }))
                };

    function handleChoice(id, btnEl) {
        if (quiz.awaitingNext) return;
        const q = quiz.questions[quiz.idx];
        const correct = id === q.itemId;
        if (quiz.blipolaContext) {
            blipola.complete(quiz.blipolaContext, {
                correct,
                firstTry: quiz.firstAttempt,
                attempts: (quiz.wrongAttempts || 0) + 1
            });
        }
        logActivity(quiz.reviewMode ? 'review' : 'quiz', q.sourceKey || quiz.key, q.itemId, correct, quiz.firstAttempt);
        if (quiz.reviewMode && !quiz.awaitingNext) {
            quiz.reviewStats.attempted += 1;
            const skillKey = q.sourceCatKey || quiz.key;
            if (!quiz.reviewStats.skills[skillKey]) quiz.reviewStats.skills[skillKey] = { key: q.sourceKey || quiz.key, level: q.sourceLevel || quiz.level, correct: 0, wrong: 0, firstTry: 0 };
        }
        if (correct) {
            btnEl.classList.add('correct');
            mcRewardBurst('⭐', '💎');
            quiz.awaitingNext = true;
            awardStar();
            quiz.stars += 1;
            if (quiz.firstAttempt) {
                bumpMastery(q.sourceCatKey || `${quiz.key}_${quiz.level}`, q.itemId);
                quiz.correctFirstTry += 1;
                if (quiz.reviewMode) { const skill = quiz.reviewStats.skills[q.sourceCatKey || quiz.key]; skill.correct += 1; skill.firstTry += 1; quiz.reviewStats.correct += 1; quiz.reviewStats.firstTry += 1; }
            } else {
                // Research F: reward persistence — celebrate the eventual success too.
                btnEl.classList.add('persist');
                if (quiz.reviewMode) { const skill = quiz.reviewStats.skills[q.sourceCatKey || quiz.key]; skill.correct += 1; quiz.reviewStats.correct += 1; }
            }
            // Streak tracking
            quiz.streak = (quiz.streak || 0) + 1;
            if (quiz.streak >= 10) { progress.stars += 10; speak('🌟 LEGENDARY! Ten in a row!'); updateStreakBadge('legendary', '🌟 LEGENDARY! +10'); }
            else if (quiz.streak >= 5) { progress.stars += 5; speak('⚡ Unstoppable! Five in a row!'); updateStreakBadge('unstoppable', '⚡ Unstoppable! +5'); }
            else if (quiz.streak >= 3) { progress.stars += 2; speak('🔥 On Fire! Three in a row!'); updateStreakBadge('fire', '🔥 On Fire! +2'); }
            saveProgress();
            confettiBurst();
            speak(descriptivePraise(q.sourceKey || quiz.key, q));
            scheduleNavigation(nextQuestion, 900);
        } else {
            btnEl.classList.add('incorrect');
            btnEl.disabled = true;
            // A first-attempt mistake on an item that was already partway
            // mastered and due for review models real forgetting: pull its
            // mastery back a step instead of leaving it frozen.
            if (quiz.firstAttempt) {
                const dcKey = q.sourceCatKey || `${quiz.key}_${quiz.level}`;
                if (getMasteryCount(dcKey, q.itemId) >= 1 && isDue(dcKey, q.itemId)) {
                    decayMastery(dcKey, q.itemId);
                }
            }
            quiz.firstAttempt = false;
            quiz.wrongAttempts = (quiz.wrongAttempts || 0) + 1;
            quiz.streak = 0;
            if (quiz.blipolaContext) {
                const message = blipola.hint(quiz.blipolaContext, quiz.wrongAttempts);
                speak(message);
            }
            if (quiz.reviewMode) {
                const retryKey = q.sourceCatKey || quiz.key;
                if (!quiz.retryQueue.some(x => x.catKey === retryKey && x.itemId === q.itemId)) quiz.retryQueue.unshift({ catKey: retryKey, itemId: q.itemId });
            } else if (!quiz.retryQueue.includes(q.itemId)) {
                quiz.retryQueue.unshift(q.itemId);
            }
            updateStreakBadge(null, '');
            speak(descriptiveRetry(q.sourceKey || quiz.key, q));
        }
        renderTopbarStarsOnly();
    }

        quiz.idx += 1;
        quiz.firstAttempt = true;
        quiz.wrongAttempts = 0;
        quiz.awaitingNext = false;
        if (quiz.idx >= ROUND_LENGTH) {
            go('roundEnd', { stars: quiz.stars, key: quiz.key, level: quiz.level });
            return;
        }
        if (quiz.reviewMode) {
            const retry = quiz.retryQueue.length ? quiz.retryQueue.shift() : null;
            let target = retry;
            if (target) target = quiz.reviewItems.find(x => x.catKey === target.catKey && x.item.id === target.itemId) || quiz.reviewItems.find(x => x.item.id === target.itemId);
            if (!target) target = quiz.reviewItems[quiz.idx % quiz.reviewItems.length];
            const items = target.cat.levels.find(lv => lv.id === target.level.id).items;
            const q = buildQuestion(target.cat.key, items, target.level.id, target.item.id);
            if (q) {
                quiz.questions[quiz.idx] = q;
                quiz.questions[quiz.idx].sourceKey = target.cat.key;
                quiz.questions[quiz.idx].sourceLevel = target.level.id;
                quiz.blipolaContext = blipola.startQuestion(quiz.questions[quiz.idx]);
                quiz.blipolaRecommendation = blipola.recommend(target.cat.key, target.item.id);
                quiz.questions[quiz.idx].sourceCatKey = target.catKey;
            }
        } else {
            const retry = quiz.retryQueue.length ? quiz.retryQueue.shift() : null;
            const retryId = retry ? (retry.itemId || retry) : null;
            if (quiz.items && quiz.usedItemIds && quiz.usedItemIds.length >= quiz.items.length) {
                quiz.usedItemIds = [];
            }
            const q = buildQuestion(quiz.key, quiz.items, quiz.level, retryId, quiz.usedItemIds);
            if (q) {
                quiz.questions[quiz.idx] = q;
                const usedId = q.sourceItemId || q.itemId;
                if (usedId && !retryId) {
                    quiz.usedItemIds.push(usedId);
                }
            }
        }
        render();
    }

    // ---------- Math game ----------
    // ---------- Math adaptive difficulty ----------
    // 3 consecutive correct answers level up; 3 consecutive wrong answers level down.
    // Clamped within MATH_LEVELS bounds (Level 1 to Level 10).
    function stepMathAdaptive(currentLevel, streak, isCorrect) {
        let lvNum = parseInt(String(currentLevel || 'L1').replace(/\D/g, ''), 10) || 1;
        let newStreak = streak || 0;
        let newLevel = currentLevel || ('L' + lvNum);
        let changed = false;

        if (isCorrect) {
            newStreak = (newStreak > 0 ? newStreak : 0) + 1;
            if (newStreak >= 3) {
                if (lvNum < 10) {
                    lvNum += 1;
                    newLevel = 'L' + lvNum;
                    changed = true;
                }
                newStreak = 0;
            }
        } else {
            newStreak = (newStreak < 0 ? newStreak : 0) - 1;
            if (newStreak <= -3) {
                if (lvNum > 1) {
                    lvNum -= 1;
                    newLevel = 'L' + lvNum;
                    changed = true;
                }
                newStreak = 0;
            }
        }
        return { level: newLevel, streak: newStreak, changed };
    }
    if (typeof window !== 'undefined') window.stepMathAdaptive = stepMathAdaptive;

    let mathState = null;
    function startMath(level) {
        level = level || 'L1';
        mathState = { idx: 0, stars: 0, level, questions: [buildMathQuestion(level)] };
        go('mathPlay', { level });
    }
    // ---------- Math operation plan by level ----------
    // Progressive difficulty: addition first, then subtraction, then
    // multiplication, then division — all four mixed by Level 10.
    function opsForLevel(lvNum) {
        if (lvNum <= 4) return ['add'];
        if (lvNum <= 7) return ['add', 'sub'];
        if (lvNum <= 9) return ['add', 'sub', 'mul'];
        return ['add', 'sub', 'mul', 'div'];
    }
    const MATH_SYMBOL = { add: '+', sub: '−', mul: '×', div: '÷' };
    const MATH_WORD = { add: 'plus', sub: 'minus', mul: 'times', div: 'divided by' };
    function buildMathQuestion(level) {
        const lvNum = parseInt(String(level).replace(/\D/g, ''), 10) || 1;
        const solved = (typeof progress !== 'undefined' && progress && progress.mathCorrect && progress.mathCorrect[level]) || 0;
        const minAnswer = (lvNum - 1) * 10 + 1;
        const maxAnswer = lvNum * 10;
        const symbols = (typeof MATH_SYMBOL !== 'undefined' && MATH_SYMBOL) || { add: '+', sub: '−', mul: '×', div: '÷' };
        const words = (typeof MATH_WORD !== 'undefined' && MATH_WORD) || { add: 'plus', sub: 'minus', mul: 'times', div: 'divided by' };
        function buildChoices(ans, minVal, pool) {
            minVal = (minVal !== undefined) ? minVal : 0;
            const wrongSet = new Set([ans]);
            if (pool && pool.length) {
                for (let i = 0; i < pool.length; i++) {
                    const item = pool[i];
                    if (item !== ans && item >= minVal) wrongSet.add(item);
                    if (wrongSet.size >= 4) break;
                }
            }
            let delta = 1;
            while (wrongSet.size < 4) {
                const cand = ans + delta;
                if (cand >= minVal && cand !== ans) wrongSet.add(cand);
                if (wrongSet.size < 4) {
                    const cand2 = ans - delta;
                    if (cand2 >= minVal && cand2 !== ans) wrongSet.add(cand2);
                }
                delta++;
            }
            return shuffle([...wrongSet]);
        }

        function renderTenFrameHTML(dots, total, color) {
            total = total || 10;
            color = color || 'var(--mc-redstone, #e04040)';
            let cells = '';
            for (let i = 0; i < total; i++) {
                if (i < dots) {
                    cells += `<div style="display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid var(--mc-border,#4a3728);border-radius:6px;width:38px;height:38px;"><span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${color};"></span></div>`;
                } else {
                    cells += `<div style="display:flex;align-items:center;justify-content:center;background:#fff;border:2px dashed #bbb;border-radius:6px;width:38px;height:38px;"></div>`;
                }
            }
            return `<div style="display:grid;grid-template-columns:repeat(5, 38px);grid-template-rows:repeat(2, 38px);gap:6px;padding:8px;background:var(--mc-sand,#efe7d3);border:3px solid var(--mc-border,#4a3728);border-radius:10px;">${cells}</div>`;
        }

        // Select question type based on pedagogical progression
        let allowedTypes;
        if (lvNum === 1) {
            // Kindergarten: balanced mix of ten-frame, object counting, comparing, missing addend, and addition
            allowedTypes = ['ten_frame', 'count', 'compare', 'missing_addend', 'add'];
        } else if (lvNum === 2) {
            allowedTypes = ['ten_frame', 'compare', 'missing_addend', 'add'];
        } else if (lvNum <= 4) {
            allowedTypes = ['compare', 'missing_addend', 'add'];
        } else {
            allowedTypes = ['compare', 'missing_addend', 'arithmetic', 'arithmetic'];
        }
        const selectedType = allowedTypes[Math.floor(Math.random() * allowedTypes.length)];

        // CCSS K.OA.A.4 / K.CC.B.5 Ten-frame counting and make-10 (Level 1 & Level 2)
        if (selectedType === 'ten_frame') {
            if (lvNum === 1) {
                const isMake10 = Math.random() < 0.5;
                if (isMake10) {
                    const given = 1 + Math.floor(Math.random() * 9);
                    const answer = 10 - given;
                    const choices = buildChoices(answer, 1);
                    const promptHTML = `<div class="math-row" style="flex-direction:column;gap:10px;">
                        <div class="prompt-word" style="font-size:1.4rem;font-weight:700;">How many more to make 10?</div>
                        ${renderTenFrameHTML(given)}
                        <div class="math-eq" style="font-size:1.6rem;margin-top:4px;"><span>${given}</span><span class="op">+</span><span class="qm">?</span><span>=</span><span>10</span></div>
                    </div>`;
                    const speakText = `There are ${given} dots. How many more to make 10?`;
                    const praiseText = `Correct! ${given} plus ${answer} makes 10!`;
                    const retryText = `Not quite — count the empty spaces to make 10!`;
                    return {
                        type: 'ten_frame',
                        op: 'add',
                        a: given,
                        b: answer,
                        answer,
                        choices,
                        promptHTML,
                        speakText,
                        praiseText,
                        retryText,
                        awaitingNext: false,
                        firstAttempt: true
                    };
                } else {
                    const answer = 1 + Math.floor(Math.random() * 10);
                    const choices = buildChoices(answer, 1);
                    const promptHTML = `<div class="math-row" style="flex-direction:column;gap:10px;">
                        <div class="prompt-word" style="font-size:1.4rem;font-weight:700;">How many dots?</div>
                        ${renderTenFrameHTML(answer)}
                    </div>`;
                    const speakText = `How many dots are in the ten-frame?`;
                    const praiseText = (answer === 1 ? `Correct! There is 1 dot in the ten-frame!` : `Correct! There are ${answer} dots in the ten-frame!`);
                    const retryText = `Not quite — count the dots in the ten-frame again!`;
                    return {
                        type: 'ten_frame',
                        op: 'add',
                        a: answer,
                        b: 0,
                        answer,
                        choices,
                        promptHTML,
                        speakText,
                        praiseText,
                        retryText,
                        awaitingNext: false,
                        firstAttempt: true
                    };
                }
            } else {
                // Level 2: CCSS K.NBT.A.1 teen numbers compose 10 + N (11-20)
                const extra = 1 + Math.floor(Math.random() * 10);
                const answer = 10 + extra;
                const choices = buildChoices(answer, minAnswer);
                const promptHTML = `<div class="math-row" style="flex-direction:column;gap:10px;">
                    <div class="prompt-word" style="font-size:1.4rem;font-weight:700;">10 + ${extra} = ?</div>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
                        ${renderTenFrameHTML(10)}
                        ${renderTenFrameHTML(extra, 10, 'var(--mc-emerald, #3fbf5f)')}
                    </div>
                </div>`;
                const speakText = `Ten plus ${extra}. How many in all?`;
                const praiseText = `Correct! 10 plus ${extra} is ${answer}!`;
                const retryText = `Not quite — what is 10 plus ${extra}?`;
                return {
                    type: 'ten_frame',
                    op: 'add',
                    a: 10,
                    b: extra,
                    answer,
                    choices,
                    promptHTML,
                    speakText,
                    praiseText,
                    retryText,
                    awaitingNext: false,
                    firstAttempt: true
                };
            }
        }

        // CCSS K.CC.B.5 Object counting with emojis (Level 1: 1-10 objects)
        if (selectedType === 'count') {
            const countObjects = [
                { emoji: '🍎', singular: 'apple', plural: 'apples' },
                { emoji: '🐛', singular: 'caterpillar', plural: 'caterpillars' },
                { emoji: '⭐', singular: 'star', plural: 'stars' },
                { emoji: '🚗', singular: 'car', plural: 'cars' },
                { emoji: '🌸', singular: 'flower', plural: 'flowers' },
                { emoji: '🎈', singular: 'balloon', plural: 'balloons' },
                { emoji: '🐱', singular: 'cat', plural: 'cats' },
                { emoji: '🐶', singular: 'dog', plural: 'dogs' },
                { emoji: '🍕', singular: 'pizza slice', plural: 'pizza slices' },
                { emoji: '🐸', singular: 'frog', plural: 'frogs' },
                { emoji: '🍪', singular: 'cookie', plural: 'cookies' },
                { emoji: '🐟', singular: 'fish', plural: 'fish' }
            ];
            const item = countObjects[Math.floor(Math.random() * countObjects.length)];
            const answer = 1 + Math.floor(Math.random() * 10);
            const name = answer === 1 ? item.singular : item.plural;
            const choices = buildChoices(answer, 1);
            const promptHTML = `<div class="math-row" style="flex-direction:column;gap:12px;">
                <div class="prompt-word" style="font-size:1.5rem;font-weight:700;">How many?</div>
                <div class="math-count-emojis" style="font-size:2.8rem;line-height:1.35;max-width:320px;text-align:center;letter-spacing:6px;word-break:break-word;">${Array(answer).fill(item.emoji).join(' ')}</div>
            </div>`;
            const speakText = `How many ${name}? Count them!`;
            const praiseText = `Correct! There ${answer === 1 ? 'is 1 ' + name : 'are ' + answer + ' ' + name}!`;
            const retryText = `Not quite — count the ${name} again!`;
            return {
                type: 'count',
                op: 'add',
                a: answer,
                b: 0,
                answer,
                choices,
                promptHTML,
                speakText,
                praiseText,
                retryText,
                awaitingNext: false,
                firstAttempt: true
            };
        }

        // CCSS K.CC.C.6 / K.CC.C.7 Number comparison (which is greater / which is less)
        if (selectedType === 'compare') {
            const n1 = minAnswer + Math.floor(Math.random() * (maxAnswer - minAnswer + 1));
            let n2 = minAnswer + Math.floor(Math.random() * (maxAnswer - minAnswer + 1));
            while (n2 === n1) {
                n2 = minAnswer + Math.floor(Math.random() * (maxAnswer - minAnswer + 1));
            }
            const isGreater = Math.random() < 0.5;
            const answer = isGreater ? Math.max(n1, n2) : Math.min(n1, n2);
            const other = isGreater ? Math.min(n1, n2) : Math.max(n1, n2);
            const phrase = isGreater ? 'Which number is greater?' : 'Which number is less?';
            const speakWord = isGreater ? 'greater' : 'less';
            const choices = buildChoices(answer, minAnswer, [other]);
            const promptHTML = `<div class="math-row" style="flex-direction:column;gap:12px;">
                <div class="prompt-word" style="font-size:1.5rem;font-weight:700;">${phrase}</div>
                <div class="math-eq" style="gap:24px;">
                    <span style="display:inline-block;padding:8px 18px;background:var(--mc-sand,#efe7d3);border:2px solid var(--mc-border,#4a3728);border-radius:12px;font-size:2.2rem;font-weight:800;">${n1}</span>
                    <span style="font-size:1.6rem;color:#888;font-weight:600;">vs</span>
                    <span style="display:inline-block;padding:8px 18px;background:var(--mc-sand,#efe7d3);border:2px solid var(--mc-border,#4a3728);border-radius:12px;font-size:2.2rem;font-weight:800;">${n2}</span>
                </div>
            </div>`;
            const speakText = `Which number is ${speakWord}: ${n1} or ${n2}?`;
            const praiseText = `Correct! ${answer} is ${speakWord} than ${other}!`;
            const retryText = `Not quite — try again! Which number is ${speakWord}: ${n1} or ${n2}?`;
            return {
                type: 'compare',
                op: 'add',
                a: n1,
                b: n2,
                answer,
                choices,
                promptHTML,
                speakText,
                praiseText,
                retryText,
                awaitingNext: false,
                firstAttempt: true
            };
        }

        // CCSS K.OA.A.4 missing addend fill-in-the-blank (e.g. 3 + ? = 7 or ? + 4 = 9)
        if (selectedType === 'missing_addend') {
            let answer, sum, a, b;
            const pos = Math.random() < 0.5 ? 'second' : 'first';
            if (lvNum === 1) {
                sum = 2 + Math.floor(Math.random() * 9); // 2..10
                const known = 1 + Math.floor(Math.random() * (sum - 1));
                answer = sum - known;
                if (pos === 'second') {
                    a = known;
                    b = answer;
                } else {
                    a = answer;
                    b = known;
                }
            } else {
                answer = minAnswer + Math.floor(Math.random() * (maxAnswer - minAnswer + 1));
                const known = 1 + Math.floor(Math.random() * 9);
                sum = known + answer;
                if (pos === 'second') {
                    a = known;
                    b = answer;
                } else {
                    a = answer;
                    b = known;
                }
            }
            const choices = buildChoices(answer, minAnswer);
            let promptHTML, speakText, praiseText, retryText;
            if (pos === 'second') {
                promptHTML = `<div class="math-row"><div class="math-eq"><span>${a}</span><span class="op">+</span><span class="qm">?</span><span>=</span><span>${sum}</span></div></div>`;
                speakText = `${a} plus what equals ${sum}?`;
                praiseText = `Correct! ${a} plus ${answer} is ${sum}!`;
                retryText = `Not quite — try again! ${a} plus what equals ${sum}?`;
            } else {
                promptHTML = `<div class="math-row"><div class="math-eq"><span class="qm">?</span><span class="op">+</span><span>${b}</span><span>=</span><span>${sum}</span></div></div>`;
                speakText = `What plus ${b} equals ${sum}?`;
                praiseText = `Correct! ${answer} plus ${b} is ${sum}!`;
                retryText = `Not quite — try again! What plus ${b} equals ${sum}?`;
            }
            return {
                type: 'missing_addend',
                op: 'add',
                a,
                b,
                answer,
                choices,
                promptHTML,
                speakText,
                praiseText,
                retryText,
                awaitingNext: false,
                firstAttempt: true
            };
        }

        // Standard arithmetic operations according to opsForLevel
        const getOps = (typeof opsForLevel === 'function') ? opsForLevel : function(lv) {
            if (lv <= 4) return ['add'];
            if (lv <= 7) return ['add', 'sub'];
            if (lv <= 9) return ['add', 'sub', 'mul'];
            return ['add', 'sub', 'mul', 'div'];
        };
        const ops = getOps(lvNum);
        const op = ops[Math.floor(Math.random() * ops.length)];
        let a, b, answer;
        if (op === 'add') {
            const minA = Math.max(2, minAnswer);
            answer = minA + Math.floor(Math.random() * (maxAnswer - minA + 1));
            a = 1 + Math.floor(Math.random() * (answer - 1));
            b = answer - a;
        } else if (op === 'sub') {
            answer = minAnswer + Math.floor(Math.random() * (maxAnswer - minAnswer + 1));
            b = 1 + Math.floor(Math.random() * Math.min(20, Math.max(9, Math.floor(maxAnswer / 2))));
            a = answer + b;
        } else if (op === 'mul') {
            const factors = [];
            for (let fa = 1; fa <= 10; fa++) {
                for (let fb = 1; fb <= 10; fb++) {
                    const prod = fa * fb;
                    if (prod >= minAnswer && prod <= maxAnswer) {
                        factors.push([fa, fb, prod]);
                    }
                }
            }
            if (factors.length > 0) {
                const pair = factors[Math.floor(Math.random() * factors.length)];
                a = pair[0];
                b = pair[1];
                answer = pair[2];
            } else {
                answer = minAnswer;
                a = 1;
                b = minAnswer;
            }
        } else { // div — always clean (no remainders)
            const candAnswers = [];
            for (let q = minAnswer; q <= maxAnswer; q++) {
                for (let d = 2; d <= 10; d++) {
                    if (d * q <= 100) candAnswers.push([d * q, d, q]);
                }
            }
            if (candAnswers.length > 0) {
                const pair = candAnswers[Math.floor(Math.random() * candAnswers.length)];
                a = pair[0];
                b = pair[1];
                answer = pair[2];
            } else {
                answer = minAnswer;
                a = minAnswer;
                b = 1;
            }
        }

        const choices = buildChoices(answer, minAnswer);
        const sym = symbols[op] || '+';
        const word = words[op] || 'plus';
        const promptHTML = `<div class="math-row"><div class="math-eq"><span>${a}</span><span class="op">${sym}</span><span>${b}</span><span>=</span><span class="qm">?</span></div></div>`;
        const speakText = `${a} ${word} ${b}. What is the answer?`;
        const praiseText = `Correct! ${a} ${word} ${b} is ${answer}!`;
        const retryText = `Not quite — try again! ${a} ${word} ${b}?`;
        return {
            type: op,
            op,
            a,
            b,
            answer,
            choices,
            promptHTML,
            speakText,
            praiseText,
            retryText,
            awaitingNext: false,
            firstAttempt: true
        };
    }
    function renderMathPlay() {
        const q = mathState.questions[mathState.idx];
        const choicesHTML = q.choices.map(n => `
            <button class="choice-btn" data-id="${n}" onclick="handleMathChoice(${n}, this)">${n}</button>
        `).join('');
        const sym = (typeof MATH_SYMBOL !== 'undefined' && MATH_SYMBOL[q.op]) || '+';
        const lvNum = parseInt(String(mathState.level).replace(/\D/g, ''), 10) || 1;
        const promptContent = q.promptHTML || `
            <div class="math-row">
                <div class="math-eq">
                    <span>${q.a}</span>
                    <span class="op">${sym}</span>
                    <span>${q.b}</span>
                    <span>=</span>
                    <span class="qm">?</span>
                </div>
            </div>`;
        return `${topbar(true)}
        <div class="center-col">
            <div style="color:#999;margin-bottom:8px;">Level ${lvNum} · Question ${mathState.idx + 1} of ${ROUND_LENGTH}</div>
            ${promptContent}
            <div class="choices">${choicesHTML}</div>
        </div>`;
    }
    function afterMathPlayRender() {
        const q = mathState.questions[mathState.idx];
        if (q && q.speakText) {
            speak(q.speakText);
            return;
        }
        const word = (typeof MATH_WORD !== 'undefined' && MATH_WORD[q.op]) || 'plus';
        speak(`${q.a} ${word} ${q.b}. What is the answer?`);
    }
    function handleMathChoice(n, btnEl) {
        const q = mathState.questions[mathState.idx];
        if (q.awaitingNext) return;
        if (n === q.answer) {
            btnEl.classList.add('correct');
            q.awaitingNext = true;
            awardStar();
            mathState.stars += 1;
            const isFirstTry = !!q.firstAttempt;
            if (isFirstTry) {
                progress.mathCorrect[mathState.level] = (progress.mathCorrect[mathState.level] || 0) + 1;
            } else {
                btnEl.classList.add('persist');
            }
            const adapt = stepMathAdaptive(mathState.level, progress.mathStreak || 0, isFirstTry);
            mathState.level = adapt.level;
            progress.mathStreak = adapt.streak;
            saveProgress();
            confettiBurst();
            speak(descriptivePraise('math', q));
            scheduleNavigation(nextMathQuestion, 900);
        } else {
            btnEl.classList.add('incorrect');
            btnEl.disabled = true;
            q.firstAttempt = false;
            speak(descriptiveRetry('math', q));
        }
        renderTopbarStarsOnly();
    }
    function nextMathQuestion() {
        mathState.idx += 1;
        if (mathState.idx >= ROUND_LENGTH) {
            go('roundEnd', { stars: mathState.stars, key: 'math', level: mathState.level });
        } else {
            mathState.questions[mathState.idx] = buildMathQuestion(mathState.level);
            render();
        }
    }

    // ---------- Write / Trace ----------
    let traceState = null;
    const TRACE_COLORS = [
        { name: 'Green', hex: '#3fbf5f' },
        { name: 'Blue', hex: '#3f8fbf' },
        { name: 'Red', hex: '#e04040' },
        { name: 'Purple', hex: '#9b59b6' },
        { name: 'Orange', hex: '#e67e22' },
        { name: 'Pink', hex: '#e84393' },
        { name: 'White', hex: '#ffffff' },
        { name: 'Gray', hex: '#808080' },
        { name: 'Tan', hex: '#d2b48c' },
    ];
    let traceColor = TRACE_COLORS[0].hex;
    function getTraceText(key, item) {
        if (key === 'spanish') return item.es;
        return item.id;
    }
    function traceFontSize(text) {
        const len = Math.max(1, text.length);
        if (len <= 2) return '8rem';
        if (len <= 4) return '6rem';
        if (len <= 6) return '4.5rem';
        return '3.5rem';
    }
    function speakTraceItem(key, item) {
        if (key === 'letters') {
            speakSequence([item.id, `${item.id} is for ${item.word}`]);
        } else if (key === 'chinese') {
            speakBilingual(item.hanzi, 'zh-CN', item.en);
        } else if (key === 'spanish') {
            speakBilingual(item.es, 'es-ES', item.en);
        } else {
            speak(item.id);
        }
    }
    function startTrace(key, level) {
        const items = getCategoryItems(key, level);
        const pool = shuffle(items).slice(0, Math.min(ROUND_LENGTH, items.length));
