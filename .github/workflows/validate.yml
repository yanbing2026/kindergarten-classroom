name: Validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript and publish readable diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p validation-report
          echo "## Validation report" | tee validation-report/summary.md
          echo "Commit: $GITHUB_SHA" | tee -a validation-report/summary.md
          echo "Run: $GITHUB_RUN_ID" | tee -a validation-report/summary.md
          overall=0

          echo "### External JavaScript" | tee -a validation-report/summary.md
          # Collect all JS files under js/, shared/, data/ plus sw.js at root
          JS_FILES=()
          while IFS= read -r f; do
            JS_FILES+=("$f")
          done < <(find js shared data -type f -name "*.js" 2>/dev/null | sort)
          if [ -f sw.js ]; then
            JS_FILES+=("sw.js")
          fi

          if [ ${#JS_FILES[@]} -eq 0 ]; then
            echo "- ⚠️ No JavaScript files found under js/, shared/, data/" | tee -a validation-report/summary.md
          else
            echo "Found ${#JS_FILES[@]} JavaScript file(s)" | tee -a validation-report/summary.md
            for jsfile in "${JS_FILES[@]}"; do
              safe_name=$(echo "$jsfile" | tr '/' '_' | tr ' ' '_')
              out="validation-report/${safe_name}.out"
              node --check "$jsfile" >"$out" 2>&1
              status=$?
              cat "$out"
              if [ $status -ne 0 ]; then
                overall=1
                echo "- ❌ $jsfile" | tee -a validation-report/summary.md
                echo '```text' >> validation-report/summary.md
                cat "$out" >> validation-report/summary.md
                echo '```' >> validation-report/summary.md
              else
                echo "- ✅ $jsfile" | tee -a validation-report/summary.md
              fi
            done
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*src=)[^>]*>(.*?)</script>", html, re.S | re.I)
          Path("/tmp/index-inline.js").write_text("\n\n".join(scripts), encoding="utf-8")
          Path("validation-report/index-inline.js").write_text("\n\n".join(scripts), encoding="utf-8")
          for i, s in enumerate(scripts):
            Path(f"/tmp/index-inline-{i}.js").write_text(s, encoding="utf-8")
            Path(f"validation-report/index-inline-{i}.js").write_text(s, encoding="utf-8")
          print(f"Found {len(scripts)} inline script block(s)")
          PY
          echo "### Inline JavaScript in index.html" | tee -a validation-report/summary.md
          node --check /tmp/index-inline.js >validation-report/index-inline.out 2>&1
          status=$?
          cat validation-report/index-inline.out
          if [ $status -ne 0 ]; then
            overall=1
            echo "- ❌ index.html inline JavaScript" | tee -a validation-report/summary.md
            echo '```text' >> validation-report/summary.md
            cat validation-report/index-inline.out >> validation-report/summary.md
            echo '```' >> validation-report/summary.md
            echo "#### Extracted source with line numbers" >> validation-report/summary.md
            echo '```text' >> validation-report/summary.md
            nl -ba validation-report/index-inline.js | sed -n '1,160p' >> validation-report/summary.md
            echo '```' >> validation-report/summary.md
          else
            echo "- ✅ index.html inline JavaScript" | tee -a validation-report/summary.md
          fi

          for f in /tmp/index-inline-*.js; do
            [ -f "$f" ] || continue
            bname=$(basename "$f")
            out="validation-report/${bname}.out"
            node --check "$f" >"$out" 2>&1
            bstatus=$?
            cat "$out"
            if [ $bstatus -ne 0 ]; then
              overall=1
              echo "- ❌ index.html inline block: $bname" | tee -a validation-report/summary.md
              echo '```text' >> validation-report/summary.md
              cat "$out" >> validation-report/summary.md
              echo '```' >> validation-report/summary.md
            else
              echo "- ✅ index.html inline block: $bname" | tee -a validation-report/summary.md
            fi
          done

          echo "### Unit tests" | tee -a validation-report/summary.md
          TEST_SCRIPTS=(
            "scripts/test_data_extraction.js"
            "scripts/test_math_adaptive.js"
            "scripts/test_math_variety.js"
            "scripts/test_build_question_weights.js"
            "scripts/test_progress_stores.js"
            "scripts/test_render_state_preservation.js"
            "scripts/test_a11y_concrete_gaps.js"
            "scripts/test_image_references.js"
            "scripts/test_freeplay_filter.js"
          )
          for test_script in "${TEST_SCRIPTS[@]}"; do
            safe_name=$(echo "$test_script" | tr '/' '_' | tr ' ' '_')
            out="validation-report/${safe_name}.out"
            node "$test_script" >"$out" 2>&1
            tstatus=$?
            cat "$out"
            if [ $tstatus -ne 0 ]; then
              overall=1
              echo "- ❌ $test_script" | tee -a validation-report/summary.md
              echo '```text' >> validation-report/summary.md
              cat "$out" >> validation-report/summary.md
              echo '```' >> validation-report/summary.md
            else
              echo "- ✅ $test_script" | tee -a validation-report/summary.md
            fi
          done

          # Optional: curriculum content validator (non-blocking, informational)
          if [ -f tools/validate_content.py ]; then
            echo "### Curriculum content validator" | tee -a validation-report/summary.md
            python3 tools/validate_content.py >validation-report/content-validator.out 2>&1
            cstatus=$?
            cat validation-report/content-validator.out
            echo '```text' >> validation-report/summary.md
            tail -n 50 validation-report/content-validator.out >> validation-report/summary.md
            echo '```' >> validation-report/summary.md
            if [ $cstatus -ne 0 ]; then
              echo "- ⚠️ content validator reported issues (informational, not failing build)" | tee -a validation-report/summary.md
            else
              echo "- ✅ content validator passed" | tee -a validation-report/summary.md
            fi
          fi

          if [ $overall -eq 0 ]; then
            echo "### Result: PASS" | tee -a validation-report/summary.md
          else
            echo "### Result: FAIL" | tee -a validation-report/summary.md
            echo "See the step summary and validation-report artifact for exact errors and source." | tee -a validation-report/summary.md
          fi
          cat validation-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $overall

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.run_id }}
          path: validation-report/
          if-no-files-found: warn
          retention-days: 14
